/* Browser/OS label from a user-agent string (client mirror of the server's
   deviceLabelFromUA, used for the login-activity table). */
function deviceLabelFromUAClient(ua){
  ua=String(ua||"");
  let b="Browser";
  if(/Edg\//.test(ua))b="Edge"; else if(/OPR\/|Opera/.test(ua))b="Opera";
  else if(/Chrome\//.test(ua))b="Chrome"; else if(/Firefox\//.test(ua))b="Firefox";
  else if(/Safari\//.test(ua))b="Safari";
  let o="device";
  if(/Windows/.test(ua))o="Windows"; else if(/Android/.test(ua))o="Android";
  else if(/iPhone|iPad|iPod/.test(ua))o="iOS"; else if(/Mac OS X|Macintosh/.test(ua))o="macOS";
  else if(/Linux/.test(ua))o="Linux";
  return b+" on "+o;
}

   ADMIN PANEL (#/admin) — Phase 6. Hidden from every menu. Non-admins get a

const money0=paise=>"₹"+Math.round((paise||0)/100).toLocaleString("en-IN");
/* Hidden diagnostics page (#/whoami): shows the CURRENT USER their own
   session state, their own profile row (via RLS) and whether /api/admin
   accepts them. Shows nothing about anyone else — safe to keep around. */
async function renderWhoAmI(){
  backBtn.hidden=false;
  app.innerHTML=`<div class="wrap page"><div class="auth"><h2>Diagnostics</h2>
    <p class="lede">What this browser's session looks like.</p>
    <div class="card" id="who-out" style="font-size:14px;line-height:2">Checking…</div></div></div>`;
  const out=document.getElementById("who-out");
  const lines=[];
  const u=sessionUser();
  lines.push(u?("1. Logged in as: <b>"+esc(u.email||u.id)+"</b>"):"1. Logged in: <b>NO</b> — log in first, then reopen #/whoami");
  if(u){
    try{
      const c=await sb();
      const {data,error}=await c.from("profiles").select("email,is_admin").limit(1);
      if(error) lines.push("2. Profile row: <b>error</b> — "+esc(error.message));
      else if(!data||!data.length) lines.push("2. Profile row: <b>MISSING</b> — run the schema backfill");
      else lines.push("2. Profile: <b>"+esc(data[0].email||"—")+"</b> · is_admin: <b>"+String(data[0].is_admin)+"</b>");
    }catch(e){ lines.push("2. Profile check failed: "+esc(String(e&&e.message||e))); }
    try{
      const r=await adminCall({action:"stats"});
      lines.push("3. /api/admin says: <b>HTTP "+r.status+"</b>"+(r.ok?" — admin access OK ✅":" — not accepted as admin"));
    }catch(e){ lines.push("3. /api/admin: network error"); }
    lines.push("4. Session id claimed: <b>"+(storedSessionId()?"yes":"no")+"</b>");
  }
  out.innerHTML=lines.join("<br>");
}
async function adminCall(payload){
  const token=await accessToken();
  return fetch("/api/admin",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+(token||"")},
    body:JSON.stringify(payload)});
}

function adminPlanBadge(plan){
  return plan==="free" ? '<span class="plan-badge free">Free</span>'

}
function planNice(p){ p=String(p||""); return p?p.charAt(0).toUpperCase()+p.slice(1):"—"; }
let admUsersCache=[], admUsersFilter="all";
function admSubChip(s){
  if(s==="halted"||s==="paused") return '<span class="pchip o">paused</span>';
  if(s==="cancel_requested") return '<span class="pchip m">ending</span>';
  if(s) return '<span class="pchip g">on</span>';
  return '<span class="pchip m">off</span>';
}
function admExpiringSoonRow(u){
  if(!u.expires_at||u.plan==="free") return false;
  const left=new Date(u.expires_at).getTime()-Date.now();
  return left>0 && left<7*86400000;
}
function admRenderUsers(){
  const host=document.getElementById("adm-users"); if(!host) return;
  const users=admUsersCache;
  const f=admUsersFilter;
  const shown=users.filter(u=>
    f==="paid"?(u.plan!=="free"&&!u.comped)
    :f==="invited"?!!u.comped
    :f==="free"?u.plan==="free"
    :f==="expiring"?admExpiringSoonRow(u)
    :f==="admins"?!!u.is_admin
    :true);
  const chips=[["all",`All ${users.length}`],["paid",`Paid ${users.filter(u=>u.plan!=="free"&&!u.comped).length}`],
    ["invited",`Invited ${users.filter(u=>u.comped).length}`],
    ["free",`Free ${users.filter(u=>u.plan==="free").length}`],
    ["expiring",`Expiring ${users.filter(admExpiringSoonRow).length}`],
    ["admins",`Admins ${users.filter(u=>u.is_admin).length}`]];
  const fh=document.getElementById("adm-filters");
  if(fh){
    fh.innerHTML=chips.map(([k,l])=>`<button type="button" data-f="${k}" class="${f===k?"on":""}">${l}</button>`).join("");
    fh.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ admUsersFilter=b.dataset.f; admRenderUsers(); }));
  }
  if(!shown.length){ host.innerHTML='<p class="lede">No users match this filter.</p>'; return; }
  host.innerHTML=`<div class="pay-wrap"><table class="pay-table">

  host.querySelectorAll(".adm-row").forEach(row=>row.addEventListener("click",()=>adminShowUser(row.dataset.uid)));

async function adminLoadUsers(q){
  const host=document.getElementById("adm-users"); if(!host) return;

  let r; try{ r=await adminCall({action:"list_users",q}); }catch(e){ host.innerHTML='<p class="lede">Could not load users.</p>'; return; }
  if(!r.ok){ host.innerHTML='<p class="lede">Could not load users.</p>'; return; }

  if(!users||!users.length){ host.innerHTML='<p class="lede">No users found.</p>'; const fh=document.getElementById("adm-filters"); if(fh) fh.innerHTML=""; return; }
  admUsersCache=users;
  admRenderUsers();
}

/* Inline confirm: turns a button into a Yes/Cancel pair (no blocking dialog). */
function adminConfirmThen(btn,text,fn){
  const holder=btn.parentNode;
  const span=document.createElement("span");
  span.className="adm-confirm";
  span.innerHTML=`<span>${esc(text)}</span> <button type="button" class="lp-btn" style="min-height:38px;padding:0 12px">Yes</button> <button type="button" class="lp-btn sec" style="min-height:38px;padding:0 12px">Cancel</button>`;
  btn.style.display="none";
  holder.appendChild(span);
  const [yes,no]=span.querySelectorAll("button");
  const cleanup=()=>{ span.remove(); btn.style.display=""; };
  yes.addEventListener("click",()=>{ cleanup(); fn(); });
  no.addEventListener("click",cleanup);
}

      if(el){el.hidden=false;el.innerHTML=`Upgrading? Your ${rem} remaining Starter day${rem===1?"":"s"} convert to about <b>${bonus} extra day${bonus===1?"":"s"} of Pro</b>, and your Starter auto-renewal stops automatically.`;}
    }catch(e){}
  })();
  const seg=document.getElementById("pr-seg");
  if(seg) seg.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{pricingPeriod=b.dataset.p;renderPricing();}));
  app.querySelectorAll("[data-checkout]").forEach(b=>b.addEventListener("click",async()=>{
    const old=b.textContent; b.disabled=true; b.textContent="Opening secure checkout…";
    // Renewal is the default (disclosed above the button, cancellable anytime).
    // startCheckout still falls back to a one-time payment when subscriptions
    // aren't available, and says so on the success screen.
    try{ await startCheckout(b.dataset.checkout, true); }
    finally{ b.disabled=false; b.textContent=old; }
  }));
  // Warm the slow parts while the user is still reading: Razorpay's checkout
  // script and the Supabase client (token refresh) both load ahead of the
  // click, so the payment window opens fast.
  if(loggedIn){ try{ loadRazorpay().catch(()=>{}); sb().catch(()=>{}); }catch(e){} }
}

/* Every control is explicitly labelled: `for`/`id` on the native inputs, and
   `aria-labelledby` + `aria-pressed` on the segmented button groups, which are
   otherwise just unlabelled buttons to a screen reader. */
function fieldHtml(f,val){
  const id="f-"+f.k, lid=id+"-l";
  if(f.t==="sel"){
    return `<label id="${lid}" for="${id}">${esc(f.label)}</label>
      <select id="${id}" data-k="${f.k}">${f.o.map(o=>
        `<option value="${o.v}"${o.v===val?" selected":""}>${esc(o.l)}</option>`).join("")}</select>`;
  }
  if(f.t==="seg"){
    return `<label id="${lid}">${esc(f.label)}</label>
      <div class="seg" data-k="${f.k}" role="group" aria-labelledby="${lid}">${f.o.map(o=>
        `<button type="button" data-v="${o.v}" class="${o.v===val?"on":""}" aria-pressed="${o.v===val}" title="${esc(o.l)}">${esc(o.l)}</button>`).join("")}</div>`;
  }
  return `<label id="${lid}" for="${id}">${esc(f.label)}</label>
    <input id="${id}" data-k="${f.k}" data-dec="${f.dec?1:0}" inputmode="${f.dec?"decimal":"numeric"}" value="${val}">${
      f.hint?`<div class="f-hint">${esc(f.hint)}</div>`:""}`;
}

function renderCalc(id){
  const c=CALCMAP[id];
  if(!c){location.hash="#/";return;}
  document.title=c.name+" — Seller Tools India";
  const md=document.querySelector('meta[name="description"]');
  if(md) md.setAttribute("content",c.desc);
  backBtn.hidden=false;

  if(state.id!==id){
    state={id};
    c.fields.forEach(f=>state[f.k]=f.d);
  }

  app.innerHTML=`
    <div class="wrap page">
      <h2>${esc(c.name)}</h2>
      <p class="lede">${esc(c.desc)}</p>
      ${helpHtml(c.id)}
      <div class="cols">
        <div class="card">
          <div class="fields">
            ${c.fields.map(f=>`<div class="${f.full?"f-full":""}">${fieldHtml(f,state[f.k])}</div>`).join("")}
          </div>
        </div>
        <div id="out"></div>
      </div>
    </div>`;

  // wire inputs
  app.querySelectorAll("input[data-k]").forEach(el=>{
    el.addEventListener("keydown",e=>{
      const ctrl=e.ctrlKey||e.metaKey;
      const nav=["Backspace","Delete","Tab","Enter","ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Home","End"];
      if(ctrl||nav.includes(e.key))return;
      if(e.key==="."&&el.dataset.dec==="1"&&!el.value.includes("."))return;
      if(/^[0-9]$/.test(e.key))return;
      e.preventDefault();
    });
    el.addEventListener("input",()=>{
      let v=el.value.replace(el.dataset.dec==="1"?/[^0-9.]/g:/[^0-9]/g,"");
      if(el.dataset.dec==="1"){
        const i=v.indexOf(".");
        if(i!==-1) v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,"");
      }
      if(v!==el.value) el.value=v;
      state[el.dataset.k]=+v||0;
      paint(c);
    });
  });
  app.querySelectorAll("select[data-k]").forEach(el=>{
    el.addEventListener("change",()=>{state[el.dataset.k]=el.value;paint(c);});
  });
  app.querySelectorAll(".seg[data-k]").forEach(seg=>{
    seg.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click",()=>{
        seg.querySelectorAll("button").forEach(x=>{
          x.classList.remove("on");
          x.setAttribute("aria-pressed","false");
        });
        b.classList.add("on");
        b.setAttribute("aria-pressed","true");
        state[seg.dataset.k]=b.dataset.v;
        paint(c);
      });
    });
  });

  paint(c);
}

function paint(c){
  const r=c.compute(state);
  let h="";

  h+=`<div class="stats">${r.stats.map(s=>
    `<div class="stat ${s.t||""}"><div class="k">${esc(s.k)}</div><div class="v">${s.v}</div></div>`).join("")}</div>`;

  if(r.banner) h+=`<div class="banner ${r.banner.t}">${esc(r.banner.x)}</div>`;

  if(r.note) h+=`<div class="note">${esc(r.note)}</div>`;

  h+=`<div class="rows">${r.rows.map(x=>
    `<div class="r ${x.mut?"mut":""} ${x.hl?"hl":""} ${x.fin?"fin":""} ${x.loss?"loss":""}">
       <span class="rl">${esc(x.l)}</span>
       <span class="rv ${x.neg?"neg":""}">${x.v}</span>
     </div>`).join("")}</div>`;

  if(r.split){
    const t=r.split.total||1;
    h+=`<div class="card panel"><h4>${esc(r.split.title)}</h4>
      <div class="bar">${r.split.items.filter(i=>i.val>0).map(i=>
        `<span style="width:${i.val/t*100}%;background:${i.color}"></span>`).join("")}</div>
      <ul class="leg">${r.split.items.map(i=>
        `<li><span class="dot" style="background:${i.color}"></span>
             <span class="nm">${esc(i.nm)}</span>
             <span class="amt">${inr(i.val)}</span>
             <span class="pc">${(i.val/t*100).toFixed(1)}%</span></li>`).join("")}</ul></div>`;
  }

  if(r.bench){
    const b=r.bench, span=(b.high-b.low)||1;
    const cl=v=>Math.max(0,Math.min(100,(v-b.low)/span*100));
    const above=b.you>=b.median;
    h+=`<div class="card panel"><h4>${esc(b.title)}</h4>
      <div class="bench-head">
        <span style="font-size:14px;font-weight:700">Net margin %</span>
        <span style="font-size:12.5px;font-weight:600;color:${above?"var(--green)":"var(--red)"}">
          ${above?"↗ Above":"↘ Below"} category median</span>
      </div>
      <div class="track"><div class="md" style="left:${cl(b.median)}%"></div>
        <div class="yo" style="left:${cl(b.you)}%"></div></div>
      <div class="scale"><span>Low ${b.low}%</span>
        <span class="me">You ${b.you.toFixed(1)}%</span>
        <span>High ${b.high}%</span></div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:10px">Category median: ${b.median}%</div>
    </div>`;
  }

  document.getElementById("out").innerHTML=h;
}

/* ============================================================
   SETTLEMENT ANALYZER
   Parser is a plain-JS mirror of app/src/settlement/parser.ts,
   verified to produce identical output to the TypeScript parser.
   Helpers are sa-prefixed so they can't collide with calculator code.
   ============================================================ */
const SA_ALIASES={
  settlementId:["settlement-id"], settlementStartDate:["settlement-start-date"],
  settlementEndDate:["settlement-end-date"], depositDate:["deposit-date"],
  totalAmount:["total-amount"], currency:["currency"],
  transactionType:["transaction-type"], orderId:["order-id"],
  merchantOrderId:["merchant-order-id"], adjustmentId:["adjustment-id"],
  shipmentId:["shipment-id"], marketplaceName:["marketplace-name"],
  amountType:["amount-type"], amountDescription:["amount-description"],
  amount:["amount"], fulfillmentId:["fulfillment-id"], postedDate:["posted-date"],
  postedDateTime:["posted-date-time"], orderItemCode:["order-item-code"],
  merchantOrderItemId:["merchant-order-item-id"],
  merchantAdjustmentItemId:["merchant-adjustment-item-id"], sku:["sku"],
  quantityPurchased:["quantity-purchased"], promotionId:["promotion-id"],

const SA_REQUIRED=["settlementId","transactionType","amountType","amountDescription","amount"];
const saNormHeader=n=>n.trim().toLowerCase().replace(/[\s_]+/g,"-");
function saMapCols(header){
  const a2k=new Map();
  for(const [k,al] of Object.entries(SA_ALIASES)) for(const a of al) a2k.set(a,k);
  const index={},unmapped=[];
  header.forEach((raw,i)=>{const k=a2k.get(saNormHeader(raw));
    if(k&&!(k in index))index[k]=i; else if(!k)unmapped.push(raw);});
  return {index,unmapped};
}
function saSplit(line,delim){
  const out=[];let f="",q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true; else if(c===delim){out.push(f);f="";} else f+=c;}
  out.push(f);return out;
}
function saParseAmount(raw,decimal="dot"){
  let s=String(raw??"").trim(); if(s==="")return 0;
  /* Excel writes negatives in brackets — "(123.45)" — and we tell people to
     re-save Amazon's .xlsx exports as CSV, so this really does arrive. Read
     the brackets as the minus sign they are; stripping them silently turned
     every fee into income. */
  let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1).trim(); }
  // Letters in a money cell mean it isn't money: say so rather than salvaging
  // digits out of it ("1e3" used to come back as 13).
  if(/[A-Za-z]/.test(s.replace(/^(inr|rs\.?)\s*/i,"")))return NaN;
  let c=s.replace(/[^\d.,-]/g,"");
  if(decimal==="comma")c=c.replace(/\./g,"").replace(",","."); else c=c.replace(/,/g,"");
  if(c===""||c==="-"||c===".")return NaN;
  const n=Number(c);
  if(!Number.isFinite(n))return NaN;
  return neg?-n:n;
}
const saCell=(fields,index,key)=>{const i=index[key];return i===undefined?"":(fields[i]??"").trim();};
/* Amazon's older report consoles hand out .xlsx. Read as text that is just zip
   bytes, so every parser rejects it and the user is told the file "isn't
   recognised" — true but useless. Spot it and say what to do instead. */
const saLooksExcel=(text,name)=>/\.xlsx?$/i.test(name||"")||/^PK/.test(String(text||"").slice(0,8));
const SA_EXCEL_MSG="that's an Excel file this browser couldn't unpack — open it and use File → Save As → CSV, then drop the CSV here.";
/* ============================================================
   XLSX READER — no library. An .xlsx is a ZIP of XML; the ZIP
   directory is parsed by hand and the deflate stream handed to
   the browser's own DecompressionStream, then the first sheet
   is flattened to CSV text and fed through the SAME parsers as
   a CSV upload. Amazon's legacy ads console only exports .xlsx,
   so "save as CSV first" was a real toll on every ad report.
   Reads only what the parsers need: shared strings, inline
   strings, booleans and raw numbers. Styles are ignored, so a
   date cell arrives as Excel's serial number — none of our
   parsers read those columns.
   ============================================================ */
async function saInflateRaw(bytes){
  const ds=new DecompressionStream("deflate-raw");
  return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
}
async function saUnzip(buf,want){
  const b=new Uint8Array(buf), dv=new DataView(buf);
  if(b.length<22) return null;
  let e=-1;             // End-of-central-directory record, searched from the tail
  for(let i=b.length-22;i>=Math.max(0,b.length-22-65536);i--)
    if(dv.getUint32(i,true)===0x06054b50){e=i;break;}
  if(e<0) return null;
  const count=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true);
  const td=new TextDecoder(), out=new Map();
  for(let i=0;i<count&&p+46<=b.length;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true),
      nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
      lho=dv.getUint32(p+42,true);
    const name=td.decode(b.subarray(p+46,p+46+nlen));
    p+=46+nlen+elen+clen;
    if(!want(name)) continue;
    const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    const start=lho+30+lnlen+lelen, comp=b.subarray(start,start+csize);
    out.set(name, method===0?comp.slice():await saInflateRaw(comp));
  }
  return out;
}
function saXlsxSharedStrings(xml){
  if(!xml) return [];
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  return [...doc.getElementsByTagName("si")].map(si=>si.textContent||"");
}
function saXlsxSheetToCsv(xml,shared){
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const colOf=ref=>{let n=0;for(const ch of ref){const c=ch.charCodeAt(0);
    if(c>=65&&c<=90)n=n*26+(c-64); else if(c>=97&&c<=122)n=n*26+(c-96); else break;}return n-1;};
  const lines=[];
  for(const row of doc.getElementsByTagName("row")){
    const arr=[];
    for(const c of row.getElementsByTagName("c")){
      const ref=c.getAttribute("r"), idx=ref?colOf(ref):arr.length;
      const t=c.getAttribute("t")||"";
      let v="";
      if(t==="inlineStr"){ const is=c.getElementsByTagName("is")[0]; v=is?is.textContent:""; }
      else{
        const ve=c.getElementsByTagName("v")[0]; v=ve?ve.textContent:"";
        if(t==="s") v=shared[Number(v)]??"";
        else if(t==="b") v=v==="1"?"TRUE":"FALSE";
      }
      while(arr.length<idx) arr.push("");
      arr[idx]=v;
    }
    lines.push(arr.map(x=>/[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x).join(","));
  }
  return lines.join("\n");
}
/* File → CSV text of the first worksheet, or null if it isn't a real .xlsx
   (an old binary .xls, a mis-named file, a browser without DecompressionStream). */
async function saXlsxToText(file){
  try{
    if(typeof DecompressionStream==="undefined") return null;
    const entries=await saUnzip(await file.arrayBuffer(),
      n=>n==="xl/sharedStrings.xml"||/^xl\/worksheets\/sheet\d+\.xml$/.test(n));
    if(!entries) return null;
    const sheetName=[...entries.keys()].filter(n=>n.startsWith("xl/worksheets/"))
      .sort((a,b)=>Number(a.match(/\d+/))-Number(b.match(/\d+/)))[0];
    if(!sheetName) return null;
    const td=new TextDecoder();
    const shared=saXlsxSharedStrings(entries.has("xl/sharedStrings.xml")?td.decode(entries.get("xl/sharedStrings.xml")):null);
    const csv=saXlsxSheetToCsv(td.decode(entries.get(sheetName)),shared);
    return csv&&csv.trim()?csv:null;
  }catch(e){ return null; }
}

/* Route a dropped file to `ingest(text)` — .xlsx through the browser ZIP
   reader (so the legacy ads console's exports just work), everything else as
   plain text. `fail(msg)` when the file cannot be read either way. */
function saReadDropped(f,ingest,fail){
  if(/\.xlsx?$/i.test(f.name)){
    saXlsxToText(f).then(csv=>{ if(csv) ingest(csv); else fail(SA_EXCEL_MSG); })
      .catch(()=>fail(SA_EXCEL_MSG));
    return;
  }
  const rd=new FileReader();
  rd.onload=()=>ingest(String(rd.result));
  rd.onerror=()=>fail("could not read the file");
  rd.readAsText(f);
}
function saGroupKey(fields,index,tt){
  const ids=saCell(fields,index,"orderId")+saCell(fields,index,"shipmentId")+saCell(fields,index,"adjustmentId");
  return [saCell(fields,index,"settlementId"),tt??saCell(fields,index,"transactionType"),
    saCell(fields,index,"orderId"),saCell(fields,index,"orderItemCode")||saCell(fields,index,"sku"),
    saCell(fields,index,"shipmentId"),saCell(fields,index,"adjustmentId"),
    /* Account-level charges carry no ids at all — keep separate charges apart
       by when they posted instead of collapsing them into one blob. */
    ids===""?saCell(fields,index,"postedDateTime")||saCell(fields,index,"postedDate"):""].join("");
}
function parseSettlement(text,opts={}){
  const errors=[],rawLines=text.split(/\r\n|\r|\n/);
  let hln=-1; for(let i=0;i<rawLines.length;i++){if(rawLines[i].trim()!==""){hln=i;break;}}
  if(hln===-1)return {summary:null,records:[],errors:[],header:[],unmappedColumns:[],missingColumns:Object.keys(SA_ALIASES)};
  const headerLine=rawLines[hln];
  const delim=opts.delimiter??(headerLine.includes("\t")?"\t":",");
  const decimal=opts.decimal??"dot";
  const header=saSplit(headerLine,delim).map(h=>h.trim());
  const {index,unmapped}=saMapCols(header);
  const missingColumns=SA_REQUIRED.filter(k=>!(k in index)).map(k=>SA_ALIASES[k][0]);
  let summary=null; const order=[],groups=new Map(),gAmt=new Map();
  const missingReq=missingColumns.length>0;
  for(let i=hln+1;i<rawLines.length;i++){
    const lineNo=i+1,raw=rawLines[i]; if(raw.trim()==="")continue;
    const fields=saSplit(raw,delim);
    if(fields.length!==header.length){errors.push({line:lineNo,reason:`Expected ${header.length} columns, got ${fields.length}`,raw});continue;}
    const tt=saCell(fields,index,"transactionType"),orderId=saCell(fields,index,"orderId"),totalRaw=saCell(fields,index,"totalAmount");
    if(tt===""&&orderId===""&&totalRaw!==""){
      if(!summary){const total=saParseAmount(totalRaw,decimal);
        if(Number.isNaN(total)){errors.push({line:lineNo,reason:`Unparseable total-amount "${totalRaw}"`,raw});continue;}
        summary={settlementId:saCell(fields,index,"settlementId"),settlementStartDate:saCell(fields,index,"settlementStartDate"),
          settlementEndDate:saCell(fields,index,"settlementEndDate"),depositDate:saCell(fields,index,"depositDate"),
          totalAmount:total,currency:saCell(fields,index,"currency")};}
      continue;
    }
    if(missingReq){errors.push({line:lineNo,reason:`Cannot parse row: missing required column(s) ${missingColumns.join(", ")}`,raw});continue;}
    /* Amazon posts account-level charges — FBA inbound transportation, storage,
       and the GST on them — with NO transaction-type at all: just an
       amount-type, a description and an amount. They usually land in the
       "Non-Transactional Fees" statement, and they are real money, so file
       them under their amount-type rather than dropping the row (which used to
       leave the statement total thousands of rupees out). */
    const ttEff=tt||(saCell(fields,index,"amount")!==""?(saCell(fields,index,"amountType")||"other-transaction"):"");
    if(ttEff===""){errors.push({line:lineNo,reason:"Row has no transaction-type",raw});continue;}
    const amount=saParseAmount(saCell(fields,index,"amount"),decimal);
    if(Number.isNaN(amount)){errors.push({line:lineNo,reason:`Unparseable amount "${saCell(fields,index,"amount")}"`,raw});continue;}
    const key=saGroupKey(fields,index,ttEff); let rec=groups.get(key);
    if(!rec){
      const qr=saCell(fields,index,"quantityPurchased"),qty=qr===""?0:Number(qr.replace(/,/g,""));
      rec={settlementId:saCell(fields,index,"settlementId"),transactionType:ttEff,orderId,
        sku:saCell(fields,index,"sku"),quantity:Number.isFinite(qty)?qty:0,
        marketplaceName:saCell(fields,index,"marketplaceName"),fulfillmentId:saCell(fields,index,"fulfillmentId"),
        postedDate:saCell(fields,index,"postedDate")||saCell(fields,index,"postedDateTime"),
        orderItemCode:saCell(fields,index,"orderItemCode"),shipmentId:saCell(fields,index,"shipmentId"),
        adjustmentId:saCell(fields,index,"adjustmentId"),promotionId:saCell(fields,index,"promotionId"),
        principal:0,amounts:[],fees:[],feeMap:{}};
      groups.set(key,rec);gAmt.set(key,[]);order.push(key);
    }
    const desc=saCell(fields,index,"amountDescription");
    if(rec.sku==="")rec.sku=saCell(fields,index,"sku");
    /* Amazon reports a multi-unit order as the SAME line group repeated once
       per unit — same order-item-code, same shipment, quantity-purchased 1 on
       each. Those rows all land in one record here, so the record's quantity
       has to be the sum over the principal rows; taking the first row's
       quantity counted a two-unit order as one, which undercounted every unit
       figure in the app and made per-unit fees look doubled. */
    {const qr=saCell(fields,index,"quantityPurchased"),qty=qr===""?0:Number(qr.replace(/,/g,""));
     if(Number.isFinite(qty)&&qty>0){
       if(/^principal$/i.test(desc)) rec._qtyPrincipal=(rec._qtyPrincipal||0)+qty;
       else if(!rec._qtyOther||qty>rec._qtyOther) rec._qtyOther=qty;
     }}
    gAmt.get(key).push({amountType:saCell(fields,index,"amountType"),amountDescription:desc,amount});
  }
  const records=order.map(key=>{
    const rec=groups.get(key),lines=gAmt.get(key);rec.amounts=lines;
    rec.quantity=rec._qtyPrincipal||rec._qtyOther||rec.quantity||0;
    delete rec._qtyPrincipal; delete rec._qtyOther;
    for(const l of lines){
      if(/^principal$/i.test(l.amountDescription))rec.principal+=l.amount;
      else{rec.fees.push(l);const d=l.amountDescription||l.amountType||"(unlabelled)";rec.feeMap[d]=(rec.feeMap[d]??0)+l.amount;}

}
/* ============================================================
   MONTHLY / CUSTOM UNIFIED TRANSACTION REPORT
   Payments -> Reports Repository. A different shape from the
   settlement flat file: a definitions preamble, then ONE row per
   transaction with a column per amount (rather than one row per
   amount line). Converted here into exactly the record shape
   parseSettlement returns, so every downstream check, bucket and
   chart works unchanged. Returns null if the text isn't this
   report, so callers can fall through to the other parsers.
   ============================================================ */
const UT_MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
/* "30 Apr 2026 9:10:58 pm UTC" -> "2026-04-30" (what saParseDate expects). */
function utDate(s){
  const m=String(s||"").trim().match(/^(\d{1,2})\s+([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{4})/);
  if(!m) return "";
  const mo=UT_MONTHS[m[2].toLowerCase()];
  return mo?`${m[3]}-${String(mo).padStart(2,"0")}-${m[1].padStart(2,"0")}`:"";
}
function parseUnifiedTransaction(text){
  const lines=String(text||"").replace(/^﻿/,"").split(/\r\n|\r|\n/);
  // The real header sits below Amazon's definitions preamble.
  let hln=-1;
  for(let i=0;i<lines.length&&i<80;i++){
    const l=lines[i].toLowerCase();
    if(l.indexOf("date/time")!==-1&&l.indexOf("settlement id")!==-1&&l.indexOf("order id")!==-1&&l.indexOf("total")!==-1){hln=i;break;}
  }
  if(hln===-1) return null;
  const header=saSplit(lines[hln],",").map(h=>h.replace(/^﻿/,"").trim());
  const norm=header.map(h=>h.toLowerCase().replace(/\s+/g," ").trim());
  const at=n=>norm.indexOf(n);
  const like=re=>norm.findIndex(h=>re.test(h));
  const I={date:at("date/time"),settle:at("settlement id"),type:at("type"),order:at("order id"),
    sku:at("sku"),desc:at("description"),qty:at("quantity"),market:at("marketplace"),
    fulfil:at("fulfillment"),sales:at("product sales"),ship:at("shipping credits"),
    gift:at("gift wrap credits"),promo:at("promotional rebates"),gst:like(/^total sales tax liable/),
    tcsC:at("tcs-cgst"),tcsS:at("tcs-sgst"),tcsI:at("tcs-igst"),tds:like(/^tds/),
    selling:at("selling fees"),fba:at("fba fees"),otherFee:at("other transaction fees"),
    other:at("other"),total:at("total")};
  if(I.type===-1||I.total===-1||I.sales===-1) return null;
  const errors=[],records=[];
  const cell=(f,i)=>i>=0&&i<f.length?String(f[i]||"").trim():"";
  // Same money reader as the flat file, so bracketed negatives and junk cells
  // behave identically wherever they turn up.
  const money=(f,i)=>{const v=saParseAmount(cell(f,i));return Number.isFinite(v)?v:0;};
  for(let i=hln+1;i<lines.length;i++){
    const raw=lines[i]; if(raw.trim()==="") continue;
    const f=saSplit(raw,",");
    if(f.length<header.length){errors.push({line:i+1,reason:`Expected ${header.length} columns, got ${f.length}`,raw});continue;}
    const type=cell(f,I.type)||"Other";
    // Transfers are payouts to the bank, not transactions against an order —
    // the flat file leaves them out of records too.
    if(/^transfer$/i.test(type)) continue;
    const desc=cell(f,I.desc);
    const amounts=[];
    const add=(label,v)=>{ if(Math.abs(v)>0.0001) amounts.push({amountType:type,amountDescription:label,amount:v}); };
    const principal=money(f,I.sales);
    // Labels chosen so saBucketOf() files each amount in the right bucket.
    add("Principal",principal);
    add("Shipping",money(f,I.ship));
    add("GiftWrap",money(f,I.gift));
    add("Promotion Rebate",money(f,I.promo));
    add("Product Tax",money(f,I.gst));
    add("TCS-CGST",money(f,I.tcsC));
    add("TCS-SGST",money(f,I.tcsS));
    add("TCS-IGST",money(f,I.tcsI));
    add("TDS (Section 194-O)",money(f,I.tds));
    add("Commission",money(f,I.selling));
    add("FBA Fees",money(f,I.fba));
    /* The "description" column in this report is the PRODUCT TITLE, not a fee
       name — using it as a label put 200-character product names in the fee
       breakdown, and saBucketOf() reads labels, so any title containing "FBA"
       or "storage" was filed as a fulfilment fee. Label these by the column
       they came from. */
    add("Other transaction fee",money(f,I.otherFee));
    add("Other",money(f,I.other));
    if(!amounts.length) continue;
    const ful=cell(f,I.fulfil).toLowerCase();
    const qty=parseInt(cell(f,I.qty).replace(/,/g,""),10);
    const rec={settlementId:cell(f,I.settle),transactionType:type,orderId:cell(f,I.order),
      sku:cell(f,I.sku),quantity:Number.isFinite(qty)?qty:0,
      marketplaceName:cell(f,I.market),
      fulfillmentId:ful.indexOf("merchant")===0||ful.indexOf("seller")===0?"MFN":(ful.indexOf("amazon")===0?"AFN":""),
      postedDate:utDate(cell(f,I.date)),orderItemCode:"",shipmentId:"",adjustmentId:"",promotionId:"",
      principal:0,amounts,fees:[],feeMap:{}};
    for(const l of amounts){
      if(/^principal$/i.test(l.amountDescription)) rec.principal+=l.amount;
      else{ rec.fees.push(l); const d=l.amountDescription||l.amountType||"(unlabelled)"; rec.feeMap[d]=(rec.feeMap[d]??0)+l.amount; }
    }
    records.push(rec);
  }
  if(!records.length) return null;
  return {summary:null,records,errors,header,unmappedColumns:[],missingColumns:[],source:"unified"};
}

function saAggregate(r){
  let sales=0,fees=0,tax=0,credits=0,ads=0,balance=0,unknown=0,allSum=0; const feeAgg={};
  for(const rec of r.records) for(const l of rec.amounts){
    allSum+=l.amount;
    const kind=saLineKind(l,rec.transactionType);
    if(kind==="principal"){sales+=l.amount;continue;}
    const label=l.amountDescription||l.amountType||"(unlabelled)";
    if(kind==="tax")tax+=l.amount;
    else if(kind==="ads")ads+=l.amount;
    else if(kind==="balance")balance+=l.amount;
    else if(kind==="unknown")unknown+=l.amount;
    else if(kind==="fee")fees+=l.amount;
    else credits+=l.amount;
    const a=feeAgg[label]||(feeAgg[label]={count:0,total:0,isTax:kind==="tax",kind});
    a.count++;a.total+=l.amount;
  }
  /* `fees` is what Amazon CHARGED for selling and fulfilling this period.
     Advertising and balance movements are returned separately and must never
     be folded back in — see saLineKind for what that mistake looked like. */
  return {sales,fees,tax,credits,ads,balance,unknown,allSum,feeAgg};
}

function saParseDate(s){
  if(!s) return null;
  s=String(s).trim().split(/[T ]/)[0];
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  /* Custom-range MTR exports write the year with two digits — "20/06/26".
     Read as a whole date these are dd/mm/yy; left unparsed they silently
     disabled every date-based check on that file. */
  m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2})$/);
  if(m){ const yy=Number(m[3]); const year=yy<70?2000+yy:1900+yy;
    return `${year}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return null;
}
const saFmtDay=iso=>new Date(iso+"T00:00:00Z").toLocaleDateString("en-IN",{day:"numeric",month:"short",timeZone:"UTC"});
function saTrend(records){
  const days=new Map();
  for(const rec of records){
    if(rec.transactionType!=="Order") continue;
    const d=saParseDate(rec.postedDate);
    if(!d) continue;
    const e=days.get(d)||{orders:0,sales:0};
    e.orders++; e.sales+=rec.principal;
    days.set(d,e);
  }
  if(!days.size) return null;
  const keys=[...days.keys()].sort();
  const out=[];
  const start=new Date(keys[0]+"T00:00:00Z").getTime(), end=new Date(keys[keys.length-1]+"T00:00:00Z").getTime();
  for(let t=start;t<=end;t+=86400000){
    const iso=new Date(t).toISOString().slice(0,10);
    const e=days.get(iso);
    out.push({d:iso,orders:e?e.orders:0,sales:e?e.sales:0});
  }
  return out;
}

/* ---- money flow: every settlement line assigned to exactly one
        named bucket, so the rows always sum to the deposit. ---- */
/* ---- ONE place that says what a settlement line IS ------------------------
   Amazon answers this in its own columns, but not always in the column you
   would expect:

   * Advertising arrives as transaction-type "ServiceFee" with amount-TYPE
     "Cost of Advertising" and an amount-DESCRIPTION of "TransactionTotalAmount"
     — an internal token that means nothing to a seller. Reading the
     description first filed real ad spend under "Other fees": on one live
     account that hid Rs 4,491.98 of advertising, 44% of gross sales and more
     than every Amazon fee put together.

   * "Payable to Amazon" and the paired "Debt adjustment against …" rows are
     movements of the seller's OWN balance — between the Electronic and the
     COD/Non-Transactional series, or carried forward from an earlier week.
     The pair nets to zero across the two statements. Counted as fees they
     showed Rs 4,183.33 of "Amazon fees" against Rs 1,696 of sales when Amazon
     had charged Rs 398; counted as credits the other half told the seller
     Amazon had reimbursed them Rs 1,639.24 that it never paid.

   Every consumer — the analyzer, the SKU report, Trends, Reconciliation —
   goes through this function so the four can never disagree again. */
const SA_ADVERTISING=/advertis/i;
const SA_BALANCE=/^payable to amazon$|^debt adjustment|reserve|^balance adjustment$/i;
/* Fees Amazon is KNOWN to charge for selling and fulfilling. A row has to look
   like one of these to be called a fee — see saLineKind for why. */
const SA_KNOWN_FEE=/commission|closing fee|referral|easy ship|weight handling|pick.*pack|postage|base fee|\bfba\b|storage|shipping (charge|fee|service)|subscription|removal|disposal|return fee|technology fee|fixed fee|variable closing|promo|labelling|prep service|inbound transport/i;
const SA_KNOWN_CREDIT=/reimburse|compensat|goodwill/i;
function saLineKind(l,tt){
  const d=(l&&l.amountDescription||"").trim(), t=(l&&l.amountType||"").trim();
  if(/^principal$/i.test(d)) return "principal";
  if(/^debt adjustment$/i.test((tt||"").trim())||SA_BALANCE.test(d)) return "balance";
  if(SA_ADVERTISING.test(t)||SA_ADVERTISING.test(d)) return "ads";
  if(saIsTax(d||t)) return "tax";
  /* Credits are checked BEFORE fees: the fee patterns are deliberately broad
     ("fba", "storage"), and "FBA Inventory Reimbursement" is money coming TO
     the seller, not a fee. Narrow, unambiguous words win over broad ones. */
  if(SA_KNOWN_CREDIT.test(d)||SA_KNOWN_CREDIT.test(t)) return "credit";
  if(SA_KNOWN_FEE.test(d)||SA_KNOWN_FEE.test(t)) return "fee";
  /* Anything we do not confidently recognise is UNKNOWN — never a fee just
     because it is negative. Amazon adds and renames payment-report descriptors
     (India changed fee categories twice in 2026 alone); the old rule
     "negative means fee, positive means credit" is how a debt adjustment
     became a fee in the first place, and it would silently do the same to the
     next new row type. Unknown rows still count towards the settlement
     reconciliation — they are real money — but are kept out of every fee and
     profit ratio, and shown to the seller so the gap is visible rather than
     absorbed. */
  return "unknown";
}
window.saLineKind=saLineKind; // exposed for verification/debugging
/* Amazon's internal tokens are not English. "TransactionTotalAmount" against a
   "Cost of Advertising" amount-type is the seller's Sponsored Ads bill; showing
   the token taught nobody anything. Only rename where the raw label is genuinely
   opaque — a seller cross-checking against Seller Central still needs to
   recognise the ordinary fee names. */
/* Amazon's transaction-type column is internal vocabulary: "other-transaction"
   and "Debt Adjustment" mean nothing to a seller. Translate for display and
   keep the raw token visible in the expanded row, so anyone cross-checking
   against Seller Central can still find it. */
/* Seller-facing category for a whole transaction row. Classification wins over
   Amazon's transaction-type: an unrecognised line must read "Not recognised"
   in the table too, or the table quietly contradicts the banner above it and
   the entire point of the unknown state — not guessing — is lost. */
function saRecordCategory(rec){
  const kinds=new Set((rec.amounts||[]).map(l=>saLineKind(l,rec.transactionType)));
  if(kinds.has("unknown")&&kinds.size===1) return "Not recognised";
  if(kinds.has("balance")&&!kinds.has("principal")) return "Account balance transfer";
  if(kinds.has("ads")&&!kinds.has("principal")) return "Sponsored Ads";
  if(/^refund/i.test(rec.transactionType||"")) return "Refund";
  if(/^order$/i.test(rec.transactionType||"")) return "Order";
  const d=((rec.amounts||[])[0]||{}).amountDescription||"";
  if(/^payable to amazon$/i.test(d.trim())) return "Previous balance payable";
  if(/easy ship/i.test(d)) return "Easy Ship charge";
  return saNiceType(rec.transactionType);
}
function saNiceType(t){
  t=(t||"").trim();
  if(/^other-transaction$/i.test(t)) return "Other Amazon charges";
  if(/^debt adjustment$/i.test(t)) return "Account balance transfer";
  if(/^servicefee$/i.test(t)) return "Service fee";
  return t;
}
function saNiceLabel(label,kind){
  const l=(label||"").trim();
  if(kind==="ads"&&/^transactiontotalamount$/i.test(l)) return "Sponsored Ads spend (billed as a service fee)";
  if(/^MFNPostagePurchaseComplete/i.test(l)) return "GST on postage you bought through Amazon"+(/IGST$/i.test(l)?" (IGST)":"");
  if(/^payable to amazon$/i.test(l)) return "Balance carried forward — what you owed Amazon at the start";
  if(/^debt adjustment against (electronic|cod)/i.test(l))
    return "Balance squared against your "+(/electronic/i.test(l)?"Electronic Transactions":"COD / Non-Transactional")+" account";
  return l;
}
function saBucketOf(lab,amt,kind){
  lab=(lab||"").trim();
  if(kind==="balance")return "balance";
  if(kind==="ads")return "ads";
  if(kind==="unknown")return "unknown";
  if(/^tcs/i.test(lab))return "tcs";
  if(/tds|194/i.test(lab))return "tds";
  if(/^product tax/i.test(lab))return "prodTax";
  if(/^shipping( tax)?( discount)?$/i.test(lab))return "shipNet";
  if(/(cgst|sgst|igst|gst)/i.test(lab))return "gstFees";
  if(/commission|closing/i.test(lab))return "referral";
  if(/easy ship|weight handling|pick.*pack|postage|base fee|fba|storage/i.test(lab))return "fulfil";
  if(/promo/i.test(lab))return "promo";
  return amt>=0?"credits":"otherFees";
}
const SA_BUCKET_NAMES={gross:"Gross product sales",refunded:"Refunded sales",promo:"Promotions funded by you",
  referral:"Referral & closing fees",fulfil:"Fulfilment & shipping fees",gstFees:"GST on Amazon fees (ITC)",
  prodTax:"Product & shipping tax (net)",shipNet:"Buyer shipping (net)",tcs:"TCS withheld",tds:"TDS u/s 194-O",
  credits:"Reimbursements & credits",otherFees:"Other fees",otherPrincipal:"Other credits",
  ads:"Advertising (Sponsored Ads)",balance:"Account balance moved between statements — not a fee",
  unknown:"Not recognised — counted in your payout, left out of the fee figures"};
function saFlow(records){
  const B={gross:0,refunded:0,promo:0,referral:0,fulfil:0,gstFees:0,prodTax:0,shipNet:0,tcs:0,tds:0,credits:0,otherFees:0,otherPrincipal:0,ads:0,balance:0,unknown:0};
  let orders=0,units=0,refunds=0,refundComm=0,orderIds=new Set();
  for(const rec of records){
    const isOrder=rec.transactionType==="Order";
    const isRefund=/refund/i.test(rec.transactionType);
    if(isOrder){orders++;units+=rec.quantity||0;if(rec.orderId)orderIds.add(rec.orderId);}
    if(rec.transactionType==="Refund")refunds++;
    for(const l of rec.amounts){
      const a=l.amount,kind=saLineKind(l,rec.transactionType);
      if(kind==="principal"){
        if(isOrder)B.gross+=a; else if(isRefund)B.refunded+=a; else B.otherPrincipal+=a;
        continue;
      }
      const bk=saBucketOf(l.amountDescription||l.amountType,a,kind);
      /* Kept alongside, never added to B — B must still sum to the deposit. */
      if(bk==="referral"&&/refund commission/i.test(l.amountDescription||"")) refundComm+=a;
      B[bk]+=a;
    }
  }
  /* `orders` counts order-ITEM groups, which is what the per-row table shows.
     `distinctOrders` is the number of real Amazon orders — on a multi-SKU
     order the two differ, and average order value must use the latter. */
  return {B,orders,units,refunds,refundComm,distinctOrders:orderIds.size||orders};
}

window.saFlow=saFlow; // exposed for verification/debugging
/* When a dropped file matches no parser, say what WAS found — the first few
   column names tell the seller instantly which report they exported, where a
   bare "not recognised" leaves them guessing. Never fail silently. */
function saDescribeColumns(text){
  const lines=String(text||"").replace(/^﻿/,"").split(/\r\n|\r|\n/);
  for(const l of lines){
    if(!l.trim()) continue;
    const d=l.includes("\t")?"\t":",";
    const cols=saSplit(l,d).map(c=>c.trim()).filter(Boolean);
    if(!cols.length) break;
    const shown=cols.slice(0,8).join(", ");
    return " Its columns are: "+shown+(cols.length>8?" … ("+cols.length+" in all)":"")
      +". That doesn't match any report this tool reads — check the input note under “How to use this tool” above.";
  }
  return "";
}

function saAskClient(){
  try{ return window.prompt("Client / account name for the report header (optional):","")||""; }catch(e){ return ""; }
}

function saClientPdf(title,srcEl){
  if(!srcEl) return;
  const client=saAskClient();
  const w=window.open("","_blank");
  if(!w){ alert("Allow pop-ups for this site to export the PDF."); return; }
  w.document.write(saPdfDocHtml(title,srcEl,client,true));
  w.document.close();
}

/* ---- Shareable PDF file -------------------------------------------------
   Renders the same report document offscreen and turns it into a real .pdf
   the seller can send to a CA or client. Everything happens in the browser:
   the file is built here and handed to the OS share sheet or saved locally —
   it is never uploaded, same as every other tool on this site. */
const HTML2CANVAS_URL="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
let h2cPromise=null;
function loadHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve();
  if(!h2cPromise) h2cPromise=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=HTML2CANVAS_URL; s.onload=()=>res(); s.onerror=()=>{h2cPromise=null;rej(new Error("load failed"));};
    document.head.appendChild(s);
  });
  return h2cPromise;
}
const saPdfFileName=(title,client)=>
  (title.replace(/[^a-z0-9]+/gi,"-")+(client?"-"+client.replace(/[^a-z0-9]+/gi,"-"):"")+"-"+
   new Date().toISOString().slice(0,10)).replace(/-+/g,"-").replace(/^-|-$/g,"").toLowerCase()+".pdf";

async function saPdfBlob(title,srcEl,client){
  await Promise.all([loadHtml2Canvas(),loadPdfLib()]);
  const A4W=794, A4H=1123;                       // A4 at 96dpi, in CSS px
  const ifr=document.createElement("iframe");
  ifr.setAttribute("aria-hidden","true");
  ifr.style.cssText="position:fixed;left:-10000px;top:0;width:"+A4W+"px;height:400px;border:0;opacity:0";
  document.body.appendChild(ifr);
  try{
    const d=ifr.contentDocument;
    d.open(); d.write(saPdfDocHtml(title,srcEl,client,false)); d.close();
    // Let layout and webfonts settle before rasterising.
    await new Promise(r=>setTimeout(r,120));
    try{ if(d.fonts&&d.fonts.ready) await d.fonts.ready; }catch(e){}
    const body=d.body;
    ifr.style.height=Math.max(400,body.scrollHeight+40)+"px";
    await new Promise(r=>setTimeout(r,60));
    const canvas=await window.html2canvas(body,{
      scale:2, backgroundColor:"#ffffff", useCORS:true, logging:false,
      windowWidth:A4W, width:A4W, height:body.scrollHeight
    });
    const {PDFDocument}=window.PDFLib;
    const doc=await PDFDocument.create();
    const PT_W=595.28, PT_H=841.89;              // A4 in points
    const sliceH=Math.round(A4H*(canvas.width/A4W));   // page height in canvas px
    for(let y=0;y<canvas.height;y+=sliceH){
      const h=Math.min(sliceH,canvas.height-y);
      const c=document.createElement("canvas");
      c.width=canvas.width; c.height=h;
      c.getContext("2d").drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
      const jpg=await doc.embedJpg(c.toDataURL("image/jpeg",0.92));
      const page=doc.addPage([PT_W,PT_H]);
      const drawH=h/canvas.width*PT_W;            // keep the width ratio
      page.drawImage(jpg,{x:0,y:PT_H-drawH,width:PT_W,height:drawH});
    }
    return new Blob([await doc.save()],{type:"application/pdf"});
  } finally { ifr.remove(); }
}

async function saSharePdf(title,srcEl,btn){
  if(!srcEl) return;
  const client=saAskClient();
  const label=btn?btn.textContent:"";
  if(btn){ btn.disabled=true; btn.textContent="Building PDF…"; }
  try{
    const blob=await saPdfBlob(title,srcEl,client);
    const name=saPdfFileName(title,client);
    const file=new File([blob],name,{type:"application/pdf"});
    // Native share sheet where the browser supports sharing files (most
    // phones); otherwise just save it, which is what a desktop user wants.
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title}); return; }
      catch(e){ if(e&&e.name==="AbortError") return; }
    }
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){
    alert("Could not build the PDF here. Use \u201cPrint / Save PDF\u201d instead \u2014 it works everywhere.");
  }finally{ if(btn){ btn.disabled=false; btn.textContent=label; } }
}

function saCsvDownload(filename,header,rows){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[header.map(q).join(",")].concat(rows.map(r=>r.map(q).join(",")));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([lines.join("\r\n")],{type:"text/csv"}));
  a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}
function saRenderResults(){
  const r=saParsed,out=document.getElementById("sa-out"); if(!out)return;
  const agg=saAggregate(r);
  const total=r.summary?r.summary.totalAmount:agg.allSum;
  /* Group by the seller-facing category, not Amazon's transaction-type, so the
     chips, the filter buttons and the table all say the same thing. */
  const byType={}; for(const rec of r.records){const c=saRecordCategory(rec); byType[c]=(byType[c]||0)+1;}
  const sv=n=>`<span class="${n<0?'amt-neg':(n>0?'amt-pos':'')}">${inr(n)}</span>`;

  const flowPre=saFlow(r.records);
  const feePct=flowPre.B.gross?Math.abs(agg.fees)/flowPre.B.gross*100:0;
  /* A negative settlement is NOT a deposit. Calling it "Deposit total" and
     printing it on a green "money in" card told the seller they had received
     ₹1,418.73 when Amazon had in fact carried a debt forward and paid nothing.
     Positive and negative settlements now get different words and different
     colour, because they are different events. */
  const paidOut=total>=0;
  /* Only tax lines that are actually present get named in the card title —
     "Taxes, GST & withholding" over a number that is purely GST on fees
     invites the seller to think TCS/TDS were withheld when they were not. */
  const taxKinds=[];
  if(Math.abs(flowPre.B.gstFees)>=0.005) taxKinds.push("GST on Amazon fees");
  if(Math.abs(flowPre.B.tcs)>=0.005) taxKinds.push("TCS");
  if(Math.abs(flowPre.B.tds)>=0.005) taxKinds.push("TDS");
  if(Math.abs(flowPre.B.prodTax+flowPre.B.shipNet)>=0.005) taxKinds.push("product tax");
  const taxTitle=taxKinds.length===1?taxKinds[0].replace(/^./,c=>c.toUpperCase()):"Taxes, GST &amp; withholding";
  let h=`<div class="stats">
    <div class="stat ${paidOut?"blue":"warn"}"><div class="k">${paidOut?"Deposited to your bank":"Net settlement balance"}</div><div class="v">${inr(total)}</div>
      <div class="sa-sub" style="margin-top:3px">${paidOut?"paid out for this statement":"⚠ no payout this statement — carried forward against your balance"}</div></div>
    <div class="stat green"><div class="k">Gross product sales</div><div class="v">${inr(flowPre.B.gross)}</div>
      <div class="sa-sub" style="margin-top:3px">${inr(agg.sales)} net after refunds</div></div>
    <div class="stat red"><div class="k">Amazon fees</div><div class="v">${inr(agg.fees)}</div>
      <div class="sa-sub" style="margin-top:3px">${flowPre.B.gross?pc(feePct)+" of "+inr(flowPre.B.gross)+" gross — selling &amp; fulfilment only":"selling &amp; fulfilment only"}</div></div>
    ${agg.ads?`<div class="stat red"><div class="k">Sponsored Ads</div><div class="v">${inr(agg.ads)}</div>
      <div class="sa-sub" style="margin-top:3px">${flowPre.B.gross?pc(Math.abs(agg.ads)/flowPre.B.gross*100)+" of gross — Sponsored Ads":"Sponsored Ads billed in this statement"}</div></div>`
      :`<div class="stat"><div class="k">${taxTitle}</div><div class="v">${inr(agg.tax)}</div></div>`}
  </div>`;

  /* Account-level adjustments as a small ledger of their own, not a paragraph.
     "Payable to Amazon" (a balance carried forward) and a cross-account
     transfer are two different mechanisms and are listed separately — merged
     into one sentence a beginner could not tell which was which. */
  const acctAdjHtml=(function(){
    if(Math.abs(agg.balance)<0.005) return "";
    const carried=[],xfer=[];
    for(const rec of r.records) for(const l of rec.amounts){
      if(saLineKind(l,rec.transactionType)!=="balance") continue;
      const d=(l.amountDescription||"").trim();
      (/^debt adjustment/i.test(d)?xfer:carried).push([d,l.amount]);
    }
    const sum=a=>a.reduce((s,x)=>s+x[1],0);
    const line=(nm,v)=>`<div class="r mut"><span class="rl">${esc(nm)}</span><span class="rv ${v<0?"neg":""}">${v<0?"−":"+"}${inr(Math.abs(v))}</span></div>`;
    return `<div class="panel" style="border-color:#f5c26b;background:#fffaf0">
      <h4>Account balance adjustments <span class="sa-sub">— net effect ${inr(agg.balance)}</span></h4>
      <p class="sa-sub" style="margin:4px 0 10px;font-size:13.5px;line-height:1.6">These change what reaches your bank, but they are <b>not Amazon selling fees</b> — they are balances being carried forward or settled between your own Amazon payment accounts. They are excluded from the fee rate and from every per-SKU profit figure.</p>
      <div class="rows">
        ${carried.length?line("Previous balance payable to Amazon",sum(carried)):""}
        ${xfer.length?line("Transfer between your Amazon payment accounts",sum(xfer)):""}
        <div class="r fin"><span class="rl">Net account adjustment</span><span class="rv ${agg.balance<0?"neg":""}">${inr(agg.balance)}</span></div>
      </div>
      ${xfer.length?`<div class="banner info" style="margin-top:10px">Upload the matching <b>${/electronic/i.test(xfer[0][0])?"Electronic Transactions":"Cash On Delivery / Non-Transactional Fees"}</b> statement for the same week and this transfer cancels to ₹0 — it is one movement shown from two sides.</div>`:""}
    </div>`;
    })();
  /* Reconciliation is an invariant, not decoration: the sum of every parsed
     line must equal Amazon's own settlement total. It is reported together
     with anything the classifier did not recognise, so a new Amazon row type
     shows up as a visible gap instead of being quietly absorbed into "fees". */
  const diff=Math.abs(agg.allSum-total),okRecon=diff<=1;
  h+=`<div class="sa-recon ${okRecon?'ok':'bad'}">
    <span>${okRecon?'✅':'⚠️'} Sum of all ${r.records.length} line items = <b>${inr(agg.allSum)}</b> —</span>
    <span>${okRecon?'matches the deposit total to the paisa.':`differs from the deposit total by ${inr(diff)}; check the file is complete.`}</span>
  </div>`;
  if(Math.abs(agg.unknown)>=0.005)
    h+=`<div class="banner warn" style="text-align:left"><b>${inr(agg.unknown)}</b> of this settlement is a transaction type this tool does not recognise yet. It <b>is</b> included in the payout reconciliation above — it is real money — but it is deliberately left out of the fee and profit figures, because guessing what it was is how a number becomes wrong. You can see the exact labels in the breakdown below, marked “Not recognised”. If you tell us what they are we'll add them: <a href="/contact">contact</a>.</div>`;

  if(r.summary)
    h+=`<div class="panel"><div class="sa-sub" style="font-size:13px">Settlement <b>${esc(r.summary.settlementId)}</b> · ${esc(r.summary.settlementStartDate)} → ${esc(r.summary.settlementEndDate)} · deposited ${esc(r.summary.depositDate)}${agg.credits?` · credits &amp; reimbursements ${inr(agg.credits)}`:""}</div></div>`;

  // Business stats + money flow (every line in exactly one bucket).
  const flow=flowPre;
  const FB=flow.B;
  const flowSum=Object.values(FB).reduce((s,x)=>s+x,0);
  h+=`<div class="stats" style="margin-top:14px">
    <div class="stat"><div class="k">Orders · Units</div><div class="v">${flow.distinctOrders} · ${flow.units}</div></div>
    <div class="stat"><div class="k">Gross avg order value</div><div class="v">${flow.distinctOrders?inr(FB.gross/flow.distinctOrders):"—"}</div>
      <div class="sa-sub" style="margin-top:3px">before refunds</div></div>
    <div class="stat ${FB.gross&&Math.abs(FB.refunded)/FB.gross>0.1?"red":""}"><div class="k">Refund rate (by value)</div><div class="v">${FB.gross?(Math.abs(FB.refunded)/FB.gross*100).toFixed(1)+"%":"—"}</div></div>
    <div class="stat green"><div class="k">GST charged on Amazon fees</div><div class="v">${inr(Math.abs(Math.min(0,FB.gstFees)))}</div>
      <div class="sa-sub" style="margin-top:3px">may be claimable as input tax credit — check with your CA</div></div>
  </div>`;
  const rowsFlow=[
    ["Gross product sales",FB.gross],
    ["Refunded sales",FB.refunded],
    ["Promotions funded by you",FB.promo],
    /* Naming a bucket "Referral & closing fees" when the statement contains no
       referral fee at all (sub-Rs 1,000 items pay 0%) taught the seller a fee
       existed that did not. Split the two so the refund's own charge is visible. */
    ["Closing fees",FB.referral-flow.refundComm],
    ["Refund commission — Amazon's charge for processing the refund",flow.refundComm],
    ["Fulfilment & shipping fees",FB.fulfil],
    ["Advertising (Sponsored Ads)",FB.ads],
    ["GST charged on Amazon fees — may be claimable as ITC, check with your CA",FB.gstFees],
    ["Product & shipping tax collected (net)",FB.prodTax+FB.shipNet],
    ["TCS withheld (claim in GSTR-2A/8A)",FB.tcs],
    ["TDS u/s 194-O (visible in Form 26AS)",FB.tds],
    ["Reimbursements & credits",FB.credits+FB.otherPrincipal],
    ["Other fees",FB.otherFees],
    ["Account balance adjustments — itemised below; not an Amazon fee",FB.balance],
    ["Not recognised — in your payout, but left out of the fee figures below",FB.unknown],
  ].filter(x=>Math.abs(x[1])>=0.005);
  h+=`<div class="panel"><h4>Where the money went <span class="sa-sub">— every line of the settlement in one bucket; adds up to your deposit</span></h4>
    <div class="rows">${rowsFlow.map(([l,v])=>`<div class="r mut"><span class="rl">${esc(l)}</span><span class="rv ${v<0?"neg":""}">${v<0?"−":"+"}${inr(Math.abs(v))}</span></div>`).join("")}
    <div class="r fin"><span class="rl">${paidOut?"Deposited to your bank":"Net settlement balance — no payout, carried forward"}</span><span class="rv ${flowSum<0?"neg":""}">${inr(flowSum)}</span></div></div>
    ${acctAdjHtml}
    ${Math.abs(flowSum-total)>0.01?`<div class="banner warn" style="margin-top:12px">Bucket sum differs from the deposit by ${inr(Math.abs(flowSum-total))} — please report this file so we can improve the mapping.</div>`:""}
  </div>`;
  if(r.missingColumns.length)
    h+=`<div class="banner warn">Missing expected columns: ${r.missingColumns.map(esc).join(", ")}.</div>`;

  const trend=saTrend(r.records);
  if(trend&&trend.length>1){
    /* Two bar charts over eight days and four orders occupy a screen and teach
       nothing. Below a usable sample the panel collapses to a summary line the
       seller can open if they want it. */
    const thinTrend=flow.distinctOrders<10||trend.length<10;
    h+=`<${thinTrend?"details":"div"} class="panel">${thinTrend
      ?`<summary style="cursor:pointer;font-weight:700;font-size:15px">Daily trend <span class="sa-sub" style="font-weight:400">— ${flow.distinctOrders} order${flow.distinctOrders===1?"":"s"} across ${trend.length} days; too few to read a pattern, open if you want the bars</span></summary>`
      :`<h4>Daily trend <span class="sa-sub">— hover a bar for the exact figure; the full data is in the transactions table below</span></h4>`}<div class="vizgrid">${
      saBarChart("Orders per day",trend,"orders","#2f5af0",v=>v+(v===1?" order":" orders"))
    }${
      saBarChart("Product sales per day",trend,"sales","#16a34a",v=>inr(v))
    }</div></${thinTrend?"details":"div"}>`;
  }

  h+=`<div class="panel"><h4>Transactions by type</h4><div class="chips">${
    Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<span class="chip${t==="Not recognised"?" warnchip":""}">${esc(t)} · ${n}</span>`).join("")||'<span class="sa-sub">none</span>'
  }</div></div>`;

  const feeRows=Object.entries(agg.feeAgg).sort((a,b)=>Math.abs(b[1].total)-Math.abs(a[1].total));
  h+=`<div class="panel"><h4>Fee &amp; deduction breakdown <span class="sa-sub">— by label, across the whole settlement</span></h4>
    <div class="tblwrap"><table class="sa">
      <thead><tr><th>Label</th><th>Category</th><th class="num">Lines</th><th class="num">Total</th></tr></thead>
      <tbody>${feeRows.map(([label,a])=>`<tr>
        <td>${esc(saNiceLabel(label,a.kind))}</td>
        <td>${a.kind==="tax"?'<span class="chip tax">Tax / GST</span>'
          :a.kind==="ads"?'<span class="chip">Advertising</span>'
          :a.kind==="balance"?'<span class="chip">Balance moved — not a fee</span>'
          :a.kind==="credit"?'<span class="chip">Credit</span>'
          /* An unrecognised line must NEVER be badged "Fee" — that is the one
             assertion the unknown state exists to avoid making. */
          :a.kind==="unknown"?'<span class="chip warnchip">⚠ Not recognised</span>'
          :'<span class="chip">Fee</span>'}</td>
        <td class="num">${a.count}</td><td class="num">${sv(a.total)}</td></tr>`).join("")}</tbody>
    </table></div></div>`;

  const types=["all",...Object.keys(byType)];
  h+=`<div class="panel"><h4>Transactions <span class="sa-sub">(${r.records.length})</span></h4>
    <div class="filterbar">${types.map(t=>`<button class="fbtn ${t===saFilter?'on':''}" data-type="${esc(t)}">${t==='all'?'All':esc(t)}</button>`).join("")}
      <input id="sa-q" type="search" value="${esc(saQuery)}" placeholder="Filter by order ID or SKU" style="min-width:200px;flex:1;max-width:320px;padding:7px 11px;font-size:13px">
      <button class="fbtn" id="sa-csv" title="Every amount line of this settlement, one row each — ready for Excel">⬇ Export CSV</button></div>`;
  const q=saQuery.trim().toLowerCase();
  const filtered=r.records.filter(rec=>(saFilter==='all'||saRecordCategory(rec)===saFilter)
    &&(!q||(rec.orderId||"").toLowerCase().includes(q)||(rec.sku||"").toLowerCase().includes(q)));
  const shown=filtered.slice(0,saLimit);
  h+=`<div class="tblwrap"><table class="sa">
    <thead><tr><th></th><th>Type</th><th>Order</th><th>SKU</th><th class="num">Qty</th><th>Fulfil</th><th class="num">Principal</th><th class="num">Fees</th></tr></thead><tbody>`;
  shown.forEach((rec,i)=>{
    const feeTotal=Object.values(rec.feeMap).reduce((s,x)=>s+x,0);
    const hasDetail=Object.keys(rec.feeMap).length>0;
    h+=`<tr class="exp ${hasDetail?'':'nodetail'}" data-i="${i}">
      <td>${hasDetail?'<span class="caret">▶</span>':''}</td>
      <td title="Amazon transaction-type: ${esc(rec.transactionType)}">${esc(saRecordCategory(rec))}</td><td>${esc(rec.orderId||'—')}</td>
      <td>${esc(rec.sku||'—')}</td><td class="num">${rec.quantity||''}</td>
      <td>${esc(rec.fulfillmentId||'—')}</td>
      <td class="num">${sv(rec.principal)}</td><td class="num">${sv(feeTotal)}</td></tr>`;
    if(hasDetail)
      h+=`<tr class="detail" id="sa-d-${i}" style="display:none"><td colspan="8"><div class="grid2">${
        Object.entries(rec.feeMap).map(([d,a])=>`<div class="fl"><span class="l">${esc(d)}</span><span class="v ${a<0?'amt-neg':'amt-pos'}">${inr(a)}</span></div>`).join("")
      }</div></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  if(filtered.length>saLimit)
    h+=`<button class="showmore" id="sa-more">Show more — ${saLimit} of ${filtered.length} shown</button>`;
  h+=`</div>`;

  if(r.errors.length)
    h+=`<div class="banner warn"><b>${r.errors.length} malformed row(s)</b> — reported, not dropped:<br>${
      r.errors.slice(0,20).map(e=>`line ${e.line}: ${esc(e.reason)}`).join("<br>")
    }${r.errors.length>20?`<br>… and ${r.errors.length-20} more`:""}</div>`;
  else
    h+=`<div class="banner good">✅ Every one of the ${r.records.length} records parsed cleanly — no malformed rows.</div>`;

  /* Every figure above, stated as arithmetic — so a seller (or their CA) can
     re-derive any number by hand and trust the rest. */
  h+=`<details class="howto"><summary>How every number here is computed</summary><div class="hbody">
    <span class="htag">Formulas</span>
    <ol>
      <li><b>Deposit total</b> = the sum of every amount line in the file. The reconciliation banner compares that sum against Amazon's own total-amount row — they must match to the paisa, or the file is incomplete.</li>
      <li><b>Net product sales</b> = Principal lines on orders + Principal lines on refunds (refunds are negative).</li>
      <li><b>Amazon fees</b> = every negative non-tax line: referral, closing, fulfilment, shipping, ads, storage and the rest — each visible under its own label in the fee breakdown.</li>
      <li><b>Refund rate (by value)</b> = |refunded principal| ÷ gross principal. Count-based return rate can differ.</li>
      <li><b>GST on fees (ITC)</b> = the CGST/SGST/IGST charged on Amazon's fees. A GST-registered seller claims this back in GSTR-3B — it is not money lost.</li>
      <li><b>Where the money went</b> files every line into exactly one bucket, so the buckets always add up to the deposit. Nothing is estimated; if a label is unrecognised it lands in "Other" rather than being guessed at.</li>
    </ol>
  </div></details>`;
  {
    const refPct=FB.gross?Math.abs(FB.refunded)/FB.gross*100:0;
    const itc=Math.abs(Math.min(0,FB.gstFees));
    const acts=[];
    if(refPct>10) acts.push(["hot","High refund value",

      "#/sku-report","Find the SKUs →"]);
    if(agg.ads&&FB.gross&&Math.abs(agg.ads)>Math.abs(agg.fees)) acts.push(["hot","Sponsored Ads exceed selling \u0026 fulfilment fees",
      `You paid <b>${inr(Math.abs(agg.ads))}</b> in Sponsored Ads against <b>${inr(Math.abs(agg.fees))}</b> in Amazon selling fees. Whether that is worth it depends on what the ads sold.`,

      "#/trends","See it month by month →"]);
    if(itc>0) acts.push(["","GST on Amazon fees",
      `<b>${inr(itc)}</b> of GST was charged on Amazon's fees. Your CA can tell you how much of it you can claim as input tax credit.`,
      "#/gst-report","Open the GST report →"]);
    acts.push(["","Check Amazon charged you correctly",
      "Every fee in this statement can be audited against Amazon's published rate card — and refunds sometimes owe you a fee credit that never arrived.",
      "#/reconcile","Run the fee audit →"]);
    h+=`<div class="panel"><h4>What should I do next?</h4>
      <div class="acts">${acts.slice(0,4).map(([k,t,b,href,cta])=>
        `<div class="act ${k}"><h5>${t}</h5><p>${b}</p><a href="${href}">${cta}</a></div>`).join("")}</div></div>`;
  }

  out.innerHTML=h;
  saWireTips(out);
  const sq=out.querySelector("#sa-q");
  if(sq){ sq.addEventListener("input",()=>{saQuery=sq.value;saLimit=100;
    // re-render but keep focus in the box so typing isn't interrupted

/* ============================================================
   GST & TCS FILING REPORT
   Same settlement file, tax view: everything an Indian seller
   needs off one statement at GST-filing time. Pure summation of
   labelled lines from the parser — no rate guessing.
   ============================================================ */
const gstIsTcs=l=>/^tcs[\s-]/i.test(l);
const gstIsTds=l=>/tds|194/i.test(l);
/* Tail match too: real labels include e.g. "MFNPostagePurchaseCompleteIGST"
   with no separator before the GST head. */
const gstIsGstOnFees=l=>(/(^|[^a-z])(cgst|sgst|igst)([^a-z]|$)/i.test(l)||/(cgst|sgst|igst)$/i.test(l))&&!gstIsTcs(l);
const gstIsOutputTax=l=>/^(product tax|shipping tax)/i.test(l);

function gstCompute(r){
  const heads={tcs:{CGST:0,SGST:0,IGST:0,total:0,lines:0},tds:{total:0,lines:0},
    itc:{CGST:0,SGST:0,IGST:0,total:0,lines:0},output:{total:0,lines:0}};
  const byLabel={};
  let sales=0;
  for(const rec of r.records) for(const l of rec.amounts){
    if(/^principal$/i.test(l.amountDescription)){sales+=l.amount;continue;}
    const label=l.amountDescription||l.amountType||"(unlabelled)";
    let head=null;
    if(gstIsTcs(label))head="tcs";
    else if(gstIsTds(label))head="tds";
    else if(gstIsGstOnFees(label))head="itc";
    else if(gstIsOutputTax(label))head="output";
    if(!head)continue;
    const a=byLabel[label]||(byLabel[label]={head,count:0,total:0});
    a.count++;a.total+=l.amount;
    heads[head].total+=l.amount;heads[head].lines++;
    const m=label.match(/(cgst|sgst|igst)/i);
    if(m&&(head==="tcs"||head==="itc"))heads[head][m[1].toUpperCase()]+=l.amount;
  }
  return {heads,byLabel,sales};
}

/* ============================================================
   SKU PROFITABILITY REPORT
   Same settlement file, per-SKU view: which products actually
   make money after fees, taxes and refunds. Pure aggregation of
   the parsed records — nothing estimated.
   ============================================================ */
let skuSort="net", skuQuery="";
/* Advanced P&L (Phase 7a) — Pro-only overlay on the SKU report. */
let skuAdvanced=false, skuIsPro=false, skuShowUpgrade=false, skuWantAdvanced=false;
const skuExpanded=new Set();
const SKU_COSTS_KEY="sku_costs";
function loadSkuCosts(){try{return JSON.parse(localStorage.getItem(SKU_COSTS_KEY)||"{}")||{};}catch(e){return {};}}
function saveSkuCosts(c){try{localStorage.setItem(SKU_COSTS_KEY,JSON.stringify(c));}catch(e){}}

function skuCompute(r){
  /* Amazon bills Easy Ship, postage and base fees against the ORDER, on rows
     that carry no SKU. Left alone they pile into "(no SKU)" and every SKU
     looks cheaper to fulfil than it is — on a real account that hid ₹1.8 lakh
     of shipping cost. Map them back through the order id, but only when the
     order carried a single SKU: on a mixed order there is no honest split. */
  const skuOfOrder=new Map();
  for(const rec of r.records){
    if(!rec.orderId||!rec.sku) continue;
    const cur=skuOfOrder.get(rec.orderId);
    if(cur===undefined) skuOfOrder.set(rec.orderId,rec.sku);
    else if(cur!==rec.sku) skuOfOrder.set(rec.orderId,null);
  }
  const bySku={};
  for(const rec of r.records){
    const key=rec.sku||(rec.orderId?skuOfOrder.get(rec.orderId):null)||"(no SKU)";
    const s=bySku[key]||(bySku[key]={sku:key,units:0,orders:0,refunds:0,unitsReturned:0,sales:0,refundValue:0,fees:0,taxes:0,other:0,net:0,b:{}});
    const isOrder=rec.transactionType==="Order";
    const isRefund=/refund/i.test(rec.transactionType);
    if(isOrder){s.orders++;s.units+=rec.quantity||0;}
    if(isRefund){s.refunds++;s.unitsReturned+=Math.abs(rec.quantity||0);}
    for(const l of rec.amounts){
      s.net+=l.amount;
      const kind=saLineKind(l,rec.transactionType);
      if(kind==="principal"){
        if(isOrder)s.sales+=l.amount;
        else if(isRefund)s.refundValue+=l.amount;
        else s.other+=l.amount;
      }else{
        const label=l.amountDescription||l.amountType||"";
        /* Advertising and balance movements are still part of this row's net —
           the money really did move — but they are NOT Amazon's selling fees,
           so they must stay out of the fee column and out of fees-as-%-of-sales. */
        if(kind==="tax")s.taxes+=l.amount;
        else if(kind==="ads")s.ads=(s.ads||0)+l.amount;
        else if(kind==="balance")s.balance=(s.balance||0)+l.amount;
        else if(kind==="unknown")s.unknown=(s.unknown||0)+l.amount;
        else s.fees+=l.amount;
        const bk=saBucketOf(label,l.amount,kind);
        s.b[bk]=(s.b[bk]||0)+l.amount;
      }
    }
  }
  return Object.values(bySku);
}
window.skuCompute=skuCompute; // exposed for verification/debugging
/* One judgement per SKU, from rules a seller can check by hand (they are
   printed in the formulas panel). `adv` = advanced P&L mode; `cpuKnown` =
   a product cost has been entered for this SKU. The order matters: a missing
   cost outranks everything, because without it "profit" is only payout. */
function skuStatus(s,adv,cpuKnown){
  if(s.sku==="(no SKU)") return {k:"info",l:"Account-level"};
  if(adv&&!cpuKnown) return {k:"data",l:"Needs cost"};
  const rp=s.sales?Math.abs(s.refundValue)/s.sales*100:0;
  /* Without a product cost this is CONTRIBUTION, not profit. "Good" on a
     positive contribution reads as "this SKU makes money", which cannot be
     known until COGS is entered — a SKU contributing Rs 308 on a Rs 399 sale
     is a loss if the unit cost Rs 350. Only advanced mode, where the cost IS
     known, is allowed to say profitable or loss-making. */
  if(adv&&cpuKnown){
    if(s.truePL<0) return {k:"loss",l:"Loss-making"};
    if(rp>15) return {k:"problem",l:"Profitable · high refunds"};
    if(rp>8) return {k:"watch",l:"Profitable · watch refunds"};
    return {k:"good",l:"Profitable"};
  }
  if(s.net<0) return {k:"loss",l:"Negative contribution"};
  if(rp>15) return {k:"problem",l:"High refunds"};
  if(rp>8) return {k:"watch",l:"Watch refunds"};
  return {k:"good",l:"Positive contribution"};
}

function skuRenderResults(){
  const r=saParsed,out=document.getElementById("sku-out"); if(!out)return;
  const skus=skuCompute(r);
  const sv=n=>`<span class="${n<0?'amt-neg':(n>0?'amt-pos':'')}">${inr(n)}</span>`;
  /* Totals cover PRODUCTS only. Summing the "(no SKU)" bucket in here made the
     headline equal the whole deposit, which flatly contradicted the panel below
     saying account-level lines are excluded from every per-SKU figure. */
  const sumOf=list=>list.reduce((t,s)=>({sales:t.sales+s.sales,fees:t.fees+s.fees,refund:t.refund+s.refundValue,net:t.net+s.net,units:t.units+s.units,ads:t.ads+(s.ads||0),balance:t.balance+(s.balance||0)}),{sales:0,fees:0,refund:0,net:0,units:0,ads:0,balance:0});
  /* "(no SKU)" is not a product — it is the account-level bucket for lines
     Amazon never ties to one (advertising, balance movements, subscription).
     Counting it as a SKU, ranking it as the weakest earner and then advising
     the seller to check "its price and weight band" was the worst single piece
     of advice in the product. It gets its own section instead. */
  const realSkus=skus.filter(s=>s.sku!=="(no SKU)");
  const acct=skus.find(s=>s.sku==="(no SKU)")||null;
  const totals=sumOf(realSkus);
  const acctNet=acct?acct.net:0;
  const settlementTotal=totals.net+acctNet;
  const sorted=[...realSkus].sort((a,b)=>{
    if(skuSort==="sales")return b.sales-a.sales;
    if(skuSort==="refund")return (b.sales?Math.abs(b.refundValue)/b.sales:0)-(a.sales?Math.abs(a.refundValue)/a.sales:0);
    return b.net-a.net;
  });
  const best=sorted.length?sorted.reduce((m,s)=>s.net>m.net?s:m,sorted[0]):{net:0,sku:"—"};
  const worst=sorted.length?sorted.reduce((m,s)=>s.net<m.net?s:m,sorted[0]):{net:0,sku:"—"};
  const feePct=totals.sales?Math.abs(totals.fees)/totals.sales*100:0;
  const refundPct=totals.sales?Math.abs(totals.refund)/totals.sales*100:0;

  // Advanced P&L: attach product cost and true profit (Pro only).
  const advOn=skuAdvanced&&skuIsPro;
  const costs=loadSkuCosts();
  const withPL=sorted.map(s=>{
    const netUnits=Math.max(0,(s.units||0)-(s.unitsReturned||0));
    /* A cost the seller never entered is UNKNOWN, not zero. Treating it as
       zero showed "true profit" equal to the payout — the exact number the
       advanced mode exists to correct. Unknown-cost SKUs are excluded from
       the profit total and labelled Needs data instead. */
    const cpuKnown=s.sku!=="(no SKU)"&&costs[s.sku]!==undefined&&Number(costs[s.sku])>0;
    const cpu=cpuKnown?Number(costs[s.sku]):0;
    const cost=cpu*netUnits;          // product cost on units sold net of returns
    const truePL=s.net-cost;          // net settlement minus your product cost
    return Object.assign({},s,{netUnits,cpuKnown,cpu,cost,truePL});
  });
  const costed=withPL.filter(x=>x.cpuKnown);
  const needCost=withPL.filter(x=>!x.cpuKnown&&x.sku!=="(no SKU)"&&(x.units||0)>0).length;
  const trueProfit=costed.reduce((t,x)=>t+x.truePL,0);
  const lossCount=costed.filter(x=>x.truePL<0).length;

  let h=`<div class="stats">
    <div class="stat blue"><div class="k">SKUs · Units</div><div class="v">${realSkus.length} · ${totals.units}</div></div>
    <div class="stat ${totals.net<0?"red":"green"}"><div class="k">SKU settlement contribution</div><div class="v">${inr(totals.net)}</div>
      <div class="sa-sub" style="margin-top:3px">what the products themselves earned${Math.abs(acctNet)>=0.005?` · ${inr(acctNet)} of account-level costs is separate, below`:""}</div></div>
    <div class="stat"><div class="k">Amazon fee rate</div><div class="v">${feePct.toFixed(1)}%</div>
      <div class="sa-sub" style="margin-top:3px">${inr(Math.abs(totals.fees))} of ${inr(totals.sales)} gross${totals.ads?` · ads ${inr(Math.abs(totals.ads))} counted separately`:""}</div></div>
    <div class="stat ${refundPct>10?'red':''}"><div class="k">Refund value rate</div><div class="v">${refundPct.toFixed(1)}%</div>
      <div class="sa-sub" style="margin-top:3px">${inr(Math.abs(totals.refund))} refunded of ${inr(totals.sales)}</div></div>
    ${advOn?`<div class="stat ${trueProfit<0?'red':'green'}"><div class="k">True profit after product cost</div><div class="v">${costed.length?inr(trueProfit):"—"}</div><div class="sa-sub" style="margin-top:3px">${costed.length?`across ${costed.length} costed SKU${costed.length===1?"":"s"} · ${lossCount} loss-making`:"enter product costs below"}${needCost?` · <b>${needCost} still need a cost</b>`:""}</div></div>`:""}
  </div>
  ${(!advOn||!costed.length)?`<div class="banner warn" style="text-align:left"><b>Product cost not added.</b> Every figure here is what Amazon settled — <b>contribution</b>, not profit. Your purchase or manufacturing cost is not in it, so a SKU showing a positive number can still be losing money. ${skuIsPro?`<a href="/sku-report/advanced">Add product costs</a> to turn this into real profit and margin.`:`Adding product costs is a Pro feature — <a href="/pricing">see plans</a>.`}</div>`:""}`;

  if(realSkus.length>1)
  {
    const wRef=worst.sales?Math.abs(worst.refundValue)/worst.sales*100:0;
    h+=`<div class="banner info">Strongest in this settlement: <b>${esc(best.sku)}</b> — ${inr(best.net)} contribution, before product cost. Needs attention: <b>${esc(worst.sku)}</b> — ${inr(worst.net)}${worst.net<0?", i.e. it took money out of this settlement":""}.${
      worst.net<0&&wRef>=80?` Its sales were <b>${wRef.toFixed(0)}% refunded</b>, so the fees and GST were charged on a sale that was given back — check the refund reason before spending anything more on this SKU.`
      :worst.net<0?" Check its price against the fee steps, its weight band, and its return rate.":""}</div>`;
  }

  /* Account-level lines shown as what they are, next to the products but never
     ranked among them. Advertising and balance movements get named explicitly:
     a seller who sees only a lump sum cannot act on it. */
  if(acct&&Math.abs(acct.net)>=0.005){
    const b=acct.b||{};
    /* "Balance" is two different mechanisms: a balance carried forward, and a
       transfer paired with the other Account Type. Shown as one line the
       seller cannot tell which of their money is which. */
    let carried=0,xfer=0,sawXfer=false;
    for(const rec of r.records) for(const l of rec.amounts){
      if(saLineKind(l,rec.transactionType)!=="balance") continue;

    }
    const parts=[["ads","Advertising (Sponsored Ads)"],
      ["_carried","Previous balance payable to Amazon",carried],

  }

  if(skuShowUpgrade && !skuIsPro)

          <td class="num">${s.cpuKnown?"-"+inr(s.cost):'<span class="sa-sub">—</span>'}</td>
          <td class="num">${s.cpuKnown?`<b class="${s.truePL<0?'amt-neg':'amt-pos'}">${inr(s.truePL)}</b>`
            :(s.sku==="(no SKU)"?`<b>${sv(s.net)}</b>`:'<span class="sa-sub" title="Enter this SKU\'s product cost to see its true P&L">needs cost</span>')}</td>

      </tbody></table></div>
