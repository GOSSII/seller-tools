/* ============================================================
   MULTI-MONTH TRENDS (Pro)
   Several settlement files (same parseSettlement) combined into
   month-by-month figures, drawn with the existing viz helpers.
   Everything stays in the browser.
   ============================================================ */
let trFiles=[], trSku="";
const trFmtMonth=m=>new Date(m+"-01T00:00:00Z").toLocaleDateString("en-IN",{month:"short",year:"numeric",timeZone:"UTC"});

/* Pure: parsed settlements -> {months, skus, skipped}. Each record lands in
   the month of its posted-date, falling back to the statement's start month;
   lines with no usable date at all are counted in `skipped`, never guessed. */
function trendCompute(settlements,mtrRows){
  const zeros=()=>({gross:0,refunded:0,fees:0,taxes:0,credits:0,net:0,orders:0,units:0,refunds:0,ads:0,balance:0,unknown:0});
  const months=new Map(), skus=new Map(); let skipped=0;
  for(const p of settlements){
    const fd=p.summary?(saParseDate(p.summary.settlementStartDate)||saParseDate(p.summary.depositDate)):null;
    const fileMonth=fd?fd.slice(0,7):null;
    for(const rec of p.records){
      const d=saParseDate(rec.postedDate);
      const m=d?d.slice(0,7):fileMonth;
      if(!m){skipped++;continue;}
      let e=months.get(m); if(!e){e=Object.assign({m},zeros());months.set(m,e);}
      const isOrder=rec.transactionType==="Order", isRefund=/refund/i.test(rec.transactionType);
      if(isOrder){e.orders++;e.units+=rec.quantity||0;}
      if(isRefund)e.refunds++;
      let sm=null;
      if(rec.sku){
        let se=skus.get(rec.sku); if(!se){se={sku:rec.sku,byMonth:new Map()};skus.set(rec.sku,se);}
        sm=se.byMonth.get(m); if(!sm){sm={units:0,sales:0,net:0};se.byMonth.set(m,sm);}
        if(isOrder)sm.units+=rec.quantity||0;
      }
      for(const l of rec.amounts){
        e.net+=l.amount; if(sm)sm.net+=l.amount;
        const kind=saLineKind(l,rec.transactionType);
        if(kind==="principal"){
          if(isOrder){e.gross+=l.amount;if(sm)sm.sales+=l.amount;}
          else if(isRefund)e.refunded+=l.amount;
          else e.credits+=l.amount;
        }else if(kind==="tax")e.taxes+=l.amount;
        /* Advertising and balance movements used to land in `fees`, which made
           the fee-share chart read 156.9% of sales on a real account whose
           Amazon fees were 21.5%. They are tracked, and charted, on their own. */
        else if(kind==="ads")e.ads+=l.amount;
        else if(kind==="balance")e.balance+=l.amount;
        else if(kind==="unknown")e.unknown+=l.amount;
        else if(kind==="fee")e.fees+=l.amount;
        else e.credits+=l.amount;
      }
    }
  }
  // Continuous month axis (gaps become zero months), capped as a safety net
  // against a garbage date stretching the axis across decades.
  const keys=[...months.keys()].sort(), out=[];
  if(keys.length){
    let [y,mo]=keys[0].split("-").map(Number);
    const last=keys[keys.length-1];
    for(;;){
      const k=y+"-"+String(mo).padStart(2,"0");
      out.push(months.get(k)||Object.assign({m:k},zeros()));
      if(k===last||out.length>=120)break;
      mo++; if(mo>12){mo=1;y++;}
    }
  }
  /* A month with no sales has no fee RATIO — the denominator is zero. Writing
     0% made an empty month look like a perfect one, and worse, made it a valid
     baseline: a real account compared May's 150% against an April that never
     sold anything and announced "fees up 150.1 points". Null means unknown,
     and every consumer below skips a null rather than treating it as zero. */
  for(const e of out){
    e.feePct=e.gross?Math.abs(e.fees)/e.gross*100:null;
    e.refundPct=e.gross?Math.abs(e.refunded)/e.gross*100:null;
    e.adPct=e.gross?Math.abs(e.ads)/e.gross*100:null;
  }
  /* How much of each month the loaded statements actually cover. A month that
     is only half covered is not a low month — it is half a month, and drawing
     it beside full ones invites exactly the wrong conclusion. */
  {
    const days=new Set();
    for(const p of settlements){
      if(!p.summary) continue;
      const a=saParseDate(p.summary.settlementStartDate),b=saParseDate(p.summary.settlementEndDate);
      if(!a||!b) continue;
      for(let d=recDayNo(a);d<=recDayNo(b);d++) days.add(d);
    }
    for(const e of out){
      const [Y,Mo]=e.m.split("-").map(Number);
      const inMonth=new Date(Date.UTC(Y,Mo,0)).getUTCDate();
      let have=0;
      for(let day=1;day<=inMonth;day++){
        const iso=`${e.m}-${String(day).padStart(2,"0")}`;
        if(days.has(recDayNo(iso))) have++;
      }
      e.coverDays=have; e.monthDays=inMonth;
      e.partial=have<inMonth;
    }
  }
  /* Which days actually sell. Amazon's posted date is when it booked the
     transaction, which for a shipped order tracks the dispatch day closely
     enough to tell a Sunday from a Wednesday — but say so rather than calling
     it the order date. */
  const dowNames=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const dow=dowNames.map(name=>({name,short:name.slice(0,3),orders:0,units:0,gross:0,days:0}));
  {
    const seenDays=new Set();
    for(const p of settlements) for(const rec of p.records){
      if(rec.transactionType!=="Order") continue;
      const d=saParseDate(rec.postedDate); if(!d) continue;
      const i=new Date(d+"T00:00:00Z").getUTCDay();
      const e=dow[i];
      e.orders++; e.units+=rec.quantity||0;
      for(const l of rec.amounts) if(/^principal$/i.test(l.amountDescription)) e.gross+=l.amount;
      if(!seenDays.has(d)){ seenDays.add(d); dow[i].days++; }
    }
    // Per-day averages, so a month with five Saturdays doesn't look better than
    // one with four.
    for(const e of dow){ e.avgGross=e.days?e.gross/e.days:0; e.avgOrders=e.days?e.orders/e.days:0; }
  }
  /* The same months counted on ORDER date, straight from the MTR. Amazon's
     SKU page and business reports count this way, so this is the column that
     will agree with them — while the money stays on settlement dates, because
     that is when it was actually paid. */
  const ordered=new Map(), orderedSku=new Map();
  let orderedFrom=null, orderedTo=null;
  for(const m of (mtrRows||[])){
    if(m.type!=="Shipment"||!m.sku) continue;
    const d=saParseDate(m.orderDate)||saParseDate(m.shipDate); if(!d) continue;
    if(!orderedFrom||d<orderedFrom) orderedFrom=d;
    if(!orderedTo||d>orderedTo) orderedTo=d;
    const key=d.slice(0,7), q=m.quantity||0, v=Math.abs(m.amount||0);
    const e=ordered.get(key)||{units:0,sales:0}; e.units+=q; e.sales+=v; ordered.set(key,e);
    let sm=orderedSku.get(m.sku); if(!sm){sm=new Map();orderedSku.set(m.sku,sm);}
    const se=sm.get(key)||{units:0,sales:0}; se.units+=q; se.sales+=v; sm.set(key,se);
  }
  const haveOrdered=ordered.size>0;
  for(const e of out){
    const o=ordered.get(e.m); e.orderedUnits=o?o.units:0; e.orderedSales=o?o.sales:0;
    /* The MTR has its own date range — a custom export can start mid-month.
       A month it only half covers is not a small month, and saying so is the
       whole point of this column. */
    const [Y,Mo]=e.m.split("-").map(Number);
    const first=`${e.m}-01`, last=`${e.m}-${String(new Date(Date.UTC(Y,Mo,0)).getUTCDate()).padStart(2,"0")}`;
    e.orderedPartial=!haveOrdered||!orderedFrom||!orderedTo||orderedFrom>first||orderedTo<last;
  }
  const skuList=[...skus.values()].map(s=>({
    sku:s.sku,
    sales:[...s.byMonth.values()].reduce((t,x)=>t+x.sales,0),
    months:out.map(e=>{const x=s.byMonth.get(e.m);
      const o=(orderedSku.get(s.sku)||new Map()).get(e.m);
      return {m:e.m,units:x?x.units:0,sales:x?x.sales:0,net:x?x.net:0,
        orderedUnits:o?o.units:0,orderedSales:o?o.sales:0,orderedPartial:e.orderedPartial};}),
  })).sort((a,b)=>b.sales-a.sales);
  return {months:out,skus:skuList,skipped,dow,haveOrdered,orderedFrom,orderedTo};
}
window.trendCompute=trendCompute; // exposed for verification/debugging

/* Month-over-month reading of the numbers, in words. Settlement weeks rarely
   line up with month ends, so raw totals would compare a 28-day July against a
   30-day June and invent a fall. Every Δ is therefore computed on the DAILY
   RUN-RATE over the days the statements actually cover, and a month needs at
   least a fortnight of coverage before it is compared at all — below that the
   sample is too thin to mean anything. Ratios (fee %, refund %) are immune to
   coverage and compared directly. Thresholds a seller can check by hand:
     growth/decline  ≥15% move in daily sales rate
     refund spike    ≥3 points up AND above 5%
     margin squeeze  fee share up ≥2 points, or rising 3 straight months
     mover SKUs      ≥40% move on a ₹5,000+/month run-rate
     new winner      from under ₹500 to a ₹5,000+/month rate */
const TR_MIN_DAYS=14;
function trendInsights(months,skus){
  const full=(months||[]).filter(e=>e.coverDays>=TR_MIN_DAYS);
  if(full.length<2) return {ok:false,rows:[],notes:[],movers:{up:[],down:[]},
    reason:full.length?"Only one month has a fortnight or more of coverage — load neighbouring statements to compare months like for like.":"No month has enough coverage yet."};
  const pct=(a,b)=>Math.abs(b)>1e-9?(a-b)/Math.abs(b)*100:null;
  const rows=full.map((e,i)=>{
    const p=i>0?full[i-1]:null;
    const rate=(x,k)=>x[k]/x.coverDays;
    return {m:e.m,gross:e.gross,net:e.net,units:e.units,feePct:e.feePct,refundPct:e.refundPct,
      coverDays:e.coverDays,monthDays:e.monthDays,partial:!!e.partial,
      grossD:rate(e,"gross"),netD:rate(e,"net"),
      dGross:p?pct(rate(e,"gross"),rate(p,"gross")):null,
      dNet:p?pct(rate(e,"net"),rate(p,"net")):null,
      dUnits:p?pct(rate(e,"units"),rate(p,"units")):null,
      /* Only compare a ratio against a month that HAD one. A month with no
         sales has no fee or refund share to be up or down from. */
      dFeePp:(p&&p.feePct!==null&&e.feePct!==null)?e.feePct-p.feePct:null,
      dRefundPp:(p&&p.refundPct!==null&&e.refundPct!==null)?e.refundPct-p.refundPct:null};
  });
  const L=rows[rows.length-1],P=rows[rows.length-2];
  const name=m=>trFmtMonth(m);
  const notes=[];
  if(L.dGross!==null){
    if(L.dGross>=15) notes.push({k:"good",t:`Daily sales rate grew <b>${L.dGross.toFixed(0)}%</b> in ${name(L.m)} (${inr0(P.grossD)}/day → ${inr0(L.grossD)}/day).`});
    else if(L.dGross<=-15) notes.push({k:"bad",t:`Daily sales rate fell <b>${Math.abs(L.dGross).toFixed(0)}%</b> in ${name(L.m)} (${inr0(P.grossD)}/day → ${inr0(L.grossD)}/day).`});
  }
  if(L.dGross!==null&&L.dNet!==null&&L.dGross>0&&L.dNet<0)
    notes.push({k:"bad",t:`Sales rose but the payout rate <b>fell</b> (${inr0(P.netD)}/day → ${inr0(L.netD)}/day) — fees or refunds ate more than the growth brought in.`});
  if(L.dRefundPp!==null&&L.dRefundPp>=3&&L.refundPct>=5)
    notes.push({k:"bad",t:`Refunds jumped to <b>${L.refundPct.toFixed(1)}%</b> of sales in ${name(L.m)} (up ${L.dRefundPp.toFixed(1)} points) — find the SKU behind it in the <a href="/sku-report">SKU report</a> before it compounds.`});
  const squeeze3=rows.length>=3&&rows.slice(-3).every(r=>r.feePct!==null)
    &&rows.slice(-3).every((r,i,a)=>i===0||r.feePct>a[i-1].feePct);
  if((L.dFeePp!==null&&L.dFeePp>=2)||squeeze3)
    notes.push({k:"bad",t:`Fees are taking a growing share of every sale — ${squeeze3?`up three straight months to <b>${L.feePct.toFixed(1)}%</b>`:`up ${L.dFeePp.toFixed(1)} points to <b>${L.feePct.toFixed(1)}%</b>`}. Run <a href="/reconcile">Reconciliation</a>'s fee audit and check weight bands in the <a href="/fee-bands">Fee Band Optimizer</a>.`});
  if(rows.length>=3){
    const best=rows.reduce((m,r)=>r.netD>m.netD?r:m,rows[0]);
    // Additive tolerance: a multiplicative one flips sign on a negative month.
    const tol=r2=>Math.abs(r2.netD)*0.05;
    const trendUp=rows.every((r,i)=>i===0||r.netD>=rows[i-1].netD-tol(rows[i-1]));
    const trendDn=rows.every((r,i)=>i===0||r.netD<=rows[i-1].netD+tol(rows[i-1]));
    if(trendUp&&L.netD>rows[0].netD) notes.push({k:"good",t:`The daily payout rate has climbed across all ${rows.length} months (${inr0(rows[0].netD)}/day → ${inr0(L.netD)}/day) — the business is compounding.`});
    else if(trendDn&&L.netD<rows[0].netD) notes.push({k:"bad",t:`The daily payout rate has slid across all ${rows.length} months (${inr0(rows[0].netD)}/day → ${inr0(L.netD)}/day).`});
    else notes.push({k:"info",t:`Best month so far by payout rate: <b>${name(best.m)}</b> at ${inr0(best.netD)}/day.`});
  }
  if(!notes.length) notes.push({k:"info",t:`${name(L.m)} vs ${name(P.m)}: daily sales rate ${L.dGross===null?"—":(L.dGross>=0?"+":"")+L.dGross.toFixed(1)+"%"}, payout rate ${L.dNet===null?"—":(L.dNet>=0?"+":"")+L.dNet.toFixed(1)+"%"} — steady, nothing that needs action.`});
  /* SKU movers between the last two compared months, also on run-rate so a
     28-day month doesn't fade every SKU at once. Figures shown are
     monthly-equivalent (rate × 30) so they read like month numbers. */
  const movers={up:[],down:[]};
  const mEq=(s2,row)=>{const x=(s2.months||[]).find(y=>y.m===row.m);return x?x.sales/row.coverDays*30:0;};
  for(const s2 of (skus||[])){
    const prev=mEq(s2,P),last=mEq(s2,L);
    if(prev<500&&last>=5000) movers.up.push({sku:s2.sku,prev,last,note:"new"});
    else if(prev>=5000&&last>=prev*1.4) movers.up.push({sku:s2.sku,prev,last});
    else if(prev>=5000&&last<=prev*0.6) movers.down.push({sku:s2.sku,prev,last});
  }
  movers.up.sort((x,y)=>(y.last-y.prev)-(x.last-x.prev)); movers.up=movers.up.slice(0,5);
  movers.down.sort((x,y)=>(x.last-x.prev)-(y.last-y.prev)); movers.down=movers.down.slice(0,5);
  return {ok:true,rows,notes,movers,lastM:L.m,prevM:P.m};
}
window.trendInsights=trendInsights; // exposed for verification/debugging

function renderTrends(){
  setMeta("Multi-Month Trends — Seller Tools India",
    "Drop several Amazon settlement files and see your business month by month: sales, fees as a percentage of sales, refund rate and net payout — computed locally in your browser.");
  backBtn.hidden=false;
  gatePremium(TREND_INFO, trendsBody);
}
function trendsBody(){
  app.innerHTML=`
    <div class="wrap page">
      <h2>Multi-Month Trends</h2>
      <p class="lede">Drop every settlement file you have — they're combined into month-by-month charts of sales, fees, refund rate and net payout, overall and per SKU. The more statements, the better the picture.</p>
      ${helpHtml("trends")}
      <label class="sa-drop" id="tr-drop">
        <div class="ico">📈</div>
        <h3>Drop your settlement files here</h3>
        <p>or click to choose — several statements, plus your MTR for order-date units (.csv or .txt)</p>
        <input type="file" id="tr-file" multiple accept=".csv,.txt,.xlsx,text/plain,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      </label>
      <div class="sa-priv">🔒 Private by design — your files never leave your device. All charts are computed locally on this page.</div>
      <div id="tr-out"></div>
    </div>`;
  const drop=document.getElementById("tr-drop"),file=document.getElementById("tr-file");
  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over");}));

  file.addEventListener("change",()=>{trAddFiles(file.files);file.value="";});
  if(trFiles.length) trRenderResults();
}
function trAddFiles(list){
  const files=[...(list||[])]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    const finish=()=>{ if(--pending===0) trRenderResults(); };
    saReadDropped(f,txt=>{
      trFiles=trFiles.filter(x=>x.name!==f.name); // re-drop replaces
      /* An MTR carries the ORDER date, which is what Amazon's own SKU and
         business reports count by — take one if it is offered so the months
         can be shown on the same basis. */
      const mtr=parseMtr(txt);
      if(mtr){ trFiles.push({name:f.name,kind:"mtr",rows:mtr.rows}); finish(); return; }
      if(saLooksExcel(txt,f.name)){ trFiles.push({name:f.name,kind:"error",msg:SA_EXCEL_MSG}); finish(); return; }
      const p=parseUnifiedTransaction(txt)||parseSettlement(txt);
      if(p.records.length||p.summary){
        const dup=p.summary&&trFiles.some(x=>x.kind==="settlement"&&x.parsed.summary&&x.parsed.summary.settlementId===p.summary.settlementId);
        if(dup) trFiles.push({name:f.name,kind:"error",msg:"same settlement ID as a file already loaded — skipped to avoid double counting"});
        else trFiles.push({name:f.name,kind:"settlement",parsed:p});
      } else trFiles.push({name:f.name,kind:"error",msg:"not recognised as a settlement flat file or MTR."+saDescribeColumns(txt)});
      finish();
    },msg=>{ trFiles=trFiles.filter(x=>x.name!==f.name); trFiles.push({name:f.name,kind:"error",msg}); finish(); });
  });
}

  }
  const trMtr=trFiles.filter(f=>f.kind==="mtr").flatMap(f=>f.rows);
  const t=trendCompute(settlements,trMtr);
  /* A month with no statement days behind it isn't a zero month, it's an
     artefact of one stray line posting outside the period — drawing it as a
     Rs 0 bar reads as "we sold nothing", which is false. */
  const covered=new Set(t.months.filter(m=>m.coverDays>0).map(m=>m.m));
  const M=t.months.filter(m=>covered.has(m.m));
  const partials=M.filter(m=>m.partial);
  const totGross=M.reduce((s,e)=>s+e.gross,0), totNet=M.reduce((s,e)=>s+e.net,0),
        totFees=M.reduce((s,e)=>s+e.fees,0), totRef=M.reduce((s,e)=>s+e.refunded,0),
        totAds=M.reduce((s,e)=>s+(e.ads||0),0), totBal=M.reduce((s,e)=>s+(e.balance||0),0);
  const monthsWithSales=M.filter(e=>e.gross>0).length;
  /* Only the paired Debt Adjustment rows are genuinely cross-account transfers;
     a balance carried forward is a different thing and must not be described

  let trXferTotal=0;
  for(const p of settlements) for(const rec of p.records) for(const l of rec.amounts)
    if(saLineKind(l,rec.transactionType)==="balance"&&/^debt adjustment/i.test((l.amountDescription||"").trim())) trXferTotal+=l.amount;
  const sv=n=>`<span class="${n<0?'amt-neg':(n>0?'amt-pos':'')}">${inr(n)}</span>`;
  const mo={lbl:m=>trFmtMonth(m),unit:`monthly · ${M.length} month${M.length===1?"":"s"}`,x:"m"};
  /* Rupees lead, percentages qualify. A seller feels "-4,491.98"; "44.3%"
     is an abstraction, and putting the percent in the big slot also let a
     ratio be mistaken for a currency figure. "Months covered" is metadata,
     not a headline business number, so it moves out of the first slot. */
  const pctOf=v=>totGross?(Math.abs(v)/totGross*100).toFixed(1)+"% of "+inr0(totGross)+" gross sales":"—";
  h+=`<div class="stats">
    <div class="stat green"><div class="k">Gross sales</div><div class="v">${inr(totGross)}</div>
      <div class="sa-sub" style="margin-top:3px">${M.length} month${M.length===1?"":"s"} covered${monthsWithSales<M.length?` · ${monthsWithSales} with sales`:""}</div></div>
    ${totAds?`<div class="stat ${totGross&&Math.abs(totAds)/totGross>0.2?"red":""}"><div class="k">Sponsored Ads</div><div class="v">${inr(totAds)}</div>
      <div class="sa-sub" style="margin-top:3px">${pctOf(totAds)}</div></div>`:""}
    <div class="stat red"><div class="k">Selling &amp; fulfilment fees</div><div class="v">${inr(totFees)}</div>
      <div class="sa-sub" style="margin-top:3px">${pctOf(totFees)}</div></div>
    <div class="stat ${totGross&&Math.abs(totRef)/totGross>0.1?"red":""}"><div class="k">Refunded sales</div><div class="v">${inr(totRef)}</div>
      <div class="sa-sub" style="margin-top:3px">${pctOf(totRef)}</div></div>
    <div class="stat ${totNet<0?"warn":"green"}"><div class="k">${totNet<0?"Net settlement balance":"Net payout"}</div><div class="v">${inr(totNet)}</div>
      <div class="sa-sub" style="margin-top:3px">${totNet<0?"⚠ these statements paid out nothing overall":"across these statements"}</div></div>
  </div>
  ${(totAds&&Math.abs(totAds)>Math.abs(totFees))?`<div class="act hot" style="margin-top:12px">
    <h5>Sponsored Ads are your largest operating cost</h5>
    <p>You spent <b>${inr(Math.abs(totAds))}</b> on Sponsored Ads — <b>${totGross?(Math.abs(totAds)/totGross*100).toFixed(1):"—"}% of gross sales</b>, and <b>${(Math.abs(totAds)/Math.abs(totFees)).toFixed(2)}×</b> your ${inr(Math.abs(totFees))} of Amazon selling &amp; fulfilment fees. Whether that is worth it depends on what the ads actually sold — the settlement cannot say. Check ACOS per SKU before spending more.</p>
    <a href="/ad-profit">Analyse advertising →</a></div>`:""}
  ${totBal?`<div class="banner info" style="text-align:left"><b>Account-level balance adjustments: ${inr(Math.abs(totBal))}.</b> These affect what reached your bank but are excluded from the selling-fee rate, the advertising rate and every per-product figure. ${trXferTotal?`Of that, ${inr(Math.abs(trXferTotal))} is a transfer between your two Amazon payment accounts — one movement shown from two sides, which nets to ₹0 when both Account Types are loaded. ${Math.abs(totBal)-Math.abs(trXferTotal)>0.005?`The rest is balances carried forward from earlier weeks.`:""}`:`They are balances carried forward between statements, not charges from these periods' sales.`}</div>`:""}`;
  if(settlements.length===1)
    h+=`<div class="banner info">Only one settlement loaded — drop more statements to see a real trend.</div>`;
  if(partials.length)
    h+=`<div class="banner warn">${partials.map(m=>`<b>${esc(trFmtMonth(m.m))}</b> (${m.coverDays} of ${m.monthDays} days)`).join(" and ")} ${partials.length>1?"are":"is"} only part of a month — the statements you loaded don't cover the rest of it. Those bars are shorter because the period is shorter, not because sales fell. Load the neighbouring statements for a like-for-like month.</div>`;
  h+=`<div class="banner info">Months here are <b>when Amazon settled the money</b>, not when the buyer ordered. Amazon's own SKU and Business Reports count by order date, so the two will not agree — an order placed late in the month is usually paid in the next one. Across a whole account the gap is small; <b>for a single SKU it can be several times over or under</b>, depending on when in the month that product sells.</div>`;
  /* Ratio charts plot only the months that HAVE a ratio — a month with no
     sales has no fee share, and drawing it as a 0% bar reads as "a month with
     no fees", which is the opposite of what an empty month means. */
  const Mr=M.filter(e=>e.feePct!==null||e.refundPct!==null);
  h+=`<div class="panel"><h4>Month by month <span class="sa-sub">— hover a bar for the exact figure</span></h4><div class="vizgrid">${
      saBarChart("Product sales",M,"gross","#16a34a",v=>inr(v),mo)
    }${
      saBarChart("Net payout",M,"net","#2f5af0",v=>inr(v),mo)
    }${
      totAds?saBarChart("Sponsored Ads as % of sales",Mr,"adPct","#8b5cf6",v=>v.toFixed(1)+"%",mo):""
    }${
      saBarChart("Amazon fees as % of sales",Mr,"feePct","#e5484d",v=>v.toFixed(1)+"%",mo)
    }${
      saBarChart("Refund value as % of sales",Mr,"refundPct","#f5872b",v=>v.toFixed(1)+"%",mo)
    }</div>
    <div class="tblwrap" style="margin-top:12px"><table class="sa">
      <thead><tr><th>Month</th><th class="num">Orders</th><th class="num" title="Units whose settlement landed in this month">Units settled</th>${t.haveOrdered?`<th class="num" title="Units ordered in this month, from the MTR — this is the basis Amazon's own reports use">Units ordered</th>`:""}<th class="num">Gross sales</th><th class="num">Refunds</th><th class="num">Fees</th><th class="num">Fee %</th>${totAds?`<th class="num" title="Sponsored Ads billed in the statements that settled in this month">Sponsored Ads</th><th class="num">Ads %</th>`:""}<th class="num">Refund %</th><th class="num">Net payout</th></tr></thead>
      <tbody>${M.map(e=>`<tr>
        <td>${esc(trFmtMonth(e.m))}${e.partial?` <span class="sa-sub" title="Statements cover only ${e.coverDays} of ${e.monthDays} days of this month">· ${e.coverDays}/${e.monthDays} days</span>`:""}</td><td class="num">${e.orders}</td><td class="num">${e.units}</td>${t.haveOrdered?`<td class="num"${e.orderedPartial?' title="Your MTR does not cover this whole month"':""}><b>${e.orderedUnits||"—"}</b>${e.orderedPartial?'<span class="sa-sub"> ·part</span>':""}</td>`:""}
        <td class="num">${inr(e.gross)}</td><td class="num">${sv(e.refunded)}</td><td class="num">${sv(e.fees)}</td>
        <td class="num">${e.feePct===null?'<span class="sa-sub" title="No sales settled in this month, so there is no ratio to show">—</span>':e.feePct.toFixed(1)+"%"}</td>${totAds?`<td class="num">${e.ads?sv(e.ads):"—"}</td><td class="num">${e.adPct===null?'<span class="sa-sub">—</span>':e.adPct.toFixed(1)+"%"}</td>`:""}<td class="num ${e.refundPct!==null&&e.refundPct>10?'amt-neg':''}">${e.refundPct===null?'<span class="sa-sub">—</span>':e.refundPct.toFixed(1)+"%"}</td>
        <td class="num"><b>${sv(e.net)}</b></td></tr>`).join("")}

  // Month-over-month reading, full months only.
  {

    h+=`<div class="panel"><h4>What changed, month over month <span class="sa-sub">— compared on the daily run-rate, so a part-covered month is never read as a crash</span></h4>`;
    if(!ins.ok) h+=`<div class="banner info">${esc(ins.reason)}</div>`;
    else{
      h+=ins.notes.map(n=>`<div class="banner ${n.k==="good"?"good":n.k==="bad"?"warn":"info"}" style="margin-top:8px">${n.t}</div>`).join("");
      h+=`<div style="display:flex;justify-content:flex-end;margin:10px 0 2px"><button type="button" class="fbtn" id="tr-csv">⬇ Export month table CSV</button></div>
      <div class="tblwrap" style="margin-top:6px"><table class="sa">
        <thead><tr><th>Month</th><th class="num">Sales</th><th class="num" title="Change in the daily sales rate vs the previous month">Δ rate</th><th class="num">Net payout</th><th class="num" title="Change in the daily payout rate">Δ rate</th><th class="num">Units</th><th class="num" title="Change in units per day">Δ rate</th><th class="num">Fee % <span class="sa-sub">Δ</span></th><th class="num">Refund % <span class="sa-sub">Δ</span></th></tr></thead>
        <tbody>${ins.rows.map(r=>`<tr>
          <td>${esc(trFmtMonth(r.m))}${r.partial?` <span class="sa-sub">· ${r.coverDays}/${r.monthDays} days</span>`:""}</td>
          <td class="num">${inr0(r.gross)}</td><td class="num">${dp(r.dGross)}</td>
          <td class="num"><b>${inr0(r.net)}</b></td><td class="num">${dp(r.dNet)}</td>
          <td class="num">${num(r.units)}</td><td class="num">${dp(r.dUnits)}</td>
          <td class="num">${r.feePct===null?"—":r.feePct.toFixed(1)+"%"} ${r.dFeePp===null?"":dp(r.dFeePp,1)}</td>
          <td class="num">${r.refundPct===null?"—":r.refundPct.toFixed(1)+"%"} ${r.dRefundPp===null?"":dp(r.dRefundPp,1)}</td></tr>`).join("")}
        </tbody></table></div>`;
      if(ins.movers.up.length||ins.movers.down.length){
        const li=x=>`<li><b>${esc(x.sku)}</b> — ${inr0(x.prev)} → ${inr0(x.last)}${x.note==="new"?' <span class="st st-good">new</span>':""}</li>`;
        h+=`<div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:12px">
          ${ins.movers.up.length?`<div style="flex:1;min-width:240px"><b>📈 Gaining (${esc(trFmtMonth(ins.prevM))} → ${esc(trFmtMonth(ins.lastM))})</b><ul style="margin:6px 0 0 18px;line-height:1.8;font-size:13.5px">${ins.movers.up.map(li).join("")}</ul></div>`:""}
          ${ins.movers.down.length?`<div style="flex:1;min-width:240px"><b>📉 Fading</b><ul style="margin:6px 0 0 18px;line-height:1.8;font-size:13.5px">${ins.movers.down.map(li).join("")}</ul><p class="sa-sub" style="margin-top:6px">Check stock-outs and lost buy box before touching the price — a fade is a symptom, not a diagnosis.</p></div>`:""}
        </div>`;
      }
      h+=`<p class="sa-sub" style="margin:10px 0 0">Every Δ compares <b>daily run-rates over the days the statements cover</b>, never raw totals — so a 28-day month against a 31-day one is a fair fight. A month needs 14+ covered days to be compared. Thresholds: sales moves from 15%, refund spikes from 3 points above a 5% base, fee squeeze from 2 points or three rising months, SKU movers from a 40% swing on a ₹5,000+/month rate (mover figures shown as monthly equivalents). Months are settled-basis.</p>`;
    }
    h+=`</div>`;
  }
  // Which days sell — averaged per occurrence of that weekday.
  if(t.dow&&t.dow.some(d=>d.days>0)){
    const D=t.dow.filter(d=>d.days>0);
    const best=D.reduce((m,x)=>x.avgGross>m.avgGross?x:m,D[0]);
    const worst=D.reduce((m,x)=>x.avgGross<m.avgGross?x:m,D[0]);
    const wk=D.filter(d=>d.name==="Saturday"||d.name==="Sunday");
    const wd=D.filter(d=>d.name!=="Saturday"&&d.name!=="Sunday");

function trWire(out){
  saWireTips(out);

    trFiles.splice(Number(b.dataset.rm),1); trRenderResults();

  const csv=out.querySelector("#tr-csv");
  if(csv) csv.addEventListener("click",()=>{
    const settlements=trFiles.filter(f=>f.kind==="settlement").map(f=>f.parsed);
    const t=trendCompute(settlements,trFiles.filter(f=>f.kind==="mtr").flatMap(f=>f.rows));
    const M=t.months.filter(m=>m.coverDays>0);
    const ins=trendInsights(M,t.skus);
    if(!ins.ok) return;
    const d=v=>v===null?"":v.toFixed(1);
    saCsvDownload("trends-month-over-month.csv",
      ["Month","Sales (INR)","Sales MoM %","Net payout (INR)","Net MoM %","Units","Units MoM %","Fee %","Fee MoM pp","Refund %","Refund MoM pp"],
      ins.rows.map(r=>[r.m,r.gross.toFixed(2),d(r.dGross),r.net.toFixed(2),d(r.dNet),
        r.units,d(r.dUnits),r.feePct===null?"":r.feePct.toFixed(1),d(r.dFeePp),
        r.refundPct===null?"":r.refundPct.toFixed(1),d(r.dRefundPp)]));
  });
}

function wireCopyButtons(root){
  root.querySelectorAll(".copybtn[data-copy]").forEach(b=>{
    b.addEventListener("click",async()=>{
      const src=document.getElementById(b.dataset.copy);
      const text=src.tagName==="TEXTAREA"?src.value:src.textContent;
      let ok=false;
      try{await navigator.clipboard.writeText(text);ok=true;}
      catch(e){
        try{
          const ta=document.createElement("textarea");
          ta.value=text;document.body.appendChild(ta);ta.select();
          ok=document.execCommand("copy");ta.remove();
        }catch(e2){}
      }
      const old=b.textContent;
      b.textContent=ok?"Copied ✓":"Select & copy manually";
      b.classList.toggle("copied",ok);
      setTimeout(()=>{b.textContent=old;b.classList.remove("copied");},1600);
    });
  });
}

copper</textarea></div>

        </div>
        <textarea id="kw-out" class="kwta kwout" readonly spellcheck="false"></textarea>

      </div>

  let wrap="plain",rev=false;

  const update=()=>{

    update();
  }));

  wireCopyButtons(app);

}

/* ============================================================
   LABEL CROPPER
   Crops Amazon's A4 label PDFs to 4x6 thermal pages, fully in
   the browser via pdf-lib (lazy-loaded only on this page; the
   PDF itself never leaves the device).
   ============================================================ */
const PDFLIB_URL="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js";
let pdfLibPromise=null;
function loadPdfLib(){
  if(window.PDFLib) return Promise.resolve();
  if(!pdfLibPromise) pdfLibPromise=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=PDFLIB_URL; s.onload=()=>res(); s.onerror=()=>{pdfLibPromise=null;rej(new Error("load failed"));};
    document.head.appendChild(s);
  });
  return pdfLibPromise;
}

const PDFJS_URL="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js";
const PDFJS_WORKER_URL="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js";
let pdfJsPromise=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(!pdfJsPromise) pdfJsPromise=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=PDFJS_URL;
    s.onload=()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER_URL;}catch(e){}res();};
    s.onerror=()=>{pdfJsPromise=null;rej(new Error("load failed"));};
    document.head.appendChild(s);
  });
  return pdfJsPromise;
}

/* Full scrollable PDF preview shared by the label cropper, FNSKU
   stickers and GST invoices — every page is on screen, so the whole
   batch can be verified before printing. Pages are drawn with pdf.js
   into a scrolling viewer; each page renders as it nears the viewport
   and is released again once far away, so a 1,000-page file previews
   as lightly as a 10-page one. Chrome's embedded PDF plugin is not
   used (the CSP blocks it as a blob: frame on hardened deploys, and
   phones don't render PDF iframes at all); the iframe remains only as
   the fallback when pdf.js itself cannot load. */
async function pdfPreviewInto(holder,heading,bytes,url,alt){
  if(!holder) return;
  if(holder._pv){try{holder._pv.obs.disconnect();holder._pv.doc.destroy();}catch(e){}holder._pv=null;}
  holder.innerHTML=`<div class="panel"><h4>${heading} <a class="prevlink" href="${url}" target="_blank" rel="noopener">Open full PDF ↗</a></h4><div class="prevscroll"><div class="note" style="margin:12px">Rendering preview…</div></div></div>`;
  try{
    await loadPdfJs();
    const pdoc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
    const total=pdoc.numPages;
    const box=holder.querySelector(".prevscroll");
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const base1=(await pdoc.getPage(1)).getViewport({scale:1});
    const slotW=Math.max(200,Math.min(box.clientWidth-28,440));
    box.innerHTML="";
    const slots=[];
    for(let p=1;p<=total;p++){
      const cell=document.createElement("div");cell.className="pv-page";cell.style.width=slotW+"px";
      const slot=document.createElement("div");slot.className="pv-slot";
      slot.style.height=Math.round(slotW*base1.height/base1.width)+"px";
      const cap=document.createElement("div");cap.className="pv-cap";cap.textContent="Page "+p+" / "+total;
      cell.appendChild(slot);cell.appendChild(cap);box.appendChild(cell);
      slots.push(slot);
    }
    const release=idx=>{
      const slot=slots[idx];
      if(slot.dataset.st==="r"){slot.dataset.gone="1";return;}
      if(slot.dataset.st==="d"){slot.innerHTML="";delete slot.dataset.st;}
    };
    const render=async idx=>{
      const slot=slots[idx];
      if(slot.dataset.st) return;
      slot.dataset.st="r";
      try{
        const pg=await pdoc.getPage(idx+1);
        const base=pg.getViewport({scale:1});
        const vp=pg.getViewport({scale:dpr*slotW/base.width});
        const cv=document.createElement("canvas");
        cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
        await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
        slot.style.height=Math.round(slotW*base.height/base.width)+"px";
        slot.innerHTML="";slot.appendChild(cv);slot.dataset.st="d";
        if(slot.dataset.gone){delete slot.dataset.gone;release(idx);}
      }catch(e){delete slot.dataset.st;}
    };
    const obs=new IntersectionObserver(es=>{
      for(const e of es){
        const idx=slots.indexOf(e.target);
        if(idx>=0){if(e.isIntersecting)render(idx);else release(idx);}
      }
    },{root:box,rootMargin:"1400px 0px"});
    slots.forEach(s=>obs.observe(s));
    holder._pv={obs,doc:pdoc};
  }catch(e){
    holder.innerHTML=`<div class="panel"><h4>${heading}</h4><iframe class="pdfprev" src="${url}" title="${alt}"></iframe></div>`;
  }
}

      // they're blank by definition, so drop them regardless of the option.

      }));
      status("Reading labels…");
      try{
        await loadPdfJs();
        // Deliberately specific markers: a combined label+invoice page also
        // contains these, so classification only splits when the file has
        // BOTH marked and unmarked pages (see below).
        const invRe=/\btax\s+invoice\b|\bbill\s+of\s+supply\b|\boriginal\s+for\s+recipient\b|\binvoice\s+(number|no\.?|date)\b/i;
        for(let fi=0;fi<filesBytes.length;fi++){
          const pdoc=await pdfjsLib.getDocument({data:filesBytes[fi].slice(0)}).promise;
          for(let p=1;p<=pdoc.numPages;p++){
            const pageObj=await pdoc.getPage(p);
            const tc=await pageObj.getTextContent();
            const pageH=pageObj.view[3]-pageObj.view[1];
            const pageW=pageObj.view[2]-pageObj.view[0];
            const posItems=tc.items.map(x=>({s:x.str,y:x.transform[5],x:x.transform[4]}));
            const items=posItems.map(x=>x.s);
            const text=items.join(" ");
            const info=lcPageInfo.find(x=>x.f===fi&&x.i===p-1);
            if(!info) continue;
            // Blank pages (Amazon sometimes pads the PDF): a page with no
            // text is only "blank" if it also draws no images or shapes —
            // the operator check keeps image-only labels safe.
            if(blankSkip&&!posItems.some(t=>t.s.trim())){
              try{
                const ol=await pageObj.getOperatorList();
                const O=pdfjsLib.OPS;
                const contentOps=new Set(["showText","showSpacedText","nextLineShowText","nextLineSetSpacingShowText",
                  "paintImageXObject","paintInlineImageXObject","paintImageMaskXObject",
                  "fill","eoFill","stroke","fillStroke","eoFillStroke","shadingFill"]

            // Labels often ship with no text layer at all, so the invoice
            // table's bottom edge can only be seen in the pixels — render
            // small and scan for the lowest inked row inside the crop.

                      x1=Math.min(cnv.width,Math.ceil((crop.left+crop.width)/100*cnv.width)),
                      y0=Math.max(0,Math.floor(crop.top/100*cnv.height)),
                      y1=Math.min(cnv.height,Math.ceil((crop.top+crop.height)/100*cnv.height));

                const rowDark=yy=>{
                  let dark=0;
                  for(let xx=x0;xx<x1;xx++){

                  }
                  return false;
                };

                // "Middle" is Amazon's own caption slot: the gap between
                // the invoice-table block and the bottom code table
                // (STXA/Sold-on). Only a bottommost block that starts in
                // the last 22% of the label counts as a code table — when
                // there isn't one, the caption goes below all content.
                const Hpx=y1-y0;
                const gapPx=Math.max(2,Math.round(Hpx*4/300));
                const minGapPx=Math.ceil(Hpx*18/(crop.height/100*pageH||1));

                for(let yy=y0;yy<y1;yy++){
                  if(rowDark(yy)){if(bs<0)bs=yy;bg=0;}

            const capRe1=/^\s*([A-Za-z0-9][^|]{1,60}?)\s*\|\s*Qty\s*[-:#]?\s*(\d+)/i;

            // position — the seller SKU is the "( ... )" after the ASIN in

              const floor=posItems.reduce((mm,t)=>/^(TOTAL:?$|Amount in Words)/.test(t.s.trim())&&t.y<headY?Math.max(mm,t.y):mm,-1)+2;

              // products, and a label captioned with only the first one

              const cells=posItems.filter(t=>t.y<headY&&t.y>floor&&t.x>=descEnd-2&&!/[a-z]/.test(t.s))

                }

              if(skus.length>1) info.items=skus.map((s2,i2)=>({sku:s2,qty:ints[i2]||0}));

            // 1) explicit "SKU: xyz" marker (raw Amazon labels/invoices)
            const m=text.match(/\bSKU\b\s*[:#\-]?\s*([A-Za-z0-9][A-Za-z0-9_\-\/\.]{1,39})/i);

            else if(cap) info.sku=cap[1].trim();
            else if(colSku) info.sku=colSku.slice(0,60);
            else{
              // joined-text fallbacks for captions split across items
              const m2=text.match(/([A-Za-z0-9][^|]{1,60}?)\s*\|\s*Qty\s*[:#]?\s*\d+/i);
              if(m2) info.sku=m2[1].trim();
              else{
                const m3=text.match(/([A-Za-z0-9][^()|]{1,60}?)\s*\(\s*Qty\s*[:#]?\s*\d+\s*\)/i);
                if(m3) info.sku=m3[1].trim();
                else{
                  // 4) raw Amazon invoice row: "ASIN ( seller SKU )" —
                  // table amounts can interleave into the paren content in
                  // reading order, so strip currency/percent/tax tokens.
                  const m4=text.match(/\bB0[A-Z0-9]{8}\b\s*\(\s*([^)]{2,220}?)\s*\)/);
                  if(m4){
                    const s=m4[1].replace(/₹\s?[\d.,]+/g," ").replace(/\b\d+(?:\.\d+)?%/g," ")
                      .replace(/\b(?:IGST|CGST|SGST|UTGST|GST)\b/g," ").replace(/\b\d+\b/g," ")
                      .replace(/\s+/g," ").trim();
                    if(s.length>=2) info.sku=s.slice(0,60);
                  }
                }
              }
            }
            if(cap) info.qty=parseInt(cap[2],10)||0;
            else if(colQty) info.qty=colQty;
            else{
              const mq=text.match(/\bQty\s*[-:#]?\s*(\d+)/i);
              if(mq) info.qty=parseInt(mq[1],10)||0;
            }
            const mo=text.match(/\b(\d{3}-\d{7}-\d{7})\b/);
            if(mo) info.oid=mo[1];

      // carry a caption in BOTH halves; splitting halves the crop region
      // vertically and each half keeps its own SKU / qty / order id.
      let split=splitSel==="1"?1:splitSel==="2"?2:0;

        // invoices on the right — narrow a full-page crop automatically.
        if(presetKey==="full"){crop.left=0;crop.top=0;crop.width=50;crop.height=100;autoLeft=true;}

          // Only split pages that really carry two orders (a caption in
          // each half) unless the user forces 2-per-page. Single-caption
          // pages (e.g. payment/continuation sheets) stay whole.
          // The caption sits under its label, so its x position says which
          // column the label occupies — some tools alternate the label
          // between left and right of the invoice from page to page.
          const sideOf=h=>h&&h.cap?(h.capX>=(x.pageW||595)/2?1:0):undefined;
          const both=x.halves&&x.halves[0].cap&&x.halves[1].cap;
          if(splitSel==="2"||both){
            for(let r=0;r<2;r++){
              const h=x.halves?x.halves[r]:{sku:"",qty:0,oid:""};
              units.push({f:x.f,i:x.i,region:r,side:sideOf(h),sku:h.sku||"",oid:h.oid||"",qty:h.qty||0,inv:false,invs:[]});
            }
          }else{
            x.side=sideOf(x.halves&&(x.halves[0].cap?x.halves[0]:x.halves[1]));
            units.push(x);
          }
        }
        lcPageInfo=units;
      }
      // Link each invoice page to its label (label first, then its
      // invoice pages — Amazon's alternating layout). An invoice with no
      // preceding label in its file attaches to the next label.
      for(let fi=0;fi<filesBytes.length;fi++){
        const pages=lcPageInfo.filter(x=>x.f===fi);
        let lastLabel=null; const orphans=[];
        for(const x of pages){
          if(x.inv){ if(lastLabel) lastLabel.invs.push(x); else orphans.push(x); }
          else{ lastLabel=x; if(orphans.length){x.invs.push(...orphans);orphans.length=0;} }
        }
      }
      // Labels inherit SKU / order id / qty from their invoice pages.
      for(const x of lcPageInfo){
        if(x.inv) continue;
        for(const iv of x.invs){
          if(!x.sku&&iv.sku) x.sku=iv.sku;
          if(!x.oid&&iv.oid) x.oid=iv.oid;
          if(!x.qty&&iv.qty) x.qty=iv.qty;
          if(!x.items&&iv.items) x.items=iv.items;
        }
      }
      // Labels only. SKU-wise is the default sort; unrecognised SKUs go
      // last in their original order.
      const orderList=lcPageInfo.filter(x=>!x.inv);
      if(sortMode==="sku") orderList.sort((a,b)=>{
        const ka=a.sku||"￿", kb=b.sku||"￿";
        return ka<kb?-1:ka>kb?1:(a.f-b.f)||(a.i-b.i);
      });
      else if(sortMode==="qty") orderList.sort((a,b)=>(b.qty||0)-(a.qty||0)||(a.f-b.f)||(a.i-b.i));
      const skippedInv=lcPageInfo.filter(x=>x.inv).length;

      // Stage 1: label-only 4x6 pages (masked), plus invoice pages if wanted.
      status("Cropping…");
      const labelDoc=await PDFLib.PDFDocument.create();
      const invDoc=invMode==="none"?null:await PDFLib.PDFDocument.create();
      const skuFont=(skuPrint||dtPrint||numPrint)?await labelDoc.embedFont(PDFLib.StandardFonts.HelveticaBold):null;
      // Embed only the pages we will actually draw (labels + their linked
      // invoice pages). Skipped blanks stay out — pdf-lib can't even embed
      // a page whose Contents stream is missing entirely.
      const needed=srcDocs.map(()=>new Set());
      for(const x of orderList){
        needed[x.f].add(x.i);
        for(const iv of x.invs||[]) needed[iv.f].add(iv.i);
      }
      const labelEmb=[],invEmb=[];
      for(let fi=0;fi<filesBytes.length;fi++){
        const idxs=[...needed[fi]].sort((a,b)=>a-b);
        const map={},map2={};
        if(idxs.length){
          const e1=await labelDoc.embedPdf(filesBytes[fi],idxs);
          idxs.forEach((pi,k)=>map[pi]=e1[k]);
          if(invDoc){
            const e2=await invDoc.embedPdf(filesBytes[fi],idxs);
            idxs.forEach((pi,k)=>map2[pi]=e2[k]);
          }
        }
        labelEmb.push(map);
        invEmb.push(invDoc?map2:null);
      }
      let labels=0;
      const invCounts=[];
      for(const info of orderList){
        const sp=srcDocs[info.f].getPage(info.i);
        const W=sp.getWidth(),H=sp.getHeight();
        const cw=crop.width/100*W;
        let ch=crop.height/100*H;
        const cx=crop.left/100*W;
        let cy=H-(crop.top/100*H)-ch;
        if(info.region!==undefined){ ch=ch/2; if(info.region===0) cy+=ch; }
        let ucx=cx;
        if(autoLeft&&info.side===1) ucx=W/2;
        const scale=Math.min(288/cw,432/ch);
        const page=labelDoc.addPage([288,432]);
        const dx=(288-cw*scale)/2, dy=(432-ch*scale)/2;
        page.drawPage(labelEmb[info.f][info.i],{x:dx-ucx*scale,y:dy-cy*scale,xScale:scale,yScale:scale});
        if(dx>0.1){page.drawRectangle({x:0,y:0,width:dx,height:432,color:white()});
          page.drawRectangle({x:288-dx,y:0,width:dx,height:432,color:white()});}
        if(dy>0.1){page.drawRectangle({x:0,y:0,width:288,height:dy,color:white()});
          page.drawRectangle({x:0,y:432-dy,width:288,height:dy,color:white()});}
        if(numPrint||dtPrint||skuPos==="top"){
          page.drawRectangle({x:0,y:416,width:288,height:16,color:white()});
          const parts=[];
          if(numPrint) parts.push((labels+1)+" / "+orderList.length);
          if(skuPos==="top"&&(info.sku||info.qty)) parts.push(
            info.items&&info.items.length>1
              ? info.items.map(t=>t.sku+(t.qty?" x"+t.qty:"")).join(" + ")
              : (info.sku||"")+(info.sku&&info.qty?" | ":"")+(info.qty?"Qty - "+info.qty:""));
          if(dtPrint) parts.push(dtStamp);
          const strip=parts.join("  ·  ");
          if(strip){
            // Shrink the type when number + SKU + date all share the 4" strip.
            const size=strip.length>56?7.5:9;
            page.drawText(strip.slice(0,size===9?60:74),{x:8,y:size===9?420.5:421.5,size,font:skuFont,color:PDFLib.rgb(0,0,0)});
          }
        }
        if(skuPrint&&skuPos!=="top"&&(info.sku||info.qty)){
          // Multi-item orders print one line per product so the packer
          // fills the parcel completely.
          const capLines=info.items&&info.items.length>1
            ? info.items.slice(0,4).map(t=>(t.sku+(t.qty?" | Qty - "+t.qty:"")).slice(0,64))
            : [((info.sku||"")+(info.sku&&info.qty?" | ":"")+(info.qty?"Qty - "+info.qty:"")).slice(0,64)];
          const bandH=14*capLines.length;
          // Middle: just under the measured content bottom — where Amazon
          // prints its own caption, after the seller/GSTIN/invoice table.
          // Bottom, split halves, or no measurement: strip at the page's
          // bottom edge instead.
          let capTop=bandH+2;
          if(skuPos==="mid"&&info.botFrac!==undefined&&info.region===undefined)
            capTop=Math.max(bandH+2,Math.min(430,dy+ch*scale*(1-info.botFrac)-2));
          page.drawRectangle({x:0,y:capTop-bandH,width:288,height:bandH,color:white()});
          capLines.forEach((ln,li)=>{
            const size2=ln.length>44?8:10;
            page.drawText(ln,{x:10,y:capTop-11-14*li,size:size2,font:skuFont,color:PDFLib.rgb(0,0,0)});
          });
        }
        labels++;
        if(invDoc){
          let added=0;
          if(info.invs.length){
            // The file has dedicated invoice pages — use them as-is.
            for(const iv of info.invs){
              const vp=srcDocs[iv.f].getPage(iv.i);
              const VW=vp.getWidth(),VH=vp.getHeight();
              const s2=Math.min((A4W-40)/VW,(A4H-40)/VH);
              const ip=invDoc.addPage([A4W,A4H]);
              ip.drawPage(invEmb[iv.f][iv.i],{x:(A4W-VW*s2)/2,y:(A4H-VH*s2)/2,xScale:s2,yScale:s2});
              added++;
            }
          }else{
            // Combined format: cut the invoice area out of the label page.
            // For split units the invoice sits in the unit's own horizontal
            // band (typically to the right of its label).
            let ix=0,iy=0,iw=W,ih=H;
            if(info.region!==undefined||info.side!==undefined){
              iy=cy;ih=ch;
              if(invPos!=="full"){iw=W/2;ix=(info.side===1)?0:W/2;}
            }
            else if(invPos==="right"){ix=W/2;iw=W/2;}
            else if(invPos==="bottom"){ih=H/2;}
            const s2=Math.min((A4W-40)/iw,(A4H-40)/ih);
            const ip=invDoc.addPage([A4W,A4H]);
            const jx=(A4W-iw*s2)/2, jy=(A4H-ih*s2)/2;
            ip.drawPage(invEmb[info.f][info.i],{x:jx-ix*s2,y:jy-iy*s2,xScale:s2,yScale:s2});
            if(jx>0.1){ip.drawRectangle({x:0,y:0,width:jx,height:A4H,color:white()});
              ip.drawRectangle({x:A4W-jx,y:0,width:jx,height:A4H,color:white()});}
            if(jy>0.1){ip.drawRectangle({x:0,y:0,width:A4W,height:jy,color:white()});
              ip.drawRectangle({x:0,y:A4H-jy,width:A4W,height:jy,color:white()});}
            added=1;
          }
          invCounts.push(added);
        }else invCounts.push(0);
      }

      // Stage 2: lay labels out in the chosen format.
      const labelBytes=await labelDoc.save();
      let outDoc;
      if(fmt==="4x6"){
        outDoc=await PDFLib.PDFDocument.load(labelBytes);
      }else{
        outDoc=await PDFLib.PDFDocument.create();
        const lsrc=await PDFLib.PDFDocument.load(labelBytes);
        const lemb=await outDoc.embedPdf(labelBytes,lsrc.getPageIndices());
        if(fmt==="a4-1up"){
          const s=Math.min((A4W-60)/288,(A4H-60)/432);
          for(const ep of lemb){
            const p=outDoc.addPage([A4W,A4H]);
            p.drawPage(ep,{x:(A4W-288*s)/2,y:(A4H-432*s)/2,xScale:s,yScale:s});
          }
        }else{ // a4-4up: 2×2 grid with cut lines
          const cellW=A4W/2,cellH=A4H/2;
          const s=Math.min((cellW-20)/288,(cellH-20)/432);
          const grey=PDFLib.rgb(0.75,0.75,0.75);
          for(let i=0;i<lemb.length;i++){
            const slot=i%4;
            const p=slot===0?outDoc.addPage([A4W,A4H]):outDoc.getPage(outDoc.getPageCount()-1);
            if(slot===0){
              p.drawLine({start:{x:cellW,y:0},end:{x:cellW,y:A4H},thickness:0.5,color:grey});
              p.drawLine({start:{x:0,y:cellH},end:{x:A4W,y:cellH},thickness:0.5,color:grey});
            }
            const col=slot%2,rowi=Math.floor(slot/2);
            const ox=col*cellW+(cellW-288*s)/2;
            const oy=A4H-(rowi+1)*cellH+(cellH-432*s)/2;
            p.drawPage(lemb[i],{x:ox,y:oy,xScale:s,yScale:s});
          }
        }
      }

      // Stage 3: invoices — appended into the same PDF or a separate one.
      let invBytes=null;
      if(invDoc){
        invBytes=await invDoc.save();
        if(invMode==="interleave"){
          const merged=await PDFLib.PDFDocument.create();
          const lp=await merged.copyPages(outDoc,outDoc.getPageIndices());
          const ip=await merged.copyPages(invDoc,invDoc.getPageIndices());
          if(fmt==="a4-4up"){lp.forEach(p=>merged.addPage(p));ip.forEach(p=>merged.addPage(p));}
          else{let off=0;for(let i=0;i<lp.length;i++){merged.addPage(lp[i]);
            for(let k=0;k<(invCounts[i]||0);k++){if(ip[off])merged.addPage(ip[off]);off++;}}}
          outDoc=merged;
        }
      }

      // Order list / picklist page(s) — first or last per the option.
      if(olist!=="no"){
        const font=await outDoc.embedFont(PDFLib.StandardFonts.Helvetica);
        const fontB=await outDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
        // Each product counts under its own SKU row — a packet holding
        // two products appears in two rows (the labels' captions carry
        // the full contents), and the Total row says how many packets
        // hold multiple SKUs so the arithmetic stays checkable.
        const groups=new Map();
        for(const x of orderList){
          for(const k of x.items&&x.items.length>1?x.items.map(t=>t.sku):[x.sku||"(not detected)"])
            groups.set(k,(groups.get(k)||0)+1);
        }
        const multi=orderList.filter(x=>x.items&&x.items.length>1).length;
        const rows=[...groups.entries()].sort((a,b)=>a[0]<b[0]?-1:1);
        const mkPage=n=>olist==="first"?outDoc.insertPage(n,[A4W,A4H]):outDoc.addPage([A4W,A4H]);
        // Full-grid ORD | SKU table (ORD = packets of that SKU) with a
        // Total row, and the site as a watermark at the bottom.
        const TL=40,TR=A4W-40,C1=TL+70;
        const black=PDFLib.rgb(0,0,0), grey=PDFLib.rgb(0.45,0.45,0.45);
        const site=/^(localhost|127\.)/.test(location.hostname)?"sellertoolsindia.com":location.host;
        const ROW=24,HEAD=30;
        let inserted=0,pageO=null,y=0,tableTop=0;
        const startPage=()=>{
          pageO=mkPage(inserted);inserted++;
          let ty=A4H-46;
          pageO.drawText("Order List",{x:TL,y:ty,size:14,font:fontB});
          pageO.drawText(`${labels} labels — Seller Tools India`,{x:TR-160,y:ty+1,size:9,font,color:grey});
          const ww=font.widthOfTextAtSize(site,10);
          pageO.drawText(site,{x:(A4W-ww)/2,y:26,size:10,font,color:PDFLib.rgb(0.62,0.62,0.62)});
          tableTop=ty-12;
          const hb=tableTop-HEAD;
          pageO.drawText("ORD",{x:TL+12,y:hb+10,size:13,font:fontB});
          pageO.drawText("SKU",{x:C1+12,y:hb+10,size:13,font:fontB});
          pageO.drawLine({start:{x:TL,y:hb},end:{x:TR,y:hb},thickness:1,color:black});
          y=hb;
        };
        const closeTable=withTotal=>{
          let bottom=y;
          if(withTotal){
            bottom=y-ROW-6;
            pageO.drawLine({start:{x:TL,y},end:{x:TR,y},thickness:1,color:black});
            pageO.drawText(`Total package: ${labels}${multi?`  (${multi} contain 2+ SKUs)`:""}`,{x:TL+12,y:bottom+10,size:13,font:fontB});
          }
          pageO.drawRectangle({x:TL,y:bottom,width:TR-TL,height:tableTop-bottom,borderColor:black,borderWidth:1.2});
          const vEnd=withTotal?y:bottom;
          pageO.drawLine({start:{x:C1,y:tableTop},end:{x:C1,y:vEnd},thickness:1,color:black});
        };
        startPage();
        for(const [sku,n] of rows){
          if(y-ROW<80){closeTable(false);startPage();}
          pageO.drawText(String(n),{x:TL+12,y:y-ROW+8,size:12,font:fontB});
          const rs=sku.length>62?9:12;
          pageO.drawText(sku.slice(0,rs===12?62:88),{x:C1+12,y:y-ROW+8,size:rs,font});
          y-=ROW;
          // full grid: a rule under every row
          pageO.drawLine({start:{x:TL,y},end:{x:TR,y},thickness:0.8,color:black});
        }
        closeTable(true);
      }

      const outBytes=await outDoc.save();
      const url=URL.createObjectURL(new Blob([outBytes],{type:"application/pdf"}));
      const dl=document.getElementById("lc-dl");
      dl.href=url;dl.style.display="inline-block";
      const dl2=document.getElementById("lc-dl2");
      if(invMode==="separate"&&invBytes){
        dl2.href=URL.createObjectURL(new Blob([invBytes],{type:"application/pdf"}));
        dl2.style.display="inline-block";
      }else dl2.style.display="none";
      const fmtName=fmt==="4x6"?"4×6 thermal":fmt==="a4-4up"?"A4, 4 per sheet":"A4, 1 per sheet";
      pdfPreviewInto(document.getElementById("lc-prev"),`Preview — ${labels} label(s) on ${outDoc.getPageCount()} page(s) (${fmtName})`,outBytes,url,"Cropped labels preview");

      // Compact detection summary — chips per SKU, no table.
      {
        const counts={};
        orderList.forEach(x=>{for(const k of x.items&&x.items.length>1?x.items.map(t=>t.sku):[x.sku]) if(k)counts[k]=(counts[k]||0)+1;});
        const entries=Object.entries(counts);
        const unknown=orderList.filter(x=>!x.sku&&!(x.items&&x.items.length)).length;
        document.getElementById("lc-skus").innerHTML=(entries.length||detectFailed)?`<div class="panel">
          ${detectFailed?`<div class="banner warn">The text-reading engine could not load, so labels are in their original order. Nothing was uploaded anywhere — try again once online.</div>`:""}
          ${entries.length?`<div class="chips">${entries.map(([k,n])=>`<span class="chip">${esc(k)} · ${n}</span>`).join("")}${unknown?`<span class="chip">(no SKU read) · ${unknown}</span>`:""}</div>`:""}
        </div>`:"";
      }

      status(`Done — ${labels} label(s)${split===2?` (2 per page detected${autoLeft?", labels column auto-cropped":""})`:""}${skippedInv?`, ${invMode==="none"?"skipped":"paired"} ${skippedInv} invoice page(s)`:""}${blanksSkipped?`, ${blanksSkipped} blank page(s) removed`:""}, ${outDoc.getPageCount()} output page(s)${sortMode==="sku"?", sorted SKU-wise":sortMode==="qty"?", sorted by quantity":", in original order"}. Check the preview, then download.`);
    }catch(e){
      try{console.error("Label cropper:",e);}catch(_){}
      status("Could not process that PDF"+(String(e).includes("load failed")?" — the PDF engine failed to load (check your connection) and nothing was uploaded anywhere.":" — it may be corrupted or password-protected."));
    }
    btn.disabled=false;lcBusy=false;
  };
  document.getElementById("lc-go").addEventListener("click",()=>{lcProcess(false);});
}

/* ============================================================
   ORDER PRINTER — picklist + packing slips
   Reads the unshipped-orders report (tab-delimited export from
   Seller Central > Orders > Order Reports) and prints a picklist
   and per-order packing slips via the browser. Fully local.
   ============================================================ */
function parseOrdersReport(text){
  const lines=text.split(/\r\n|\r|\n/).filter((l,i)=>!(l.trim()===""));
  if(!lines.length) return {orders:[],header:[],missing:["(empty file)"]};
  const delim=lines[0].includes("\t")?"\t":",";
  const header=saSplit(lines[0],delim).map(h=>h.trim());
  const norm=header.map(saNormHeader);
  const col=name=>norm.indexOf(name);
  const pick=(fields,name)=>{const i=col(name);return i===-1?"":(fields[i]??"").trim();};
  const need=["order-id","sku"];
  const missing=need.filter(n=>col(n)===-1);
  if(missing.length) return {orders:[],header,missing};
  const byOrder=new Map();
  for(let i=1;i<lines.length;i++){
    const f=saSplit(lines[i],delim);
    if(f.length<2) continue;
    const oid=pick(f,"order-id"); if(!oid) continue;
    const qty=parseInt(pick(f,"quantity-to-ship")||pick(f,"quantity-purchased"),10)||1;
    let o=byOrder.get(oid);
    if(!o){
      o={orderId:oid,
        buyer:pick(f,"recipient-name")||pick(f,"buyer-name"),
        addr:[pick(f,"ship-address-1"),pick(f,"ship-address-2"),pick(f,"ship-address-3")].filter(Boolean).join(", "),
        city:pick(f,"ship-city"),state:pick(f,"ship-state"),pin:pick(f,"ship-postal-code"),
        service:pick(f,"ship-service-level"),date:pick(f,"purchase-date"),
        promise:pick(f,"promise-date"),items:[]};
      byOrder.set(oid,o);
    }
    o.items.push({sku:pick(f,"sku"),name:pick(f,"product-name"),qty});
  }
  return {orders:[...byOrder.values()],header,missing:[]};
}

let opParsed=null;
function renderOrderPrinter(){ opBody(); }
function opBody(){
  document.title="Amazon Order Printer — Picklist & Packing Slips — Seller Tools India";
  const md=document.querySelector('meta[name="description"]');
  if(md) md.setAttribute("content","Turn your Amazon unshipped-orders report into a printable picklist and packing slips — free, fully in your browser.");
  backBtn.hidden=false;
  app.innerHTML=`
    <div class="wrap page">
      <h2>Amazon Order Printer</h2>
      <p class="lede">Export your <b>unshipped orders report</b> from Seller Central (Orders → Order Reports → Unshipped Orders), drop it here, and print a picklist (total units per SKU) plus a packing slip for every order.</p>
      ${helpHtml("order-printer")}
      <label class="sa-drop" id="op-drop">
        <div class="ico">🖨️</div>
        <h3>Drop your orders report here</h3>
        <p>or click to choose — .txt or .csv</p>
        <input type="file" id="op-file" accept=".csv,.txt,text/plain,text/csv">
      </label>
      <div class="sa-priv">🔒 Private by design — the report (including customer addresses) is read locally and never leaves your device.</div>
      <div id="op-out"></div>
    </div>`;
  const drop=document.getElementById("op-drop"),file=document.getElementById("op-file");
  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over");}));
  const read=f=>{
    const rd=new FileReader();
    rd.onload=()=>{opParsed=parseOrdersReport(String(rd.result));opRender();};
    rd.readAsText(f);
  };
  drop.addEventListener("drop",ev=>{const f=ev.dataTransfer.files[0];if(f)read(f);});
  file.addEventListener("change",()=>{const f=file.files[0];if(f)read(f);});
  if(opParsed) opRender();
}

function opRender(){
  const out=document.getElementById("op-out"); if(!out)return;
  const r=opParsed;
  if(r.missing.length){
    out.innerHTML=`<div class="banner warn" style="margin-top:16px">This file is missing the ${r.missing.map(esc).join(", ")} column(s). Export the <b>Unshipped Orders</b> report from Seller Central → Orders → Order Reports and try again.</div>`;
    return;
  }
  const orders=r.orders;
  const totalUnits=orders.reduce((s,o)=>s+o.items.reduce((x,i)=>x+i.qty,0),0);
  const pick=new Map();
  for(const o of orders) for(const it of o.items){
    const k=it.sku;
    const p=pick.get(k)||{sku:it.sku,name:it.name,qty:0,orders:0};
    p.qty+=it.qty;p.orders++;if(!p.name&&it.name)p.name=it.name;
    pick.set(k,p);
  }
  const pickRows=[...pick.values()].sort((a,b)=>b.qty-a.qty);
  const hasAddr=orders.some(o=>o.addr||o.city);
  out.innerHTML=`
    <div class="stats" style="margin-top:16px">
      <div class="stat blue"><div class="k">Orders</div><div class="v">${orders.length}</div></div>
      <div class="stat"><div class="k">Units to pick</div><div class="v">${totalUnits}</div></div>

              <input id="pfc-delay" inputmode="numeric" value="${esc(s.delay)}"></div>
          </div>
          <div class="note" style="margin-top:12px;margin-bottom:0">Reserve ⓘ — Amazon holds back a slice of each settlement (unshipped orders + A-to-Z claim reserve) and releases it in the following one.</div>
        </div>
        <div id="pfc-out"></div>
      </div>
    </div>`;
  const numeric={"pfc-sales":1,"pfc-ded":1,"pfc-res":1,"pfc-delay":1};

function pfcLoad(){
  const t=new Date();
  const iso=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  const d={last:iso,cycle:"7",sales:"5000",ded:"22",res:"5",delay:"2"};
  let s={};
  try{s=JSON.parse(localStorage.getItem("payout_fc")||"{}")||{};}catch(e){}
  for(const k in d) if(typeof s[k]==="string"&&s[k]!=="") d[k]=s[k];
  if(!["7","14","1"].includes(d.cycle)) d.cycle="7";
  return d;
}

function pfcSave(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:"";};
  try{
    localStorage.setItem("payout_fc",JSON.stringify({
      last:g("pfc-last"),cycle:g("pfc-cycle"),sales:g("pfc-sales"),
      ded:g("pfc-ded"),res:g("pfc-res"),delay:g("pfc-delay"),
    }));
  }catch(e){}
}

function pfcParseDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");
  if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return isNaN(d)?null:d;
}

function pfcToday(){
  const d=new Date();
  return new Date(d.getFullYear(),d.getMonth(),d.getDate());
}

function pfcAddDays(d,n){
  return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
}

/* Add n business days, skipping Saturdays and Sundays; if the result still
   lands on a weekend (possible only when n=0), roll forward to Monday. */
function pfcAddBiz(d,n){
  let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  let left=Math.max(0,Math.round(n)||0);
  while(left>0){
    x=pfcAddDays(x,1);
    const w=x.getDay();
    if(w!==0&&w!==6) left--;
  }
  while(x.getDay()===0||x.getDay()===6) x=pfcAddDays(x,1);
  return x;
}

function pfcFmt(d){
  return d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
}

function pfcPaint(){
  const out=document.getElementById("pfc-out"); if(!out) return;
  const g=id=>{const el=document.getElementById(id);return el?el.value:"";};
  const last=pfcParseDate(g("pfc-last"));
  const cyc=+g("pfc-cycle")||7;
  const sales=Math.max(0,parseFloat(g("pfc-sales"))||0);
  const ded=Math.min(100,Math.max(0,parseFloat(g("pfc-ded"))||0));
  const res=Math.min(100,Math.max(0,parseFloat(g("pfc-res"))||0));
  const delay=Math.min(15,Math.max(0,Math.round(parseFloat(g("pfc-delay"))||0)));
  if(!last){
    out.innerHTML=`<div class="banner info">Pick the date of your last settlement (Seller Central → Payments → Statement view) to see the forecast.</div>`;
    return;
  }
  const today=pfcToday();
  const future=last>today;

  // First upcoming close: last settlement + one cycle; if that is already in
  // the past (old date entered), roll forward cycle by cycle to the next close.
  let first=pfcAddDays(last,cyc), rolled=false;
  while(first<today){first=pfcAddDays(first,cyc);rolled=true;}

  // Per-cycle money. Steady daily sales means each cycle's new holdback is
  // matched by the previous cycle's release, so every deposit is the same.
  const gross=sales*cyc;
  const afterDed=gross*(1-ded/100);
  const held=afterDed*res/100;
  const released=held; // previous cycle's reserve, released this settlement
  const deposit=afterDed-held+released;

  let rowsHtml="",firstCredit=null,firstDays=0;
  for(let i=0;i<6;i++){
    const close=pfcAddDays(first,i*cyc);
    const credit=pfcAddBiz(close,delay);
    if(i===0){firstCredit=credit;firstDays=Math.round((credit-today)/864e5);}
    rowsHtml+=`<tr><td>${i+1}</td><td>${pfcFmt(close)}</td><td>${pfcFmt(credit)}</td><td class="num">${inr(deposit)}</td></tr>`;
  }
  const when=firstDays<=0?"today":(firstDays===1?"in 1 day":`in ${firstDays} days`);
  out.innerHTML=`
    <div class="banner good" style="font-size:15px"><b>Next deposit: ~${inr0(deposit)}</b> on <b>${pfcFmt(firstCredit)}</b> (${when}).</div>
    ${future?`<div class="banner warn">Your last settlement date is in the future — double-check it against Payments → Statement view.</div>`:""}
    <div class="chips" style="margin-bottom:14px">
      <span class="chip">Gross / cycle: ${inr0(gross)}</span>
      <span class="chip">− Deductions (${ded}%): ${inr0(gross-afterDed)}</span>
      <span class="chip">− New reserve held (${res}%): ${inr0(held)}</span>
      <span class="chip">+ Prior reserve released: ${inr0(released)}</span>
    </div>
    <div class="tblwrap"><table class="sa" style="min-width:520px">
      <thead><tr><th>#</th><th>Settlement closes</th><th>Est. bank credit</th><th class="num">Est. deposit</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
    <div class="note" style="margin-top:10px">Estimates only — actual settlement timing, cycle changes and reserve amounts are controlled by Amazon and can shift with unshipped orders, claims and bank holidays (only weekends are skipped here). Deposits assume steady daily sales, so each cycle's new holdback is offset by the previous cycle's release.${rolled?" Your last settlement is more than one cycle old, so the schedule starts from the next upcoming close.":""}</div>`;
}
