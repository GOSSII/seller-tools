/* ============================================================
   RETURNS ANALYZER (Pro) — the economics of what comes back.
   Settlements say what refunds COST; the two return reports say
   WHY and in what condition. Together, per SKU: what returns eat
   of its own sales, how much stock comes back sellable, what
   share is logistics (RTO) rather than the product's fault, and
   the reasons in Amazon's own words — grouped into buckets a
   seller can act on. Nothing is estimated: every panel names the
   file it was read from, and missing files switch panels off.
   ============================================================ */
let rtFiles=[];
/* Amazon's return-reason codes, grouped by what a seller can DO about them.
   MFN codes arrive prefixed (CR-, UND-) — normalised before lookup. */
const RT_BUCKETS=[
  {k:"rto",name:"Logistics / RTO — never reached the buyer",advice:"Not a product problem. Check pincode serviceability, courier performance and COD share; on Easy Ship these often refund at first scan.",
    re:/^(UNDELIVERABLE|UND$|UND\b|NEVER_ARRIVED|UNDELIVERABLE_|MISSED_ESTIMATED_DELIVERY)/},
  {k:"amzdamaged",name:"Damaged in Amazon's or the courier's hands",advice:"The fulfilment centre or the carrier damaged it — that is reimbursable stock, not a QC problem. Run Reconciliation with the same files to check the reimbursement actually arrived.",
    re:/^DAMAGED_BY_/},
  {k:"product",name:"Product problems",advice:"Defects, missing parts, quality — fix the product or the QC before spending another rupee on ads.",
    re:/^(DEFECTIVE|QUALITY_UNACCEPTABLE|MISSING_PARTS)/},
  {k:"remorse",name:"Buyer remorse / ordering mistakes",advice:"Ordered and changed their mind, or ordered the wrong thing. Some is inevitable; a spike after a discount suggests deal-hunters.",
    re:/^(UNWANTED_ITEM|NO_LONGER_NEEDED|BOUGHT_BY_MISTAKE|ORDERED_WRONG_ITEM|MISORDERED|FOUND_BETTER_PRICE|BETTER_PRICE|UNAUTHORI)/},
  {k:"listing",name:"Listing mismatch",advice:"The buyer expected something else — sharpen images, size charts and the first bullet. Cheaper to fix than a defect.",
    re:/^(NOT_COMPATIBLE|NOT_AS_DESCRIBED|WRONG_ITEM|STYLE|SIZE|APPAREL_)/},
  {k:"switcheroo",name:"Wrong item returned (switcheroo)",advice:"The buyer sent back something other than your product. Photograph outgoing units, report the buyer, and claim via SAFE-T where the refund already happened.",
    re:/^SWITCHEROO/},
];
const rtBucketOf=reason=>{
  const r=String(reason||"").toUpperCase().replace(/^CR-/,"").replace(/^AMZ-PG-/,"").replace(/^UND-/,"UNDELIVERABLE_");
  for(const b of RT_BUCKETS) if(b.re.test(r)) return b.k;
  return "other";
};
function returnsCompute(settlements,fbaReturns,mfnReturns){
  const records=settlements.flatMap(p=>p.records);
  const base=records.length?skuCompute({records}):[];
  const bySku=new Map();
  const get=sku=>{let e=bySku.get(sku);
    if(!e){e={sku,sales:0,units:0,refundValue:0,unitsReturned:0,
      fbaBack:0,fbaSellable:0,fbaDamaged:0,mfnReq:0,mfnBack:0,mfnNotBack:0,mfnTransit:0,mfnLabel:0,mfnRefunded:0,
      reasons:new Map()};bySku.set(sku,e);}return e;};
  for(const s of base){
    const e=get(s.sku);
    e.sales=s.sales; e.units=s.units; e.refundValue=Math.abs(s.refundValue); e.unitsReturned=s.unitsReturned||0;
  }
  const bump=(e,reason,units)=>{const k=String(reason||"(none)");e.reasons.set(k,(e.reasons.get(k)||0)+units);};
  for(const r of fbaReturns||[]){
    const e=get(r.sku||"(no SKU)");
    const q=r.quantity||1;
    e.fbaBack+=q;
    if(r.disposition==="SELLABLE") e.fbaSellable+=q; else e.fbaDamaged+=q;
    bump(e,r.reason,q);
  }
  /* A return requested days ago that simply hasn't arrived yet is not a
     loss. Coverage = the newest request date in the report; anything younger
     than 21 days with no delivery recorded counts as in transit. */
  let mfnCoverEnd=null;
  for(const r of mfnReturns||[]) if(r.requestDate&&(!mfnCoverEnd||r.requestDate>mfnCoverEnd)) mfnCoverEnd=r.requestDate;
  const dayDiff=(a,b)=>(Date.parse(b)-Date.parse(a))/86400000;
  for(const r of mfnReturns||[]){
    const e=get(r.sku||"(no SKU)");
    e.mfnReq++;
    if(r.deliveryDate) e.mfnBack++;
    else if(r.requestDate&&mfnCoverEnd&&dayDiff(r.requestDate,mfnCoverEnd)<21) e.mfnTransit++;
    else e.mfnNotBack++;
    e.mfnLabel+=r.labelCost||0;
    e.mfnRefunded+=r.refundedAmount||0;
    bump(e,r.reason,r.quantity||1);
  }
  const skus=[...bySku.values()].filter(e=>e.sales>0.005||e.refundValue>0.005||e.fbaBack>0||e.mfnReq>0);
  for(const e of skus){
    e.refundPct=e.sales>0?e.refundValue/e.sales*100:null;
    e.recovered=e.fbaBack>0?e.fbaSellable/e.fbaBack*100:null;
  }
  skus.sort((a,b)=>b.refundValue-a.refundValue);
  // Account totals + reason pareto with buckets.
  const t={sales:0,refundValue:0,unitsReturned:0,fbaBack:0,fbaSellable:0,fbaDamaged:0,
    mfnReq:0,mfnBack:0,mfnNotBack:0,mfnTransit:0,mfnLabel:0,mfnRefunded:0};
  const reasonAgg=new Map();
  for(const e of skus){
    for(const k of Object.keys(t)) t[k]+=e[k]||0;
    for(const [r,q] of e.reasons) reasonAgg.set(r,(reasonAgg.get(r)||0)+q);
  }
  const totalReasonUnits=[...reasonAgg.values()].reduce((a,x)=>a+x,0);
  const reasons=[...reasonAgg.entries()].map(([reason,units])=>({reason,units,
    bucket:rtBucketOf(reason),share:totalReasonUnits?units/totalReasonUnits*100:0}))
    .sort((a,b)=>b.units-a.units);
  const buckets=RT_BUCKETS.map(b=>({k:b.k,name:b.name,advice:b.advice,
    units:reasons.filter(r=>r.bucket===b.k).reduce((a,x)=>a+x.units,0)}))
    .concat([{k:"other",name:"Other / unmapped reasons",advice:"Reasons Amazon reports that fit no bucket — read them in the table below.",
      units:reasons.filter(r=>r.bucket==="other").reduce((a,x)=>a+x.units,0)}])
    .filter(b=>b.units>0).sort((a,b)=>b.units-a.units);
  /* Coverage windows so nobody compares numbers across mismatched periods. */
  const rng=(rows,f)=>{let a=null,b=null;for(const r of rows||[]){const d=f(r);if(!d)continue;if(!a||d<a)a=d;if(!b||d>b)b=d;}return a?[a,b]:null;};
  const coverage={
    settle:rng(settlements.filter(p=>p.summary),p=>saParseDate(p.summary.settlementStartDate))&&
      [rng(settlements.filter(p=>p.summary),p=>saParseDate(p.summary.settlementStartDate))[0],
       rng(settlements.filter(p=>p.summary),p=>saParseDate(p.summary.settlementEndDate))[1]],
    fba:rng(fbaReturns,r=>r.date),mfn:rng(mfnReturns,r=>r.requestDate)};
  return {skus,totals:t,reasons,buckets,coverage,
    have:{settle:settlements.length>0,fba:(fbaReturns||[]).length>0,mfn:(mfnReturns||[]).length>0}};
}

function rtStatus(e){

          e.fbaBack,e.fbaSellable,e.fbaDamaged,e.mfnReq,e.mfnNotBack,e.mfnLabel.toFixed(2),top?top[0]:""];}));
  });
}

/* ============================================================
   STORAGE FEE ANALYZER (Pro) — what your shelf space costs.
   Reads the Monthly Storage Fees report (Fulfilment Reports →
   Payments → Monthly Storage Fees, one file per month). Amazon
   bills storage per cubic metre per month; this shows which
   ASINs pay the rent, which pay rent while selling NOTHING, and
   how many months of stock are sitting there. One row per
   ASIN × fulfilment centre in the file; merged per ASIN here.
   Product names in this report contain embedded newlines inside
   quotes, so rows are scanned character-by-character, never
   split on newline.
   ============================================================ */
let stoFiles=[];
/* Full-record CSV scanner: returns array of field-arrays, quote-aware,
   embedded newlines and doubled quotes handled. */
function saCsvRecords(text){
  const s=String(text||"").replace(/^﻿/,"");
  const recs=[];let f="",row=[],q=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(q){
      if(c==='"'){ if(s[i+1]==='"'){f+='"';i++;} else q=false; }
      else f+=c;
    }else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"||c==="\r"){
      if(c==="\r"&&s[i+1]==="\n") i++;
      row.push(f); f="";
      if(row.length>1||row[0].trim()!=="") recs.push(row);
      row=[];
    }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); if(row.length>1||row[0].trim()!=="") recs.push(row); }
  return recs;
}
window.saCsvRecords=saCsvRecords; // exposed for verification/debugging
function parseStorageFees(text){
  const recs=saCsvRecords(text);
  if(!recs.length) return null;
  const cols=recs[0].map(h=>h.trim().toLowerCase());
  const ix=n=>cols.indexOf(n);
  const iAsin=ix("asin"),iName=ix("product-name"),iFc=ix("fulfillment-center"),
        iQty=ix("average-quantity-on-hand"),iVol=ix("estimated-total-item-volume"),
        iMonth=ix("month-of-charge"),iRate=ix("storage-rate"),iFee=ix("estimated-monthly-storage-fee"),
        iOrders=ix("average-quantity-customer-orders"),iItemVol=ix("item-volume"),
        iPend=ix("average-quantity-pending-removal");
  if(iAsin<0||iFee<0||iMonth<0) return null;
  const rows=[];
  for(let r=1;r<recs.length;r++){
    const f=recs[r];
    if(!f[iAsin]) continue;
    rows.push({asin:f[iAsin].trim(),name:iName>=0?(f[iName]||"").replace(/\s+/g," ").trim():"",
      fc:iFc>=0?(f[iFc]||"").trim():"",
      qty:Number(f[iQty])||0,volume:Number(f[iVol])||0,itemVolume:iItemVol>=0?(Number(f[iItemVol])||0):0,
      month:(f[iMonth]||"").trim(),rate:Number(f[iRate])||0,
      fee:Number(f[iFee])||0,orders:iOrders>=0?(Number(f[iOrders])||0):0,
      pending:iPend>=0?(Number(f[iPend])||0):0});
  }
  return rows.length?{rows}:null;
}
window.parseStorageFees=parseStorageFees; // exposed for verification/debugging
function storageCompute(rows){
  /* Group by month first — several monthly files can be dropped at once. */
  const byMonth=new Map();
  for(const r of rows){ const a=byMonth.get(r.month)||[]; a.push(r); byMonth.set(r.month,a); }
  const months=[...byMonth.keys()].sort();
  const monthTotals=months.map(m=>{
    const rs=byMonth.get(m);
    return {month:m,fee:rs.reduce((a,r)=>a+r.fee,0),volume:rs.reduce((a,r)=>a+r.volume,0),
      qty:rs.reduce((a,r)=>a+r.qty,0)};
  });
  /* Detail view reads the NEWEST month only — mixing months would double-count. */
  const latest=months[months.length-1];
  const cur=byMonth.get(latest)||[];
  const byAsin=new Map();
  for(const r of cur){
    let e=byAsin.get(r.asin);
    if(!e){e={asin:r.asin,name:r.name,fee:0,qty:0,volume:0,orders:0,pending:0,fcs:new Set()};byAsin.set(r.asin,e);}
    if(!e.name&&r.name) e.name=r.name;
    e.fee+=r.fee; e.qty+=r.qty; e.volume+=r.volume; e.orders+=r.orders; e.pending+=r.pending||0; e.fcs.add(r.fc);
  }
  /* qty and orders are DAILY averages in this report (that is why a
     100-unit-a-month seller shows orders ≈ 3.3) — multiply by the days in
     the charge month to get monthly units, or cover comes out 30x too deep. */
  const dm=String(latest||"").match(/^(\d{4})-(\d{2})$/);
  const daysInMonth=dm?new Date(Date.UTC(+dm[1],+dm[2],0)).getUTCDate():30;
  const asins=[...byAsin.values()];
  for(const e of asins){
    e.fcCount=e.fcs.size; delete e.fcs;
    e.monthlyUnits=e.orders*daysInMonth;
    e.monthsCover=e.monthlyUnits>0?e.qty/e.monthlyUnits:null;   // null = sold nothing
    e.rentPerSold=e.monthlyUnits>0?e.fee/e.monthlyUnits:null;
  }
  asins.sort((a,b)=>b.fee-a.fee);
  const t={fee:0,qty:0,volume:0,orders:0,deadFee:0,deadAsins:0,overFee:0};
  for(const e of asins){
    t.fee+=e.fee;t.qty+=e.qty;t.volume+=e.volume;t.orders+=e.orders;
    if(e.orders===0&&e.qty>0){t.deadFee+=e.fee;t.deadAsins++;}
    else if(e.monthsCover!==null&&e.monthsCover>6) t.overFee+=e.fee;
  }
  const rate=cur.length?cur[0].rate:0;
  return {months:monthTotals,latest,asins,totals:t,rate,daysInMonth};
}
window.storageCompute=storageCompute; // exposed for verification/debugging
function stoStatus(e){
  if(e.qty<=0) return {k:"info",l:"No stock"};
  if(e.orders===0&&e.pending>0) return {k:"watch",l:"Removal in progress"};
  if(e.orders===0) return {k:"loss",l:"Paying rent, selling nothing"};
  if(e.monthsCover>6) return {k:"problem",l:"Overstocked"};
  if(e.monthsCover>3) return {k:"watch",l:"Heavy cover"};
  return {k:"good",l:"OK"};
}
window.stoStatus=stoStatus; // exposed for verification/debugging

/* ============================================================
   RTO RADAR (Pro) — where your parcels come back from.
   Reads the All Orders report (Fulfilment Reports → Sales → All
   Orders), whose order-status column directly records RTO
   outcomes ("Returned to Seller", "Undeliverable", "Rejected by
   Buyer"). Per state, pincode and SKU: how much ships back
   without ever selling — the cost centre Indian COD sellers feel
   hardest and no Amazon page totals up. The seller-fulfilled
   Return Report is optional and only enriches: it says which
   RTOs were already refunded. Nothing is estimated; a state
   with too few shipments is told so instead of given a rate.
   ============================================================ */
let rtoFiles=[];
const RTO_STATUSES=new Set(["Shipped - Returned to Seller","Shipped - Returning to Seller",
  "Shipped - Undeliverable","Shipped - Rejected by Buyer"]);
const RTO_MIN_SHIPPED=10;   // below this a rate is noise, not a signal
const RTO_MATURE_DAYS=21;   // an RTO takes 2-3 weeks to be recorded
function parseAllOrders(text){
  const lines=String(text||"").replace(/^﻿/,"").split(/\r\n|\r|\n/);
  let hln=-1; for(let i=0;i<lines.length;i++){if(lines[i].trim()!==""){hln=i;break;}}
  if(hln===-1) return null;
  const cols=lines[hln].split("\t").map(h=>h.trim().toLowerCase());
  const ix=n=>cols.indexOf(n);
  const iOrder=ix("amazon-order-id"),iDate=ix("purchase-date"),iStatus=ix("order-status"),
        iSku=ix("sku"),iQty=ix("quantity"),iPrice=ix("item-price"),iSvc=ix("ship-service-level"),
        iCity=ix("ship-city"),iState=ix("ship-state"),iPin=ix("ship-postal-code"),
        iItem=ix("order-item-id"),iChan=ix("fulfillment-channel");
  if(iOrder<0||iStatus<0||iState<0) return null;
  const rows=[];
  for(let i=hln+1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const f=lines[i].split("\t");
    if(!f[iOrder]) continue;
    rows.push({orderId:f[iOrder].trim(),itemId:iItem>=0?(f[iItem]||"").trim():"",
      date:(f[iDate]||"").slice(0,10),status:(f[iStatus]||"").trim(),
      sku:iSku>=0?(f[iSku]||"").trim():"",qty:iQty>=0?(Number(f[iQty])||0):0,
      price:iPrice>=0?(saParseAmount(f[iPrice])||0):0,
      service:iSvc>=0?(f[iSvc]||"").trim():"",channel:iChan>=0?(f[iChan]||"").trim():"",
      city:iCity>=0?(f[iCity]||"").trim():"",
      state:iState>=0?(f[iState]||"").trim().toUpperCase():"",
      pin:iPin>=0?(f[iPin]||"").trim():""});
  }
  return rows.length?{rows}:null;
}
window.parseAllOrders=parseAllOrders; // exposed for verification/debugging
function rtoCompute(orderRows,mfnReturns){
  /* Several files may overlap in period — dedupe by order-item. */
  const seen=new Set(),rows=[];
  for(const r of orderRows){
    /* order-item-id can be "0" on off-Amazon orders — never a key on its own */
    const k=r.orderId+"|"+(r.itemId&&r.itemId!=="0"?r.itemId:r.sku+"|"+r.date);
    if(seen.has(k)) continue; seen.add(k); rows.push(r);
  }
  const isRto=r=>RTO_STATUSES.has(r.status);
  const isShipped=r=>r.status.startsWith("Shipped");
  const isCancelled=r=>r.status==="Cancelled";
  /* refunded RTOs — the money already left; the rest is stock in limbo */
  const refunded=new Set();
  for(const m of mfnReturns||[]) refunded.add(m.orderId);
  const mk=()=>({shipped:0,rto:0,rtoValue:0,cancelled:0,orders:0});
  const byState=new Map(),bySku=new Map(),bySvc=new Map(),byPin=new Map();
  const t={rows:rows.length,shipped:0,rto:0,rtoValue:0,rtoRefunded:0,cancelled:0,pending:0,
    distinctOrders:new Set(rows.map(r=>r.orderId).filter(Boolean)).size,
    shippedMature:0,dates:[null,null]};
  const matureRows=[];
  for(const r of rows){
    if(r.date){ if(!t.dates[0]||r.date<t.dates[0]) t.dates[0]=r.date; if(!t.dates[1]||r.date>t.dates[1]) t.dates[1]=r.date; }
    const st=byState.get(r.state)||mk(); byState.set(r.state,st);
    const sk=bySku.get(r.sku)||mk(); bySku.set(r.sku,sk);
    const sv=bySvc.get(r.service)||mk(); bySvc.set(r.service,sv);
    st.orders++; sk.orders++; sv.orders++;
    if(isCancelled(r)){ t.cancelled++; st.cancelled++; sk.cancelled++; continue; }
    if(!isShipped(r)){ t.pending++; continue; }
    t.shipped++; st.shipped++; sk.shipped++; sv.shipped++;
    matureRows.push(r);
    if(isRto(r)){
      t.rto++; t.rtoValue+=r.price; st.rto++; st.rtoValue+=r.price; sk.rto++; sk.rtoValue+=r.price; sv.rto++;
      if(refunded.has(r.orderId)) t.rtoRefunded++;
      if(r.pin){ const p=byPin.get(r.pin)||{pin:r.pin,city:r.city,state:r.state,rto:0,value:0};
        p.rto++; p.value+=r.price; byPin.set(r.pin,p); }
    }
  }
  const states=[...byState.entries()].map(([state,v])=>({state:state||"(no state)",...v,
    rate:v.shipped>0?v.rto/v.shipped*100:null,thin:v.shipped<RTO_MIN_SHIPPED}))
    .filter(x=>x.orders>0)
    .sort((a,b)=>(b.thin?-1:b.rate??-1)-(a.thin?-1:a.rate??-1)||b.rto-a.rto);
  const skus=[...bySku.entries()].map(([sku,v])=>({sku:sku||"(no SKU)",...v,
    rate:v.shipped>0?v.rto/v.shipped*100:null,thin:v.shipped<RTO_MIN_SHIPPED}))
    .filter(x=>x.shipped>0).sort((a,b)=>b.rto-a.rto||b.shipped-a.shipped);
  const services=[...bySvc.entries()].map(([service,v])=>({service:service||"(unknown)",...v,
    rate:v.shipped>0?v.rto/v.shipped*100:null})).filter(x=>x.shipped>0)
    .sort((a,b)=>b.shipped-a.shipped);
  const pins=[...byPin.values()].filter(p=>p.rto>=2).sort((a,b)=>b.rto-a.rto);
  /* Volume alone does not make a cohort measurable. An RTO takes 2-3 weeks to
     be recorded, so a parcel shipped yesterday has not had its chance to come
     back — counting it in the denominator manufactures a low rate. Maturity =
     enough shipped volume AND enough elapsed time, measured against the newest
     order in the file (the only "as of" the file itself can prove). */
  if(t.dates[1]){
    const end=new Date(t.dates[1]).getTime();
    for(const r of matureRows){
      if(!r.date) continue;
      if((end-new Date(r.date).getTime())/86400000>=RTO_MATURE_DAYS) t.shippedMature++;

function rtoStatus(e,mature){

  if(e.thin) return {k:"data",l:"Low volume"};
  if(e.rate>=10) return {k:"loss",l:"RTO hotspot"};
  if(e.rate>=6) return {k:"problem",l:"High RTO"};
  if(e.rate>=4) return {k:"watch",l:"Watch"};

}

function rtoAddFiles(list){
  const files=[...(list||[])]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    const finish=()=>{ if(--pending===0) rtoRenderResults(); };
    saReadDropped(f,text=>{
      rtoFiles=rtoFiles.filter(x=>x.name!==f.name);
      const mr=parseMfnReturns(text);
      if(mr){ rtoFiles.push({name:f.name,kind:"mfnret",rows:mr.rows}); finish(); return; }
      const ao=parseAllOrders(text);
      if(ao){ rtoFiles.push({name:f.name,kind:"orders",rows:ao.rows}); finish(); return; }

      finish();
    },msg=>{ rtoFiles=rtoFiles.filter(x=>x.name!==f.name); rtoFiles.push({name:f.name,kind:"error",msg}); finish(); });
  });

/* ============================================================
   STRANDED INVENTORY (Pro) — stock in the warehouse that cannot
   sell. Amazon's Stranded Inventory report lists every unit that
   is physically in an FC but has no active listing to sell
   through — deleted listings, listing errors, stock under
   review. It pays storage rent and earns nothing, and the
   report even names the fix per row. Where the report has no
   price (the listing is gone), the value is taken from the
   SKU's own average selling price in your settlements — and
   marked as such, never silently.

let strFiles=[];
const STR_REASON_ADVICE={
  "listing error":"The listing exists but something in it blocks selling — open Fix stranded inventory in Seller Central, correct the detail, and the stock returns to sale without moving.",
  "deleted listing":"The listing was deleted while stock remained — relist the SKU (Amazon's suggested action is usually 'Create a new listing') and the units become sellable again.",
  "inventory under review":"Amazon is holding this stock while it reviews the product — nothing to fix in the listing; chase the review through Case Log if it has sat for weeks.",
  "expired":"Past its expiry window — removal is usually the only path.",
  "qualification required":"The category or brand needs approval before the stock can sell — apply, or remove the stock.",

function strDate(sv){
  const m=String(sv||"").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  return m?`${m[3]}-${m[1]}-${m[2]}`:null;   // MM/DD/YYYY → ISO
}
function parseStranded(text){
  const recs=saCsvRecords(text);
  if(!recs.length) return null;
  const cols=recs[0].map(h=>h.trim().toLowerCase());
  const ix=n=>cols.indexOf(n);
  const iAction=ix("primary-action"),iDate=ix("date-stranded"),iAuto=ix("date-to-take-auto-removal"),
        iReason=ix("stranded-reason"),iAsin=ix("asin"),iSku=ix("sku"),iName=ix("product-name"),
        iQty=ix("fulfillable-qty"),iPrice=ix("your-price"),iUnf=ix("unfulfillable-qty"),
        iRes=ix("reserved-quantity"),iErr=ix("error-message");
  if(iReason<0||iSku<0||iDate<0) return null;
  const rows=[];
  for(let i=1;i<recs.length;i++){
    const f=recs[i];
    if(!f[iSku]&&!f[iAsin]) continue;
    rows.push({sku:(f[iSku]||"").trim(),asin:iAsin>=0?(f[iAsin]||"").trim():"",
      name:iName>=0?(f[iName]||"").replace(/\s+/g," ").trim():"",
      reason:(f[iReason]||"").trim(),action:iAction>=0?(f[iAction]||"").trim():"",
      error:iErr>=0?(f[iErr]||"").trim():"",
      dateStranded:strDate(f[iDate]),autoRemoval:iAuto>=0?strDate(f[iAuto]):null,
      qty:Number(f[iQty])||0,unfQty:iUnf>=0?(Number(f[iUnf])||0):0,
      reserved:iRes>=0?(Number(f[iRes])||0):0,
      price:iPrice>=0?(saParseAmount(f[iPrice])||0):0});

function strandedCompute(rows,settlements,today){

  /* price fallback: the SKU's average unit principal from settlements */

  if(settlements&&settlements.length){
    for(const s of skuCompute({records:settlements.flatMap(p=>p.records)}))
      if(s.units>0&&s.sales>0) avgPrice.set(s.sku,s.sales/s.units);

/* ============================================================
   TRAFFIC DOCTOR (Pro) — why a SKU doesn't sell.
   Reads Business Reports → Detail Page Sales and Traffic (By
   Child Item). A weak SKU fails one of three ways and each has a
   different fix: nobody SEES it (traffic problem — ads/SEO),
   people see it and don't BUY (listing/price problem), or buyers
   see someone else's offer (Buy Box problem). This report is the
   only place Amazon says which — sessions, conversion and
   Featured-Offer share per ASIN. Judgements are relative to the
   account's own average, never a magic number; the one estimate
   on the page (units lost vs your average) is labelled as one.
   ============================================================ */
let tdFiles=[];
function parseTraffic(text){
  const recs=saCsvRecords(text);
  if(!recs.length) return null;
  const cols=recs[0].map(h=>h.replace(/^﻿/,"").trim().toLowerCase());
  const ix=n=>cols.indexOf(n);
  const iAsin=ix("(child) asin"),iParent=ix("(parent) asin"),iTitle=ix("title"),
        iSess=ix("sessions - total"),iPv=ix("page views - total"),
        iBb=ix("featured offer percentage"),iUnits=ix("units ordered"),
        iCvr=ix("unit session percentage"),iSales=ix("ordered product sales");
  if(iAsin<0||iSess<0||iCvr<0) return null;
  const num=v=>{const x=parseFloat(String(v||"").replace(/[₹,%\s]/g,"").replace(/,/g,""));return isFinite(x)?x:0;};
  const rows=[];
  for(let i=1;i<recs.length;i++){
    const f=recs[i];
    if(!f[iAsin]) continue;
    rows.push({asin:f[iAsin].trim(),parent:iParent>=0?(f[iParent]||"").trim():"",
      title:iTitle>=0?(f[iTitle]||"").replace(/\s+/g," ").trim():"",
      sessions:num(f[iSess]),pageViews:iPv>=0?num(f[iPv]):0,
      buyBox:iBb>=0?num(f[iBb]):null,units:iUnits>=0?num(f[iUnits]):0,
      cvr:num(f[iCvr]),sales:iSales>=0?num(f[iSales]):0});
  }
  return rows.length?{rows}:null;
}
window.parseTraffic=parseTraffic; // exposed for verification/debugging
const TD_MIN_SESS=100;   // below this a conversion rate is noise
const TD_INVISIBLE=10;   // below this the ASIN had too little traffic to judge
function trafficCompute(rowsIn){
  /* several files (periods/accounts should NOT be mixed — dedupe by ASIN keeps
     a re-drop from double counting) */
  const seen=new Set(),rows=[];
  for(const r of rowsIn){ if(seen.has(r.asin)) continue; seen.add(r.asin); rows.push(r); }
  const t={asins:rows.length,sessions:0,units:0,sales:0};
  for(const r of rows){ t.sessions+=r.sessions; t.units+=r.units; t.sales+=r.sales; }
  t.cvr=t.sessions>0?t.units/t.sessions*100:0;
  const lowBar=Math.max(1,t.cvr*0.5);        // 'no conversion' = below half your own average (floor 1%)
  const starBar=t.cvr*1.5;                   // 'feed it traffic' = 1.5x your average
  const items=rows.map(r=>{
    let diag,fix;
    if(r.sessions<TD_INVISIBLE){ diag="invisible"; fix="Very little traffic in this export — investigate traffic sources before changing the listing."; }
    else if(r.buyBox!==null&&r.buyBox<70&&r.sessions>=50){ diag="buybox"; fix="Not the Featured Offer consistently — check price, fulfilment, availability and seller performance."; }
    else if(r.sessions>=TD_MIN_SESS&&r.cvr<lowBar){ diag="noconv"; fix="Traffic exists, conversion is below your account average — investigate the detail page, price, reviews, delivery promise and traffic quality."; }
    else if(r.sessions>=TD_MIN_SESS&&r.cvr>=starBar){ diag="star"; fix="Converts above your account average on this export."; }
    else if(r.sessions<TD_MIN_SESS){ diag="thin"; fix=""; }
    else { diag="ok"; fix=""; }
    /* the one estimate, clearly labelled: units the ASIN would have sold at
       the ACCOUNT's average conversion, minus what it actually sold */
    const lostUnits=diag==="noconv"?Math.max(0,r.sessions*(t.cvr-r.cvr)/100):0;
    const unitPrice=r.units>0?r.sales/r.units:0;
    return {...r,diag,fix,lostUnits,lostValue:unitPrice>0?lostUnits*unitPrice:null};
  });
  const g=k=>items.filter(x=>x.diag===k);
  const noconv=g("noconv").sort((a,b)=>b.sessions-a.sessions);
  const stars=g("star").sort((a,b)=>b.cvr-a.cvr);
  const invisible=g("invisible").sort((a,b)=>b.units-a.units);
  const buybox=g("buybox").sort((a,b)=>b.sessions-a.sessions);
  t.wastedSessions=noconv.reduce((a,x)=>a+x.sessions,0);
  t.lostUnits=noconv.reduce((a,x)=>a+x.lostUnits,0);
  t.lostValue=noconv.reduce((a,x)=>a+(x.lostValue||0),0);
  return {items,noconv,stars,invisible,buybox,totals:t,lowBar,starBar};
}

function tdStatus(x){
  if(x.diag==="noconv") return {k:"loss",l:"Traffic wasted"};
  if(x.diag==="buybox") return {k:"problem",l:"Losing Buy Box"};
  if(x.diag==="invisible") return {k:"watch",l:"Low traffic"};
  if(x.diag==="star") return {k:"good",l:"Feed it traffic"};
  if(x.diag==="thin") return {k:"data",l:"Low sessions"};

}

</div>`;
  }
  if(r.stars.length){
    h+=`<div class="panel"><h4>⭐ Feed the winners <span class="sa-sub">(${r.stars.length} — converting above ${r.starBar.toFixed(1)}%, 1.5× your average)</span></h4>

      <div class="sa-sub" style="margin-top:6px">Every extra visitor converts here far above par — these are the ASINs worth advertising harder.</div></div>`;
  }
  if(r.invisible.length){
    h+=`<div class="panel"><h4>👻 Low traffic <span class="sa-sub">(${r.invisible.length} — under ${TD_INVISIBLE} sessions in this export)</span></h4>
      <p class="sa-sub" style="margin:4px 0 8px">These ASINs received very little traffic in the exported period. That can reflect low search visibility, low demand, a new listing, advertising coverage, availability or simply a short report period. Investigate traffic sources before changing the listing.</p>
      <div class="sa-sub">${r.invisible.slice(0,12).map(x=>esc(x.asin)).join(" · ")}${r.invisible.length>12?" · …":""}</div></div>`;
  }
  h+=`<details class="howto"><summary>How every number here is computed</summary><div class="hbody">
    <span class="htag">Formulas &amp; sources</span>
    <ol>
      <li>Everything comes from Amazon's own Business Report: sessions (visitors), unit session percentage (conversion), Featured Offer share (Buy Box), units and sales per child ASIN.</li>
      <li>Judgements are relative to <b>your account's own average conversion (${t.cvr.toFixed(1)}%)</b> — not an industry number: wasted-traffic below half of it, winners above 1.5× of it. Rates need ${TD_MIN_SESS}+ sessions; under ${TD_INVISIBLE} sessions an ASIN is <b>low-traffic</b>, between the two it's "low sessions" and left unjudged. Every judgement here is a <b>prioritisation rule</b>, not a diagnosis — the report shows symptoms, not causes.</li>
      <li>The only estimate on this page is <b>estimated upside at account avg</b> = sessions × (account average − ASIN conversion), valued at the ASIN's own average selling price. It is a counterfactual, not a loss the seller incurred, and is labelled with * everywhere it appears.</li>
      <li>Status: <span class="st st-loss">Low conversion</span> · <span class="st st-problem">Low Featured Offer share</span> &lt;70% with 50+ sessions · <span class="st st-watch">Low traffic</span> &lt;${TD_INVISIBLE} sessions · <span class="st st-good">Feed it traffic</span> ≥1.5× average · <span class="st st-data">Low sessions</span>.</li>
    </ol>
  </div></details>`;
  const worst=r.noconv[0];
  h+=`<div style="display:flex;justify-content:flex-end;gap:8px;margin:14px 0 2px"><button type="button" class="fbtn" id="td-csv">⬇ Export CSV</button><button type="button" class="fbtn" id="td-pdf">📄 Print / Save PDF</button><button type="button" class="fbtn" id="td-share">📤 Share PDF</button></div>
  <div class="panel"><h4>What should I do next?</h4><ul style="margin:8px 0 0 18px;line-height:1.9;font-size:13.5px">
    ${worst?`<li><b>${esc(worst.asin)}</b> had ${num(worst.sessions)} sessions but converted only ${worst.cvr.toFixed(2)}%, versus ${t.cvr.toFixed(2)}% across the account. Review its listing, price, Featured Offer status and traffic quality before increasing traffic spend — the <a href="/listing-checker">Listing Checker</a> is one place to start.</li>`:""}
    ${r.stars.length?`<li>The ⭐ ASINs convert above your account average on this export. If you are choosing where extra traffic goes, they are the better-evidenced candidates — see the <a href="/ads-optimizer">Ads Optimizer</a>.</li>`:""}
    <li>Whether the extra sales would be profitable is a margin question — check the SKUs in the <a href="/sku-report">SKU report</a> with your product costs.</li>
  </ul></div>`;
  out.innerHTML=h; tdWire(out,r);
}
function tdWire(out,r){

    tdFiles.splice(Number(b.dataset.rm),1); tdRenderResults();

    saCsvDownload("traffic-doctor.csv",
      ["ASIN","Product","Diagnosis","Sessions","Page views","Conversion %","Featured Offer %","Units","Sales (INR)","Units lost vs avg (est)","Fix"],
      r.items.map(x=>[x.asin,x.title,tdStatus(x).l,x.sessions,x.pageViews,x.cvr.toFixed(2),

function adsAddFiles(list){
  const files=[...(list||[])]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    const finish=()=>{ if(--pending===0) adsRenderResults(); };
    saReadDropped(f,text=>{
      adsFiles=adsFiles.filter(x=>x.name!==f.name); // re-drop replaces
      const st=parseSearchTermReport(text);
      if(st){ adsFiles.push({name:f.name,kind:"st",st}); finish(); return; }
      const ap=parseApGroups(text);
      if(ap){ adsFiles.push({name:f.name,kind:"ap",ap}); finish(); return; }
      const p2=parseUnifiedTransaction(text)||parseSettlement(text);
      if(p2&&(p2.records.length||p2.summary)) adsFiles.push({name:f.name,kind:"settlement",parsed:p2});
      else adsFiles.push({name:f.name,kind:"error",msg:"not recognised as a Search Term report, an Advertised-product report or a settlement file."+saDescribeColumns(text)});
      finish();
    },msg=>{ adsFiles=adsFiles.filter(x=>x.name!==f.name); adsFiles.push({name:f.name,kind:"error",msg}); finish(); });
  });
}
function adsRenderResults(){
  const out=document.getElementById("ads-out"); if(!out) return;
  let h=`<div class="rec-files">${adsFiles.map((f,i)=>`<span class="rec-file"${f.kind==="error"?` title="${esc(f.msg)}"`:""}><b>${esc(f.name)}</b><span class="rf-kind">${f.kind==="error"?"⚠ Wrong report":f.kind==="ap"?"Advertised product":f.kind==="settlement"?"Settlement":"Search terms"}</span><button type="button" data-rm="${i}" aria-label="Remove ${esc(f.name)}">✕</button></span>`).join("")}</div>`;
  const bad=adsFiles.filter(f=>f.kind==="error");
  if(bad.length) h+=`<div class="banner warn">${bad.map(f=>`<b>${esc(f.name)}</b>: ${esc(f.msg)}`).join("<br>")}</div>`;
  const all=adsFiles.filter(f=>f.kind==="st").flatMap(f=>f.st.terms);
  if(!all.length){ out.innerHTML=h; adsWire(out); return; }
  /* Optional deepening: the Advertised-product report bridges ad group → SKU,
     and settlements + product costs give each SKU its own break-even ACOS —
     the same formula Ad Profitability uses. Nothing loads → the flat
     thresholds stand. */
  const groupSku=new Map();
  for(const f of adsFiles.filter(x=>x.kind==="ap")) for(const [k,v] of f.ap.groupSku) groupSku.set(k,v);
  const beOf=new Map();
  {
    const settle=adsFiles.filter(x=>x.kind==="settlement").map(x=>x.parsed);
    if(settle.length){
      const rows=skuCompute({records:settle.flatMap(p2=>p2.records)});
      const costs=loadSkuCosts();
      for(const s2 of rows){
        const cost=Number(costs[s2.sku])||0;
        if(!(cost>0)||!(s2.sales>0)) continue;   // no cost → no break-even, never guessed
        const netUnits=Math.max(0,(s2.units||0)-(s2.unitsReturned||0));
        beOf.set(s2.sku,Math.round((s2.net-cost*netUnits)/s2.sales*1000)/10);
      }
    }
  }
  const r=adsCompute(all,{groupSku,breakEven:beOf});
  const t=r.totals;
  h+=`<div class="stats">
    <div class="stat"><div class="k">Ad spend in report</div><div class="v">${inr0(t.spend)}</div></div>
    <div class="stat"><div class="k">Ad sales</div><div class="v">${inr0(t.sales)}</div><div class="sa-sub" style="margin-top:3px">ACOS ${r.acosTotal===null?"—":r.acosTotal.toFixed(1)+"%"}</div></div>
    <div class="stat ${r.wasted>0?"red":"green"}"><div class="k">Going to words that never convert</div><div class="v">${inr0(r.wasted)}</div><div class="sa-sub" style="margin-top:3px">${r.negate.length} term${r.negate.length===1?"":"s"} to negate</div></div>
    <div class="stat green"><div class="k">Winners under broad/auto</div><div class="v">${r.promote.length}</div><div class="sa-sub" style="margin-top:3px">deserve their own exact match</div></div>
  </div>`;
  if(groupSku.size||beOf.size)
    h+=`<div class="banner ${r.termsWithBE?"good":"info"}">${r.termsMatched?`<b>${num(r.termsMatched)}</b> of ${num(all.length)} term rows sit in a single-SKU ad group and inherit that SKU`:"No term row could be matched to a single-SKU ad group — the two ad reports may cover different campaigns or periods"}${r.termsWithBE?`; <b>${num(r.termsWithBE)}</b> are judged against their SKU's <b>own break-even ACOS</b> (from your statements and product costs) instead of the flat ${ADS_BLEED_ACOS}% line`:beOf.size?"":groupSku.size?" — add settlement files and product costs and they get judged against each SKU's own break-even":""}.</div>`;
  h+=`<div class="banner info">These lists read the report you dropped — nothing is estimated. ACOS here is against <b>ad-attributed sales</b>; whether that ACOS is affordable for a given SKU depends on its margin, which lives in <a href="/ad-profit">Ad Profitability</a> (break-even ACOS per SKU).</div>`;
  if(r.negate.length){
    h+=`<div class="panel"><h4>🚫 Negate these <span class="sa-sub">(${r.negate.length} — ${ADS_NEG_CLICKS}+ clicks, ₹${ADS_NEG_SPEND}+ spent, zero orders)</span></h4>
      <p class="sa-sub" style="margin:4px 0 10px">Buyers typed these, clicked your ad, and never bought — over the whole report. Add each as a <b>negative exact</b> in its campaign and that exact term stops spending (close variants may still need their own negatives). Export gives you a paste-ready list.</p>
      <div style="display:flex;justify-content:flex-end;margin:0 0 6px"><button type="button" class="fbtn" id="ads-neg-csv">⬇ Export negatives CSV</button></div>
      <div class="tblwrap"><table class="sa">
        <thead><tr><th>Search term</th><th>Campaign</th><th>Match</th><th class="num">Clicks</th><th class="num">Spent</th></tr></thead>
        <tbody>${r.negate.slice(0,50).map(x=>`<tr>
          <td>${esc(x.term)}</td><td class="sa-sub">${esc(x.camp)}</td><td>${esc(x.match)}</td>
          <td class="num">${num(x.clicks)}</td><td class="num"><b>${inr(x.spend)}</b></td></tr>`).join("")}
        </tbody></table></div>
      ${r.negate.length>50?`<p class="sa-sub" style="margin-top:6px">Showing the worst 50 of ${r.negate.length} — the export has all of them.</p>`:""}
      <div class="rec-claim"><b>How to act:</b> Advertising console → the campaign → <b>Negative keywords</b> → add as <b>negative exact</b>. Negate in the campaign the term spent in, not account-wide — the same words may convert elsewhere.</div></div>`;
  }
  if(r.promote.length){
    h+=`<div class="panel"><h4>⭐ Give these their own exact match <span class="sa-sub">(${r.promote.length} — ${ADS_PROMOTE_ORDERS}+ orders at ≤${ADS_PROMOTE_ACOS}% ACOS, found under broad/phrase/auto)</span></h4>
      <p class="sa-sub" style="margin:4px 0 10px">These convert cheaply while riding along inside broad or auto targeting. An exact-match keyword of its own gets a controlled bid, its own budget, and stops the auto campaign from paying discovery prices for a term you already know works.</p>
      <div class="tblwrap"><table class="sa">
        <thead><tr><th>Search term</th><th>Found under</th><th>Match</th><th class="num">Orders</th><th class="num">Sales</th><th class="num">ACOS</th></tr></thead>
        <tbody>${r.promote.slice(0,30).map(x=>`<tr>
          <td><b>${esc(x.term)}</b></td><td class="sa-sub">${esc(x.camp)}</td><td>${esc(x.match)}</td>
          <td class="num">${num(x.orders)}</td><td class="num">${inr0(x.sales)}</td>
          <td class="num" style="color:var(--green);font-weight:700">${(x.spend/x.sales*100).toFixed(1)}%</td></tr>`).join("")}
        </tbody></table></div>
      <div class="rec-claim"><b>How to act:</b> create (or reuse) a manual campaign → add the term as an <b>exact match</b> keyword → then add it as a <b>negative exact</b> in the campaign it came from, so the two never bid against each other.</div></div>`;
  }
  if(r.bleed.length){
    h+=`<div class="panel"><h4>🩸 Converting at a loss <span class="sa-sub">(${r.bleed.length} — above ${r.termsWithBE?"their own break-even where known, else ":""}${ADS_BLEED_ACOS}% ACOS)</span></h4>
      <p class="sa-sub" style="margin:4px 0 10px">These do sell — but every rupee of sales costs ${ADS_BLEED_ACOS===100?"more than a rupee":"too much"} of ads. Lower the bid first; negate only if the term is clearly the wrong audience.</p>
      <div class="tblwrap"><table class="sa">
        <thead><tr><th>Search term</th><th>Campaign</th><th class="num">Orders</th><th class="num">Spent</th><th class="num">Sales</th><th class="num">ACOS</th></tr></thead>
        <tbody>${r.bleed.slice(0,30).map(x=>`<tr>
          <td>${esc(x.term)}</td><td class="sa-sub">${esc(x.camp)}</td>
          <td class="num">${num(x.orders)}</td><td class="num">${inr(x.spend)}</td><td class="num">${inr(x.sales)}</td>
          <td class="num" style="color:var(--red);font-weight:700">${(x.spend/x.sales*100).toFixed(0)}%${x.breakEven!==undefined?`<span class="sa-sub" style="font-weight:400"> vs its ${x.breakEven.toFixed(0)}% break-even</span>`:""}</td></tr>`).join("")}
        </tbody></table></div></div>`;
  }
  h+=`<div class="panel"><h4>📋 Campaign scoreboard <span class="sa-sub">(${r.campaigns.length})</span></h4>
    <div class="tblwrap"><table class="sa">
      <thead><tr><th>Campaign</th><th class="num">Spend</th><th class="num">Sales</th><th class="num">ACOS</th><th class="num">Orders</th><th class="num">CTR</th><th>Verdict</th></tr></thead>
      <tbody>${r.campaigns.map(c=>`<tr>
        <td>${esc(c.camp)}</td><td class="num">${inr0(c.spend)}</td><td class="num">${inr0(c.sales)}</td>

  h+=`<details class="howto"><summary>How every number here is computed</summary><div class="hbody">
    <span class="htag">Formulas &amp; thresholds</span>
    <ol>
      <li><b>ACOS</b> = spend ÷ ad-attributed sales, per term and per campaign. Zero sales reads "—", never 0%.</li>
      <li><b>Negate</b> = ${ADS_NEG_CLICKS}+ clicks and ₹${ADS_NEG_SPEND}+ spend with <b>zero</b> orders across the whole report — enough evidence that the term looks, clicks and doesn't buy.</li>

      <li>Attribution: sales figures are Amazon's 7-day window from the report itself — nothing here is joined to settlements or estimated.</li>
    </ol>
  </div></details>`;
  out.innerHTML=h; adsWire(out,r);
}

/* The app navigates by hash internally (every link and location.hash
   assignment below stays as-is); the address bar shows the clean path.
   #/profit routes, then becomes /profit; a direct hit on /profit is
   served index.html by a Vercel rewrite and routed from the pathname. */
function currentRoute(){
  if(location.hash.startsWith("#/")) return location.hash.replace(/^#\/?/,"");
  try{ return decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,""); }
  catch(e){ return location.pathname.replace(/^\/+|\/+$/g,""); }
}
function route(){
  const h=currentRoute();
  if(location.hash.startsWith("#/")){
    try{ history.replaceState(null,"","/"+h+location.search); }catch(e){}
  }
  const can=document.querySelector('link[rel="canonical"]');
  if(can) can.setAttribute("href","https://sellertoolsindia.com/"+h);
  renderAuthSlot();
  if(!h){renderHome();window.scrollTo(0,0);return;}

/* ---- Presence heartbeat (disclosed in privacy.html): a random per-tab id
   plus the current route, pinged every minute while the tab is visible, so
   the admin panel can show who's online and typical session length.
   No cookies, no IP stored; user id only when logged in. ---- */
function presenceSid(){
  try{
    let s=sessionStorage.getItem("sa_sid");
    if(!s){
      s=crypto.randomUUID?crypto.randomUUID():[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
      sessionStorage.setItem("sa_sid",s);
    }
    return s;
  }catch(e){ return null; }
}

function sendPing(){
  const sid=presenceSid(); if(!sid) return;
  if(document.visibilityState!=="visible") return;
  if(Date.now()-_lastPing<30000) return;
  _lastPing=Date.now();
  const s=storedSession();
  const headers={"Content-Type":"application/json"};
  if(s&&s.access_token) headers.Authorization="Bearer "+s.access_token;
  try{
    fetch("/api/ping",{method:"POST",headers,keepalive:true,
      body:JSON.stringify({sid,route:currentRoute().slice(0,60)||"home"})}).catch(()=>{});
  }catch(e){}
}
setInterval(sendPing,60000);

/* Production error reporting (Phase 8). If this page's own code throws on a
   visitor's machine, the admin panel should hear about it — otherwise the only
   report channel is a customer caring enough to email. Anonymous by design
   (message + route + position, no identity), deduped, and capped per session
   so a render loop cannot flood the endpoint. */
const _errSeen=new Set(); let _errBudget=5;
function reportClientError(message,source,line,col){
  try{
    message=String(message||"").slice(0,300); if(!message) return;
    const key=message+"|"+(line||0);
    if(_errSeen.has(key)||_errBudget<=0) return;
    _errSeen.add(key); _errBudget--;
    fetch("/api/client-error",{method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,
      body:JSON.stringify({message,source:String(source||"").slice(0,200),
        line:line||0,col:col||0,route:currentRoute().slice(0,60)||"home"})}).catch(()=>{});
  }catch(e){}
}
window.addEventListener("error",e=>{
  // Resource-load failures (an <img> 404) fire this too but carry no message —
  // only script errors are worth a row.
  if(e&&e.message) reportClientError(e.message,e.filename,e.lineno,e.colno);
});
window.addEventListener("unhandledrejection",e=>{
  const r=e&&e.reason;
  reportClientError(r&&r.message?("unhandled rejection: "+r.message):"unhandled rejection",
    r&&r.stack?String(r.stack).split("\n")[1]:"",0,0);
});
