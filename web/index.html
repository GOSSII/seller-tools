  } else {
    h+=`<div class="tblwrap"><table class="sa">
      <thead><tr><th>SKU</th><th>Status</th><th class="num">Units</th><th class="num">Gross sales</th><th class="num">Refunds</th><th class="num">Fees</th><th class="num">Taxes</th><th class="num">Net</th><th class="num">Net / unit</th><th class="num">Refund %</th></tr></thead>
      <tbody>${visPL.map(s=>{
        const rp=s.sales?Math.abs(s.refundValue)/s.sales*100:0;
        return `<tr>
          <td>${esc(s.sku)}</td>

  }

  h+=`<details class="howto"><summary>How every number here is computed</summary><div class="hbody">
    <span class="htag">Formulas</span>
    <ol>
      <li><b>Net</b> = the sum of every settlement line for the SKU: principal + fees + taxes + refunds. It is what reached your bank for that product this settlement.</li>
      <li><b>Refund %</b> = |refunded principal| ÷ gross principal, by value.</li>
      <li><b>True P&amp;L</b> (Advanced) = Net − product cost × units sold net of returns. A SKU with no cost entered shows <b>Needs data</b>, never a guessed profit — a missing cost is unknown, not zero.</li>
      <li><b>Status</b>: <span class="st st-loss">Loss</span> net (or true P&amp;L) below zero · <span class="st st-problem">Problem</span> refund % above 15 · <span class="st st-watch">Watch</span> refund % above 8 · <span class="st st-good">Good</span> otherwise · <span class="st st-data">Needs data</span> cost missing in Advanced mode.</li>
      <li>Order-level shipping (Easy Ship, postage) is traced to the SKU through the order id, except on mixed-SKU orders. Ad spend and other account-level charges stay under <b>(no SKU)</b> — no fee is ever invented per SKU.</li>
    </ol>
  </div></details>`;
  const worstRefund=[...withPL].filter(s=>s.sku!=="(no SKU)"&&s.sales>0).sort((a,b)=>(Math.abs(b.refundValue)/b.sales)-(Math.abs(a.refundValue)/a.sales))[0];
  {
    const acts=[];
    const wr=worstRefund&&worstRefund.sales?Math.abs(worstRefund.refundValue)/worstRefund.sales*100:0;
    if(worstRefund&&wr>=50) acts.push(["hot",wr>=99?"A full refund drove the loss":"Refunds are eating this SKU",
      `<b>${esc(worstRefund.sku)}</b> had <b>${wr.toFixed(0)}%</b> of its ${inr(worstRefund.sales)} of sales refunded and still carried ${inr(Math.abs(worstRefund.fees+worstRefund.taxes))} of Amazon charges — the fees stayed even though the sale did not.`,
      "#/returns","Check the refund reason →"]);
    else if(worst&&worst.net<0) acts.push(["hot","One SKU took money out of this settlement",
      `<b>${esc(worst.sku)}</b> contributed <b>${inr(worst.net)}</b>. Check its price against the fee steps and its weight band before advertising it further.`,

    if(Math.abs(acctNet)>=0.005) acts.push(["","Costs not tied to any product",
      `<b>${inr(acctNet)}</b> of this settlement belongs to no SKU — advertising, balances carried forward, account fees. It is excluded from every per-SKU figure above, so judge a SKU on its own row and this total separately.`,
      "#/settlement-analyzer","See the full settlement →"]);
    acts.push(["","Check Amazon charged correctly",

      "#/reconcile","Run the fee audit →"]);
    h+=`<div class="panel"><h4>What should I do next?</h4>
      <div class="acts">${acts.slice(0,4).map(([k,t,b,href,cta])=>
        `<div class="act ${k}"><h5>${t}</h5><p>${b}</p><a href="${href}">${cta}</a></div>`).join("")}</div></div>`;

  out.innerHTML=h;
  const skq=out.querySelector("#sku-q");

  }); }
  const skuCsv=out.querySelector("#sku-csv");
  if(skuCsv) skuCsv.addEventListener("click",()=>{
    const rows=withPL.map(s=>{
      const rp=s.sales?Math.abs(s.refundValue)/s.sales*100:0;
      const st=skuStatus(s,advOn,s.cpuKnown);
      return [s.sku,st.l,s.units,s.unitsReturned||0,s.sales.toFixed(2),s.refundValue.toFixed(2),
        s.fees.toFixed(2),s.taxes.toFixed(2),s.net.toFixed(2),rp.toFixed(1),

      ["SKU","Status","Units","Units returned","Gross sales (INR)","Refunds (INR)","Fees (INR)","Taxes (INR)","Net (INR)","Refund %","Cost/unit (INR)","True P&L (INR)"],rows);
  });
  out.querySelectorAll(".fbtn[data-sort]").forEach(b=>b.addEventListener("click",()=>{skuSort=b.dataset.sort;skuRenderResults();}));

    saveSkuCosts(c); skuRenderResults();

    saveSkuCosts(c); skuRenderResults();
  });
  out.querySelectorAll("[data-expand]").forEach(el=>el.addEventListener("click",()=>{
    const k=el.dataset.expand; if(skuExpanded.has(k))skuExpanded.delete(k); else skuExpanded.add(k); skuRenderResults();
  }));
}

/* ============================================================
   RECONCILIATION & SAFE-T FINDER (Pro)
   Cross-checks settlement file(s) — parsed with the SAME
   parseSettlement as the analyzer — plus an optional MTR, and
   separates confirmed discrepancies from cases needing evidence. Everything stays in the browser.
   ============================================================ */
let recFiles=[]; // {name, kind:"settlement"|"mtr", parsed?|rows?}
const REC_DONE_KEY="rec_done";
function loadRecDone(){try{return JSON.parse(localStorage.getItem(REC_DONE_KEY)||"{}")||{};}catch(e){return {};}}
function saveRecDone(d){try{localStorage.setItem(REC_DONE_KEY,JSON.stringify(d));}catch(e){}}

/* Minimal MTR reader (Merchant Tax Report B2C/B2B csv — headers use spaces,
   e.g. "Order Id", unlike the settlement flat file's dashes). Returns null
   if the file doesn't look like an MTR. */
function parseMtr(text){
  const rawLines=text.split(/\r\n|\r|\n/);
  let hln=-1; for(let i=0;i<rawLines.length;i++){if(rawLines[i].trim()!==""){hln=i;break;}}
  if(hln===-1) return null;
  const headerLine=rawLines[hln];
  const delim=headerLine.includes("\t")?"\t":",";
  const cols=saSplit(headerLine,delim).map(h=>h.trim().toLowerCase());
  const ix=n=>cols.indexOf(n);
  const iOrder=ix("order id"),iType=ix("transaction type");
  if(iOrder<0||iType<0) return null;
  const iSku=ix("sku"),iQty=ix("quantity"),iAmt=ix("invoice amount"),
        iShip=ix("shipment date"),iOd=ix("order date");
  const rows=[],errors=[];
  for(let i=hln+1;i<rawLines.length;i++){
    const raw=rawLines[i]; if(raw.trim()==="")continue;
    const f=saSplit(raw,delim);
    if(f.length!==cols.length){errors.push({line:i+1,reason:`Expected ${cols.length} columns, got ${f.length}`});continue;}
    const g=j=>j>=0?(f[j]??"").trim():"";
    const amt=saParseAmount(g(iAmt));
    rows.push({orderId:g(iOrder),type:g(iType),sku:g(iSku),
      quantity:Number(g(iQty).replace(/,/g,""))||0,
      amount:Number.isFinite(amt)?amt:0,
      shipDate:g(iShip),orderDate:g(iOd)});
  }
  return {rows,errors};
}
window.parseMtr=parseMtr; // exposed for verification/debugging

/* Pure cross-check over parsed settlements + MTR rows, so it is testable.
   Returns {issues:{refundFee,safeT,shipped,negative}, ordersChecked,
   refundsChecked, recovery, unpaid, notes}. Amounts follow the settlement
   sign convention (each issue's `amount` is the positive figure involved;
   null = unknown). `recovery` counts only claimable money (refund fee +
   SAFE-T); unpaid shipments are timing as often as they are money, so they
   are totalled separately in `unpaid` and never inflate the headline. */
const REC_PAY_LAG_DAYS=14;      // a shipment can take a fortnight to reach a statement
const REC_FEE_ITEMISED_MIN=0.2; // below this share of orders carrying a referral fee,
                                // the statements simply aren't itemising selling fees
const REC_UNMATCHED_WARN=0.15;  // unmatched share above which a missing statement
                                // series is the likelier explanation than unpaid money
                                // (a real account missing its COD series sat at 0.22)
const recDayNo=iso=>{const t=Date.parse(iso+"T00:00:00Z");return Number.isFinite(t)?Math.floor(t/86400000):null;};
const recShiftDays=(iso,n)=>{const d=recDayNo(iso);return d===null?null:new Date((d+n)*86400000).toISOString().slice(0,10);};
/* The most Amazon's published schedule allows as a closing fee for a price
   band. At a fulfilment centre the select-fee groups only ever charge less
   (Rs 20/13 and Rs 18/14 in the two lowest bands), and above Rs 1,000 the
   large-appliance list pays MORE (Rs 72), so that is the ceiling there. Off
   the fulfilment centre we cannot tell Easy Ship from Self-Ship, so take the
   higher of the two. */
/* Which weight slab a charged fulfilment fee belongs to. Every value on
   Amazon's published ladders is unique enough to identify its slab, so we can
   read the billed weight band straight off the statement without knowing the
   parcel — and comparing a SKU against its own usual slab neutralises zone and
   STEP tier, which change the rupees but not the band. */
const REC_SLAB_OF=(()=>{
  const m=new Map();
  const put=(v,slab,family)=>{ if(v>0&&!m.has(Math.round(v*100))) m.set(Math.round(v*100),{slab,family}); };
  for(const tier of Object.keys(FBA_WH)){
    FBA_WH[tier].r.forEach((v,i)=>put(v,i,"fba-r-"+tier));
    FBA_WH[tier].n.forEach((v,i)=>put(v,i,"fba-n-"+tier));
  }
  for(const tier of Object.keys(ES_WH)) ES_WH[tier].forEach((v,i)=>put(v,i,"es-"+tier));
  return m;
})();
const REC_FEE_FOR=(family,slab)=>{
  const [kind,a,b]=family.split("-");
  if(kind==="fba"){ const t=FBA_WH[b]; return t?t[a][slab]:null; }
  const t=ES_WH[a]; return t?t[slab]:null;
};
function recClosingCeiling(price,afn){
  const band=price<=300?0:price<=500?1:price<=1000?2:3;
  return afn?[26,22,27,72][band]:[20,26,51,101][band];
}
/* FBA customer returns report (Reports → Fulfilment → FBA customer returns).
   One row per returned unit. Returns null when the file isn't this report. */
function parseFbaReturns(text){
  const lines=String(text||"").replace(/^\ufeff/,"").split(/\r\n|\r|\n/);
  let hln=-1; for(let i=0;i<lines.length;i++){if(lines[i].trim()!==""){hln=i;break;}}
  if(hln===-1) return null;
  const delim=lines[hln].includes("\t")?"\t":",";

     settlement says so — only the join of three reports can: a refund with
     no return row and no reimbursement row, 45+ days on. Matching is by
     ORDER, deliberately: on a multi-item order a return of any line counts,
     so a false claim is never generated at the cost of missing a few. */
  const haveReturns=fbaReturns.length>0, haveReimb=reimbRows.length>0;
  let retCoverEnd=null, nrTooRecent=0, nrSuspicious=false;
  if(haveReturns&&haveReimb){
    const returnedOrders=new Set(fbaReturns.map(r=>r.orderId).filter(Boolean));
    /* A replacement's return often arrives under the REPLACEMENT order id
       while the refund sits on the original — credit the original. And an
       order that got a replacement at all is a different flow from a plain
       refund, so it is excluded from the ghost check outright. */
    const replToOrig=new Map(); for(const rp of replRows) replToOrig.set(rp.replOrder,rp.origOrder);
    for(const rp of replRows){ returnedOrders.add(rp.origOrder); }
    for(const r of fbaReturns){ const o=replToOrig.get(r.orderId); if(o) returnedOrders.add(o); }
    const reimbOrders=new Set(reimbRows.map(r=>r.orderId).filter(Boolean));
    /* The returns report only proves absence WITHIN ITS OWN DATES. A refund's
       return can arrive up to 45 days later, and the reimbursement a little
       after that — so a refund is only judged when the report's coverage
       (proxied by its newest return row) extends 45 days past the refund,
       plus a week for the reimbursement to post. Export the reports through
       TODAY, not through the statement end, and nothing is left unjudged. */
    for(const r of fbaReturns) if(r.date&&(!retCoverEnd||r.date>retCoverEnd)) retCoverEnd=r.date;
    const coverDay=retCoverEnd?recDayNo(retCoverEnd):null;
    /* nrJudged counts every refund old enough and inside coverage — matched
       or not — because it is the denominator for the sanity check below. */
    let nrJudged=0;
    for(const rec of records){
      if(!/refund/i.test(rec.transactionType)||rec.fulfillmentId!=="AFN"||rec.principal>=-0.005) continue;
      const d=saParseDate(rec.postedDate);
      const days=d?Math.floor((Date.now()-new Date(d+"T00:00:00Z").getTime())/86400000):null;
      if(days===null||days<45) continue;   // the buyer's return window is still open
      const matched=returnedOrders.has(rec.orderId)||reimbOrders.has(rec.orderId);
      if(coverDay===null||recDayNo(d)+45+7>coverDay){ if(!matched) nrTooRecent++; continue; }
      nrJudged++;
      if(matched) continue;
      notReturned.push({check:"notReturned",orderId:rec.orderId,sku:rec.sku,date:rec.postedDate,
        amount:Math.round(Math.abs(rec.principal)*100)/100,days,
        note:"Refunded "+days+" days ago — the item never reached a fulfilment centre and no reimbursement was ever issued"});
    }
    /* Sanity: on a real single account Amazon's automation almost never
       misses — the measured miss rate across four live accounts was 0–1% of
       judged refunds. A double-digit share does not mean Amazon forgot
       dozens of times; it means the statements and the reports are not from
       the SAME seller account (statements from several accounts in one
       folder is exactly how it happens — the returns report only ever covers
       one). Raising those would be filing claims on another account's
       refunds, so the whole list is demoted to suspicion and kept out of
       the claimable total. */
    nrSuspicious=nrJudged>0&&((notReturned.length>=5&&(notReturned.length/nrJudged)>0.10)
      ||(notReturned.length>=3&&(notReturned.length/nrJudged)>0.30));
    /* One order can carry a refund record per unit; a claim quotes the order
       once, so merge them and sum the money. */
    {const m=new Map();
     for(const x of notReturned){
       const k=x.orderId+"|"+(x.sku||"");
       const e=m.get(k);
       if(e){ e.amount=Math.round((e.amount+x.amount)*100)/100; e.note=e.note.replace(/^Refunded/,"Refunded (2+ units)"); }
       else m.set(k,x);
     }
     notReturned.length=0; notReturned.push(...m.values());}
    /* Amazon.in often refunds WITHOUT requiring a return: goodwill partial
       refunds, and returnless refunds on low-value items. Neither owes the
       seller anything, and both look exactly like a ghost. A refund well
       below the order's own principal, or a small full refund, is therefore
       demoted to review — listed, explained, never claimed. */
    for(const x of notReturned){
      let orderPrincipal=0;
      for(const o of (ordersById.get(x.orderId)||[])){
        if(x.sku&&o.sku&&o.sku!==x.sku) continue;
        orderPrincipal+=o.principal;
      }
      if(orderPrincipal>0.005&&x.amount<orderPrincipal*0.9){
        x.soft=true;
        x.note+=" — but this is a PARTIAL refund ("+Math.round(x.amount/orderPrincipal*100)+"% of the order), which Amazon often issues without asking for the item back; review before claiming";
      } else if(x.amount<300){
        x.soft=true;
        x.note+=" — low-value refunds are often issued returnless on Amazon.in; review before claiming";
      }
    }
    notReturned.sort((a,b)=>(b.amount||0)-(a.amount||0));
    /* Returns damaged in Amazon's hands. CUSTOMER_DAMAGED and DEFECTIVE are
       excluded on purpose — policy puts those on the buyer or the product,
       and flagging them would invite claims Amazon will refuse. */
    const refundBySku=new Map();
    for(const rec of records){
      if(!/refund/i.test(rec.transactionType)||rec.principal>=-0.005) continue;
      refundBySku.set(rec.orderId+"|"+(rec.sku||""),Math.abs(rec.principal));
    }
    /* Amazon reimburses damaged-in-its-hands stock on its own clock — often
       weeks after disposition — and inventory-side reimbursements frequently
       carry NO order id, only the SKU. So: give Amazon 30 days before
       calling a reimbursement missing (measured against the report's own
       coverage, the same proxy the ghosts use), and treat a reimbursement
       for the same SKU within 60 days of the return as settling it. A
       contaminated file set (nrSuspicious) suppresses this list entirely —
       the damage rows come from the same wrong-account report. */
    const reimbBySkuDate=[];
    for(const rr of reimbRows) if(rr.sku) reimbBySkuDate.push({sku:rr.sku,day:rr.date?recDayNo(rr.date):null});
    const skuReimbursedNear=(sku,retDay)=>reimbBySkuDate.some(e=>e.sku===sku&&
      (e.day===null||retDay===null||(e.day>=retDay-7&&e.day<=retDay+60)));
    if(!nrSuspicious) for(const r of fbaReturns){
      if(r.disposition!=="CARRIER_DAMAGED"&&r.disposition!=="DAMAGED") continue;
      if(reimbOrders.has(r.orderId)) continue;
      const retDay=r.date?recDayNo(r.date):null;
      if(r.sku&&skuReimbursedNear(r.sku,retDay)) continue;
      // 30-day processing lag, provable only inside the report's coverage
      if(coverDay===null||retDay===null||retDay+30>coverDay) continue;
      const val=refundBySku.get(r.orderId+"|"+(r.sku||""));
      fcDamaged.push({check:"fcDamaged",orderId:r.orderId,sku:r.sku,date:r.date,
        amount:val!==undefined?Math.round(val*100)/100:null,
        note:(r.disposition==="CARRIER_DAMAGED"?"Damaged by the carrier":"Damaged at the fulfilment centre")
          +(r.reason?" ("+r.reason.toLowerCase().replace(/_/g," ")+")":"")
          +" — 30+ days on, no reimbursement for this order or SKU"
          +(val===undefined?"; value not in the loaded statements":"")});
    }
  }
  /* ---- Seller-fulfilled Return Report × SAFE-T candidates ----
     A SAFE-T claim turns on facts the settlement cannot see: was a return
     even requested, did the item ever get recorded delivered back, is a
     claim already filed. When the report is loaded, every candidate is
     sorted into one of four honest classes instead of one big pile. */
  let safeTClaimed=0,safeTNotBack=0,safeTBack=0,safeTNoReq=0;
  if(mfnRet.length&&safeT.length){
    const byOrder2=new Map();
    for(const r of mfnRet){ const a=byOrder2.get(r.orderId)||[]; a.push(r); byOrder2.set(r.orderId,a); }
    const kept=[];
    for(const x of safeT){
      const reqs=byOrder2.get(x.orderId)||[];
      if(reqs.some(r=>r.safetId)){ safeTClaimed++; continue; }   // already claimed — off the list
      if(reqs.length===0){ safeTNoReq++; x.cls=2;
        x.note+=" — no return request exists for this refund at all; if it was a courier RTO or goodwill refund, SAFE-T for the item's value may apply";
      } else if(reqs.some(r=>r.deliveryDate)){ safeTBack++; x.cls=3;
        const d=reqs.find(r=>r.deliveryDate).deliveryDate;
        x.note+=" — the item WAS recorded delivered back on "+saFmtDay(d)+"; claim only if it came back damaged or incomplete";
      } else { safeTNotBack++; x.cls=1;
        const r0=reqs[0];
        x.note+=" — return "+(r0.resolution==="RefundAtFirstScan"?"was refunded at first courier scan":"approved "+(r0.requestDate?saFmtDay(r0.requestDate):""))+" but never recorded delivered back: the strongest SAFE-T case";
      }
      kept.push(x);
    }
    safeT.length=0; safeT.push(...kept);
    safeT.sort((a,b)=>(a.cls||9)-(b.cls||9)||(b.amount||0)-(a.amount||0));
  }
  /* ---- Lost in the warehouse (Inventory Ledger × Reimbursements) ----
     Reason M is Amazon misplacing a unit; F is finding one again. What stays
     lost after netting found units, was lost 30+ days ago (Amazon's own
     research window) inside the ledger's coverage, and has no INVENTORY-side
     reimbursement for the SKU, is money Amazon's policy owes. Order-level
     reimbursement reasons (CustomerReturn, CustomerServiceIssue) never
     offset a lost unit — they are a different mechanism entirely. Valued at
     the SKU's own average unit principal from the loaded statements. */
  const lostWh=[]; let destroyedSellable=0, ledgerCoverEnd=null, ledgerAdjustments=0;
  if(ledger&&ledger.adjustments){
    ledgerCoverEnd=ledger.coverEnd; ledgerAdjustments=ledger.adjustments.length;
    const coverDay2=ledgerCoverEnd?recDayNo(ledgerCoverEnd):null;
    const invReimbQty=new Map();   // sku -> units reimbursed inventory-side
    for(const rr of reimbRows){
      if(rr.orderId) continue;     // order-level reimbursements don't offset stock
      if(rr.sku) invReimbQty.set(rr.sku,(invReimbQty.get(rr.sku)||0)+1);
    }
    // average unit principal per sku, for valuing a lost unit honestly
    const unitVal=new Map();
    {const agg=new Map();
     for(const rec of records){
       if(rec.transactionType!=="Order"||!rec.sku||rec.principal<=0||!(rec.quantity>0)) continue;
       const e=agg.get(rec.sku)||{v:0,q:0}; e.v+=rec.principal; e.q+=rec.quantity; agg.set(rec.sku,e);
     }
     for(const [k,e] of agg) if(e.q>0) unitVal.set(k,e.v/e.q);}
    const bySku=new Map();
    for(const a of ledger.adjustments){
      if(a.reason!=="M"&&a.reason!=="F"&&a.reason!=="D") continue;
      if(a.reason==="D"){ if(a.qty<0&&a.disposition==="SELLABLE") destroyedSellable+=-a.qty; continue; }
      const e=bySku.get(a.sku)||{lost:[],found:0};
      if(a.reason==="M"&&a.qty<0) e.lost.push({date:a.date,qty:-a.qty});
      if(a.reason==="F"&&a.qty>0) e.found+=a.qty;
      bySku.set(a.sku,e);
    }
    for(const [sku,e] of bySku){
      e.lost.sort((x,y)=>String(x.date).localeCompare(String(y.date)));
      let offset=e.found+(invReimbQty.get(sku)||0);
      for(const L of e.lost){
        const take=Math.min(offset,L.qty); offset-=take; const rem=L.qty-take;
        if(rem<=0) continue;
        const d=L.date?recDayNo(L.date):null;
        if(coverDay2===null||d===null||d+30>coverDay2) continue;  // research window still open
        const v=unitVal.get(sku);
        lostWh.push({check:"lostWh",orderId:"",sku,date:L.date,
          amount:v!==undefined?Math.round(v*rem*100)/100:null,
          note:rem+" unit"+(rem>1?"s":"")+" misplaced in the fulfilment centre "
            +(d!==null?Math.floor((recDayNo(ledgerCoverEnd)-d)):"30+")+" days ago — never found, never reimbursed"
            +(v===undefined?"; value unknown (SKU has no sales in the loaded statements)":"")});
      }
    }
    lostWh.sort((a,b)=>(b.amount||0)-(a.amount||0));
  }
  /* "Claimable" is only what the files prove Amazon owes. SAFE-T rows are
     candidates to review — most seller-fulfilled refunds are ordinary returns
     — so they are counted separately and never inflate the headline. */
  const hardGhosts=nrSuspicious?[]:notReturned.filter(x=>!x.soft);
  const softGhosts=nrSuspicious?[]:notReturned.filter(x=>x.soft);
  const recovery=[...refundFee,...feeOver,...feeDup,...weightJump,...hardGhosts].reduce((s,x)=>s+(x.amount||0),0);
  /* fcDamaged values are review, not claimable: the return report proves the
     damage happened in Amazon's hands, but only Amazon's answer proves the
     money — its reimbursement clock is not fully knowable from outside. */
  const review=[...safeT,...softGhosts,...fcDamaged,...lostWh].reduce((s,x)=>s+(x.amount||0),0);
  const unpaid=shipped.reduce((s,x)=>s+(x.amount||0),0);
  return {issues:{notReturned,fcDamaged,lostWh,feeOver,feeDup,weightJump,refundFee,safeT,shipped,negative},
    ordersChecked:ordersById.size,refundsChecked,
    recovery:Math.round(recovery*100)/100,
    review:Math.round(review*100)/100,
    unpaid:Math.round(unpaid*100)/100,
    notes:{feesItemised,feeLinesPresent,ordersWithFee,refundsNoOriginal,refundsNoFee,negativeNoRevenue,feeLinesAudited,weightLinesAudited,
      skippedCancelled,skippedRecent,gaps,covEnd,cutoff,mtrOrders,manyUnmatched,
      haveReturns:fbaReturns.length>0,haveReimb:reimbRows.length>0,
      returnRows:fbaReturns.length,reimbRows:reimbRows.length,retCoverEnd,nrTooRecent,nrSuspicious,
      haveLedger:!!ledger,ledgerCoverEnd,ledgerAdjustments,destroyedSellable,haveRepl:replRows.length>0,replRows:replRows.length,
      haveMfnRet:mfnRet.length>0,mfnRetRows:mfnRet.length,safeTClaimed,safeTNotBack,safeTBack,safeTNoReq}};
}

function recBody(){
  app.innerHTML=`
    <div class="wrap page">
      <h2>Reconciliation &amp; SAFE-T Finder</h2>
      <p class="lede">Upload your settlement reports — and the matching MTR if you have it — to check for fee discrepancies, seller-fulfilled refunds that may need SAFE-T review, and payments that may need reconciliation. Confirmed discrepancies are kept separate from cases that need more evidence.</p>
      ${helpHtml("reconcile")}
      <label class="sa-drop" id="rec-drop">

        <input type="file" id="rec-file" multiple accept=".csv,.txt,.xlsx,text/plain,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      </label>
      <div class="sa-priv">🔒 Private by design — your files never leave your device. All cross-checking happens locally on this page.</div>
      <div id="rec-out"></div>
    </div>`;
  const drop=document.getElementById("rec-drop"),file=document.getElementById("rec-file");
  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over");}));

function recAddFiles(list){
  const files=[...(list||[])]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    const finish=()=>{ if(--pending===0) recRenderResults(); };
    saReadDropped(f,text=>{
      recFiles=recFiles.filter(x=>x.name!==f.name); // re-drop replaces
      const mr=parseMfnReturns(text);
      if(mr){ recFiles.push({name:f.name,kind:"mfnret",rows:mr.rows}); finish(); return; }
      const led=parseInventoryLedger(text);
      if(led&&led.adjustments){ recFiles.push({name:f.name,kind:"ledger",ledger:led}); finish(); return; }
      const rp=parseReplacements(text);
      if(rp){ recFiles.push({name:f.name,kind:"repl",rows:rp.rows}); finish(); return; }
      const ret=parseFbaReturns(text);
      if(ret){ recFiles.push({name:f.name,kind:"returns",rows:ret.rows}); finish(); return; }
      const rb=parseReimbursements(text);
      if(rb){ recFiles.push({name:f.name,kind:"reimb",rows:rb.rows}); finish(); return; }
      const mtr=parseMtr(text);
      const ut=mtr?null:parseUnifiedTransaction(text);
      if(!mtr&&!ut&&saLooksExcel(text,f.name)){ recFiles.push({name:f.name,kind:"error",msg:SA_EXCEL_MSG}); }
      else if(mtr){ recFiles.push({name:f.name,kind:"mtr",rows:mtr.rows,errors:mtr.errors}); }
      else if(ut){ recFiles.push({name:f.name,kind:"settlement",parsed:ut}); }
      else{
        const p=parseSettlement(text);
        if(p.records.length||p.summary){
          const dup=p.summary&&recFiles.some(x=>x.kind==="settlement"&&x.parsed.summary&&x.parsed.summary.settlementId===p.summary.settlementId);
          if(dup) recFiles.push({name:f.name,kind:"error",msg:"same settlement ID as a file already loaded — skipped to avoid double counting"});
          else recFiles.push({name:f.name,kind:"settlement",parsed:p});
        }
        else recFiles.push({name:f.name,kind:"error",msg:"not recognised as a settlement flat file or MTR."+saDescribeColumns(text)});
      }
      finish();
    },msg=>{ recFiles=recFiles.filter(x=>x.name!==f.name); recFiles.push({name:f.name,kind:"error",msg}); finish(); });
  });
}
function recRenderResults(){
  const out=document.getElementById("rec-out"); if(!out) return;
  const kindLabel={settlement:"Settlement",mtr:"MTR",returns:"FBA returns",reimb:"Reimbursements",ledger:"Inventory Ledger",repl:"Replacements",mfnret:"Seller returns",error:"Wrong report"};
  const kindOf=f=>f.kind==="error"?"⚠ "+kindLabel.error
    :f.kind==="settlement"&&f.parsed&&f.parsed.source==="unified"?"Unified txn":kindLabel[f.kind];
  let h=`<div class="rec-files">${recFiles.map((f,i)=>`<span class="rec-file"${f.kind==="error"?` title="${esc(f.msg)}"`:""}><b>${esc(f.name)}</b><span class="rf-kind">${kindOf(f)}</span><button type="button" data-rm="${i}" aria-label="Remove ${esc(f.name)}">✕</button></span>`).join("")}</div>`;
  const bad=recFiles.filter(f=>f.kind==="error");
  if(bad.length) h+=`<div class="banner warn">${bad.map(f=>`<b>${esc(f.name)}</b>: ${esc(f.msg)}`).join("<br>")}</div>`;
  const settlements=recFiles.filter(f=>f.kind==="settlement").map(f=>f.parsed);
  const mtrRows=recFiles.filter(f=>f.kind==="mtr").flatMap(f=>f.rows);
  if(!settlements.length){
    if(recFiles.length) h+=`<div class="banner info">Add at least one <b>settlement flat file</b> (Payments → All Statements → Download Flat File V2) — that's the file the checks run against.</div>`;
    out.innerHTML=h; recWire(out); return;
  }
  const fbaReturns=recFiles.filter(f=>f.kind==="returns").flatMap(f=>f.rows);
  const reimbRows=recFiles.filter(f=>f.kind==="reimb").flatMap(f=>f.rows);
  const ledgerFile=recFiles.find(f=>f.kind==="ledger");
  const replacements=recFiles.filter(f=>f.kind==="repl").flatMap(f=>f.rows);
  const mfnReturns=recFiles.filter(f=>f.kind==="mfnret").flatMap(f=>f.rows);
  const res=recCompute(settlements,mtrRows,{returns:fbaReturns,reimb:reimbRows,
    ledger:ledgerFile?ledgerFile.ledger:null,replacements,mfnReturns});
  const done=loadRecDone();
  const allIssues=REC_ORDER.flatMap(k=>res.issues[k]);
  const openCount=allIssues.filter(x=>!done[recKey(x)]).length;
  const n=res.notes||{};
  /* Six counters, two of them generic ("issues", "to action"), turned a set of
     unproven and mostly time-expired candidates into a to-do list. On a file
     where nothing is provably owed, the screen still read as four red issues
     with four Claim buttons. Confidence now leads: what is proven, what merely
     needs a look, and what could not be checked. */
  const safeTRows=res.issues.safeT||[];
  const expired=safeTRows.filter(x=>x.days!==null&&x.days>60).length;
  const live=safeTRows.length-expired;
  h+=`<div class="stats">
    <div class="stat ${res.recovery>0.005?"green":""}"><div class="k">Confirmed claimable</div><div class="v">${inr(res.recovery)}</div>
      <div class="sa-sub" style="margin-top:3px">${res.recovery>0.005?"proven by these files":"nothing in these files proves Amazon owes you a fee credit"}</div></div>
    <div class="stat"><div class="k">Refund cases to assess</div><div class="v">${safeTRows.length}${safeTRows.length?" · "+inr(res.review):""}</div>
      <div class="sa-sub" style="margin-top:3px">${safeTRows.length?(live?`${live} inside the filing window · ${expired} window appears closed`:"filing window appears closed on all of them"):"none found"}</div></div>
    <div class="stat"><div class="k">Checked</div><div class="v">${res.ordersChecked} orders · ${res.refundsChecked} refunds</div>
      <div class="sa-sub" style="margin-top:3px">${res.unpaid>0.005?inr(res.unpaid)+" shipped but not yet paid":"across the statements you loaded"}</div></div>
  </div>
  <div class="act ${res.recovery>0.005?"hot":""}" style="margin-top:12px">
    <h5>${res.recovery>0.005?`Potential reimbursement to review: ${inr(res.recovery)}`:"No confirmed reimbursement found"}</h5>
    <p>${res.recovery>0.005
      ?`These files show fees Amazon charged and did not credit back. Amazon still decides each claim — check the evidence on each row before filing.`
      :`The loaded reports do <b>not</b> prove Amazon currently owes you a fee reimbursement. ${safeTRows.length?`${safeTRows.length} seller-fulfilled refund${safeTRows.length===1?"":"s"} need contextual review below, but ${safeTRows.length===1?"it is":"they are"} <b>not</b> included in the ${inr(res.recovery)} confirmed amount.`:""} A clean audit is a result, not an empty screen.`}</p>
  </div>`;
  if(n.manyUnmatched)
    h+=`<div class="banner warn">${res.issues.shipped.length} of ${n.mtrOrders} shipped orders have no payment line — that is a lot, and the usual cause is missing statements rather than missing money. <b>Payments → All Statements keeps a separate weekly series for each Account Type</b> — <i>Electronic Transactions</i> and <i>Cash On Delivery Transactions and Non-Transactional Fees</i>. Switch the Account Type dropdown and download both series for the period, then drop them here too.</div>`;
  if(!n.feesItemised&&res.ordersChecked)
    h+=`<div class="banner warn">These statements don't itemise the referral fee per order — only ${n.ordersWithFee||0} of ${res.ordersChecked} orders carry one, so Amazon is billing it elsewhere (usually the monthly fee invoice under <b>Tax Document Library → Seller Fee Invoices</b>). The <b>refunds missing their referral-fee credit</b> check is switched off: the data to run it isn't here. ${n.feeLinesPresent?"Loss-making orders are still checked, but only against the fees that <i>do</i> appear here — anything on the separate invoice isn't counted, so a thin order can look profitable.":"<b>Orders that netted negative</b> is switched off too — there are no selling-fee lines at all to net against."}</div>`;
  else if(n.refundsNoOriginal||n.refundsNoFee){
    const bits=[];
    if(n.refundsNoOriginal) bits.push(`${n.refundsNoOriginal} refund${n.refundsNoOriginal>1?"s":""} whose original order isn't in the loaded files — load the statement that paid it to check ${n.refundsNoOriginal>1?"them":"it"}`);
    if(n.refundsNoFee) bits.push(`${n.refundsNoFee} where the original order was never charged a referral fee, so there is nothing to credit back`);
    h+=`<div class="banner info">Not flagged: ${bits.join("; ")}.</div>`;
  }
  if(n.gaps&&n.gaps.length)
    h+=`<div class="banner warn">Your statements have a gap — nothing loaded for ${n.gaps.map(g=>`<b>${esc(saFmtDay(g.from))} → ${esc(saFmtDay(g.to))}</b>`).join(", ")}. Orders paid in the missing statement${n.gaps.length>1?"s":""} will look unpaid below. Load ${n.gaps.length>1?"those statements":"that statement"} before chasing anything in the shipped-but-not-paid list.</div>`;
  if(n.skippedCancelled||n.skippedRecent){
    const bits=[];
    if(n.skippedCancelled) bits.push(`${n.skippedCancelled} shipment line${n.skippedCancelled>1?"s":""} the MTR itself cancels or refunds`);
    if(n.skippedRecent) bits.push(`${n.skippedRecent} shipped after ${esc(saFmtDay(n.cutoff))}, too recent to have reached a statement`);
    h+=`<div class="banner info">Left out of the unpaid list: ${bits.join("; ")}.</div>`;
  }
  /* A clean audit is a result too. Without this the checks are invisible on a
     well-billed account and the seller has no way to know they ran. */
  if(n.feeLinesAudited||n.weightLinesAudited){
    const found=res.issues.feeOver.length+res.issues.feeDup.length+res.issues.weightJump.length;
    const bits=[];
    if(n.feeLinesAudited) bits.push(`<b>${n.feeLinesAudited.toLocaleString("en-IN")}</b> closing fees against Amazon's published rate card`);
    if(n.weightLinesAudited) bits.push(`<b>${n.weightLinesAudited.toLocaleString("en-IN")}</b> weight-handling charges against each SKU's usual band`);
    h+=`<div class="banner ${found?"warn":"good"}">${found?"⚠️":"✅"} <b>Fee audit:</b> checked ${bits.join(" and ")}. ${
      found?`<b>${found}</b> charge${found>1?"s look":" looks"} wrong — listed below. Amazon requires fee claims within <b>30 days of the order</b>, so start with the newest.`
           :`Every one was charged correctly — nothing to claim. Claim deadlines vary by fee type, so check the applicable Amazon policy if you ever do find a mismatch.`}</div>`;
  }
  if(n.negativeNoRevenue)
    h+=`<div class="banner info">${n.negativeNoRevenue} order${n.negativeNoRevenue>1?"s carry":" carries"} fulfilment fees here but no sale — the revenue is in a statement you haven't loaded, so ${n.negativeNoRevenue>1?"they were":"it was"} left out of the loss-making check rather than counted as a loss.</div>`;
  if(n.haveMfnRet)
    h+=`<div class="banner info">Seller-fulfilled Return Report loaded (${num(n.mfnRetRows)} request${n.mfnRetRows===1?"":"s"}) — the SAFE-T list is now sorted by strength: <b>${num(n.safeTNotBack)}</b> refund${n.safeTNotBack===1?"":"s"} where the item was <b>never recorded delivered back</b> (the strongest case), ${num(n.safeTNoReq)} with no return request at all, ${num(n.safeTBack)} where the item did come back (claim only if damaged)${n.safeTClaimed?`, and ${num(n.safeTClaimed)} already claimed via SAFE-T — removed from the list`:""}.</div>`;
  if(n.haveLedger)
    h+=`<div class="banner info">Inventory Ledger loaded (${num(n.ledgerAdjustments)} adjustment${n.ledgerAdjustments===1?"":"s"}, coverage to ${n.ledgerCoverEnd?esc(saFmtDay(n.ledgerCoverEnd)):"—"}) — misplaced stock is netted against found stock and inventory-side reimbursements${n.haveReimb?"":", <b>but no Reimbursements report is loaded</b>, so a reimbursed loss cannot be told from an unpaid one — add it for an honest answer"}. ${n.destroyedSellable?`<b>${n.destroyedSellable} sellable unit${n.destroyedSellable>1?"s were":" was"} removed as damaged</b> — worth a look in the ledger.`:""}</div>`;
  if(n.haveRepl)
    h+=`<div class="banner info">Replacements report loaded (${num(n.replRows)} row${n.replRows===1?"":"s"}) — orders that were replaced, and returns arriving under a replacement order id, no longer count as ghost refunds.</div>`;
  if(n.haveReturns&&n.haveReimb&&!n.retCoverEnd)
    h+=`<div class="banner warn">The returns report's dates could not be read (an .xlsx export stores them as serial numbers), so the returned-item checks cannot judge anything. Re-export the FBA customer returns report as <b>.csv</b> and drop it again.</div>`;
  if(n.nrSuspicious)
    h+=`<div class="banner warn"><b>${res.issues.notReturned.length} refunds look "never returned" — that is too many to be real.</b> Across real accounts Amazon's automation misses under 1%; a share this size almost always means these settlement files and the returns/reimbursements reports are <b>not from the same seller account</b> (statements from several accounts in one folder is the usual cause — the returns report only ever covers one account). The list is shown below for checking but <b>excluded from Claimable</b>. Load one account's files at a time.</div>`;
  if(n.haveReturns&&n.haveReimb)
    h+=`<div class="banner info">FBA returns (${num(n.returnRows)} rows) and Reimbursements (${num(n.reimbRows)} rows) loaded — the <b>refunded-never-returned</b> and <b>damaged-in-Amazon's-hands</b> checks ran against every FBA refund.${n.nrTooRecent?` <b>${n.nrTooRecent} refund${n.nrTooRecent>1?"s":""}</b> could not be judged: the returns report's newest row is ${esc(saFmtDay(n.retCoverEnd))}, and their 45-day return window runs past it — re-export both reports <b>through today</b> and they can be.`:""}</div>`;
  else if(n.haveReturns||n.haveReimb)
    h+=`<div class="banner warn">Only ${n.haveReturns?"the FBA returns report":"the Reimbursements report"} is loaded — the returns checks need <b>both</b>, or a missing reimbursement can't be told from an unloaded one. Add ${n.haveReturns?"<b>Payments → Reimbursements</b>":"<b>Fulfilment → FBA customer returns</b>"} (Reports → Fulfilment, Download tab, same date range as your statements).</div>`;
  else
    h+=`<div class="banner info">Two more checks are available: drop the <b>FBA customer returns</b> and <b>Reimbursements</b> reports (Reports → Fulfilment → Download, exact dates matching your statements) and every FBA refund is checked for <b>never returned, never reimbursed</b> — the money Amazon's own 45-day policy owes you.</div>`;
  if(!mtrRows.length)
    h+=`<div class="banner info">No MTR loaded — the <b>shipped-but-not-paid</b> check needs one. Get it from <b>Reports → Tax Document Library → Merchant Tax Reports → B2C</b> and drop it here too.</div>`;
  if(!allIssues.length)
    h+=`<div class="banner good">✅ <b>No confirmed money to claim from these reports.</b> ${n.feesItemised?"Every refund credited its referral fee back, and no order netted negative":"No potential SAFE-T cases were found"}${mtrRows.length?", and every MTR shipment has a matching payment line":""}. That is a clean audit, not a missing result.</div>`;
  else
    h+=`<div style="display:flex;justify-content:flex-end;gap:8px;margin:14px 0 2px"><button type="button" class="fbtn" id="rec-csv">⬇ Export checklist CSV</button><button type="button" class="fbtn" id="rec-pdf">📄 Print / Save PDF</button><button type="button" class="fbtn" id="rec-share">📤 Share PDF</button></div>`;
  for(const k of REC_ORDER){
    const rows=res.issues[k]; if(!rows.length) continue;
    const c=REC_CHECKS[k];
    const shutN=rows.filter(x=>x.days!==null&&x.days!==undefined&&x.days>60).length;
    h+=`<div class="panel"><h4>${c.icon} ${esc(c.title)} <span class="sa-sub">(${rows.length}${shutN?` · ${shutN} filing window appears closed`:""})</span></h4>
      <p class="sa-sub" style="margin:4px 0 10px">${esc(c.why)}</p>
      <div class="tblwrap"><table class="sa">
        <thead><tr><th style="width:36px">Done</th><th>Order</th><th>SKU</th><th>Date</th><th class="num">${esc(c.amt||"Amount")}</th><th>Note</th><th style="width:86px"></th></tr></thead>
        <tbody>${rows.map(x=>{const key=recKey(x),dn=!!done[key];const ct=recClaimText(x);
          /* A row whose filing window has passed must not carry a button that
             looks like a working claim path — that is the nudge that sends a
             seller to Amazon with a case Amazon will reject. */
          const shut=x.days!==null&&x.days!==undefined&&x.days>60;
          return `<tr class="${dn?"rec-done":""}"${shut?' style="opacity:.62"':""}>
            <td><input type="checkbox" data-done="${esc(key)}"${dn?" checked":""} aria-label="Mark ${esc(x.orderId||"row")} done"></td>
            <td>${esc(x.orderId||"—")}</td><td>${esc(x.sku||"—")}</td>
            <td>${esc(x.date||"—")}</td>
            <td class="num">${x.amount===null?"—":inr(x.amount)}</td>
            <td class="sa-sub">${esc(x.note||"")}</td>
            <td>${shut?`<span class="chip" title="Based on the SAFE-T filing policy configured for this refund date: 60 days">Window likely closed</span>`
              :ct?`<button type="button" class="fbtn rec-copy" data-claim="${esc(ct)}" title="Copy the evidence for this order, then review it in Seller Central before filing">Review &amp; prepare →</button>`:""}</td></tr>`;}).join("")}
        </tbody></table></div>
      ${shutN===rows.length&&c.shutClaim?`<div class="rec-claim">${c.shutClaim}</div>`
        :`<div class="rec-claim"><b>How to claim:</b> ${c.claim}</div>`}</div>`;
  }
  h+=`<div class="banner info">These are pointers computed from your files, not guarantees — Amazon decides each claim. Payments for recent shipments often arrive in the <b>next</b> settlement, so load consecutive statements before chasing anything. Ticks are saved only in your browser.</div>`;
  out.innerHTML=h; recWire(out,settlements,mtrRows,res);
}
const recKey=x=>x.check+"|"+(x.orderId||"")+"|"+(x.sku||"")+"|"+(x.date||"");
/* Ready-to-paste claim text per item. Amazon support reads English; the
   text quotes only facts the files proved — order, amount, dates, and the
   evidence class — and never promises what Amazon will decide. */
function recClaimText(x){
  const amt=x.amount!=null?"Rs. "+Math.abs(x.amount).toFixed(2):"the refunded amount";
  const oid=x.orderId||"(order id)";
  const dt=x.date?(" dated "+x.date):"";
  switch(x.check){
    case "safeT":
      if(x.cls===3) return null; // item came back — only claimable if damaged, which the files cannot prove
      if(x.cls===2) return `SAFE-T claim — Order ${oid}. A refund of ${amt}${dt} was issued on this seller-fulfilled order, but my Return Report for the covering period contains NO return request for this order. As the refund was issued without a buyer return request, I request reimbursement of the item value under the SAFE-T policy. Supporting data: settlement refund line for this order, and the seller-fulfilled Return Report for the same period showing no request.`;
      return `SAFE-T claim — Order ${oid}. A refund of ${amt}${dt} was issued on this seller-fulfilled order. My Return Report shows the return ${x.note&&/first.*scan/i.test(x.note)?"was refunded at first carrier scan":"was approved"}, but the item was NEVER recorded as delivered back to me — there is no return delivery date against this order to date. I request reimbursement of the item value under SAFE-T. Supporting data: settlement refund line, and the Return Report row for this order with an empty return-delivery date.`;
    case "notReturned":
      return `Reimbursement request — Order ${oid}${x.sku?" (SKU "+x.sku+")":""}. This FBA order was refunded ${amt}${dt}, and the FBA Customer Returns report contains no return of this unit in the 45 days following the refund, nor does the Reimbursements report show any reimbursement for it. Per FBA policy, when a refunded unit is not returned within 45 days the seller is to be reimbursed. Please review and reimburse. Supporting data: settlement refund line, FBA Customer Returns report and Reimbursements report covering the window.`;
    case "refundFee":
      return `Fee credit request — Order ${oid}. On the original order a referral fee was charged, but the refund${dt} credited none of it back. Referral fee is normally credited (less the administration portion) when an order is refunded. Please compare the refund's fee lines with the original order and credit the referral fee due. Amount involved: ${amt}.`;
    case "feeOver":
      return `Fee correction request — Order ${oid}${x.sku?" (SKU "+x.sku+")":""}. The weight-handling fee charged on this order${dt} corresponds to a heavier weight band than this product's actual packed weight. Please re-check the charged band against the product's verified weight and dimensions and refund the difference. Amount involved: ${amt}.`;
    case "feeDup":
      return `Duplicate fee charge — Order ${oid}. An identical fee line appears twice against the same order item${dt}. This is a single-unit order, so the second charge appears to be a duplicate. Please review and refund the duplicate. Amount: ${amt}.`;
    case "shipped":
      return `Missing payment enquiry — Order ${oid}${x.sku?" (SKU "+x.sku+")":""}. This order was shipped${dt} per my Merchant Tax Report, but no Order payment line for it appears in any settlement covering the period. Please confirm which settlement paid this order, or investigate the missing payment.`;
    default: return null;
  }
}
window.recClaimText=recClaimText; // exposed for verification/debugging
function recWire(out,settlements,mtrRows,res){
  out.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{
    recFiles.splice(Number(b.dataset.rm),1); recRenderResults();
  }));
  out.querySelectorAll(".rec-copy").forEach(b=>b.addEventListener("click",async()=>{
    const txt=b.dataset.claim; let ok=false;
    try{ await navigator.clipboard.writeText(txt); ok=true; }
    catch(e){ /* clipboard blocked — fall back to a selectable prompt */
      try{ window.prompt("Copy the claim text:",txt); ok=true; }catch(e2){} }
    if(ok){ const old=b.textContent; b.textContent="✓ Copied"; setTimeout(()=>{b.textContent=old;},1600); }
  }));
  out.querySelectorAll("[data-done]").forEach(cb=>cb.addEventListener("change",()=>{
    const d=loadRecDone();
    if(cb.checked)d[cb.dataset.done]=1; else delete d[cb.dataset.done];
    saveRecDone(d); recRenderResults();
  }));
  const pdf=out.querySelector("#rec-pdf");
  if(pdf) pdf.addEventListener("click",()=>saClientPdf("Reconciliation & SAFE-T — findings",document.getElementById("rec-out")));
  const shareRec=document.getElementById("rec-share");
  if(shareRec) shareRec.addEventListener("click",()=>saSharePdf("Reconciliation & SAFE-T — findings",document.getElementById("rec-out"),shareRec));
  const csv=out.querySelector("#rec-csv");
  if(csv&&res) csv.addEventListener("click",()=>{
    const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const done=loadRecDone();
    const lines=[["Issue","Order ID","SKU","Date","Amount (INR)","Status","What to do"].map(q).join(",")];
    for(const k of REC_ORDER) for(const x of res.issues[k])
      lines.push([REC_CHECKS[k].title,x.orderId||"",x.sku||"",x.date||"",
        x.amount===null?"":x.amount.toFixed(2),done[recKey(x)]?"Done":"To do",
        REC_CHECKS[k].claim.replace(/<[^>]+>/g,"")].map(q).join(","));
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([lines.join("\r\n")],{type:"text/csv"}));
    a.download="reconciliation-checklist.csv";
    document.body.appendChild(a); a.click(); a.remove();
  });
}

/* ============================================================
   FEE BAND OPTIMIZER (Pro)
   Amazon prices two of its three big fees in STEPS rather than
   slopes: the referral fee changes at fixed price points, weight
   handling at fixed weight points. A listing a rupee over a price
   step, or a gram over a weight step, pays the whole step for
   nothing. Both are readable straight off a settlement — the fee
   Amazon charged identifies the band it billed in — so every
   figure here comes from what this SKU was actually charged, not
   from anything typed in. Reconciliation finds money to claim
   back; this finds money not to spend again.
   ============================================================ */
let fbFiles=[];
/* Every price at which some category's referral rate changes, plus the three
   closing-fee steps: the only prices at which a cut can pay for itself. */
const FB_EDGES=(()=>{
  const s=new Set(CLOSING_BANDS.filter(x=>x!==null));
  for(const c of CATS) for(const e of refBandEdges(c.key)) s.add(e);
  return [...s].sort((a,b)=>a-b);
})();
/* Amazon's published closing-fee columns. What a SKU was charged identifies
   its column, so the fee one band lower is read off that same column instead
   of guessed from a category the settlement never names. */
const FB_CLOSING_COLS=[{id:"easyship",afn:false,t:CLOSING_BY_CHANNEL.easyship},
  {id:"self",afn:false,t:CLOSING_BY_CHANNEL.self}]
  .concat(Object.keys(CLOSING_FBA_GROUPS).map(g=>({id:"fba-"+g,afn:true,t:CLOSING_FBA_GROUPS[g]})));
const fbClosingBand=p=>p<=300?0:p<=500?1:p<=1000?2:3;
const FB_SLAB_KG=[0.5,1,2];   // the three published weight-handling bands
const FB_MIN_UNITS=4;         // fewer units than this and "usual price" means nothing
const FB_MIN_SHIP=4;          // same for a SKU's usual weight band
const FB_MIN_NET=1;           // rupees per unit — below this it is noise, not a saving
const FB_RATE_TOL=0.004;      // 0.4pp, to absorb rounding in Amazon's own fee lines
const FB_RECENT_DAYS=30;      // the tail of the coverage that counts as "now"
const FB_PROVEN_MIN=3;        // shipments in a lighter band before it counts as done
const FB_PROVEN_SHARE=0.1;    // …and that many as a share of the SKU's shipments
/* How much weight a repack can plausibly take off. Amazon's own allowance for
   packaging is 100 g, so anything beyond that is the product, not the box. */
const FB_TRIM_G=100;
/* And how close to the band edge above is close enough to be worth warning
   about: heavier tape, a thicker box or a bubble-wrap change can add this
   much without anyone noticing, and the next band is never a small step. */
const FB_EDGE_G=150;
const FB_WEIGHTS_KEY="fb_weights";
function loadFbWeights(){try{return JSON.parse(localStorage.getItem(FB_WEIGHTS_KEY)||"{}")||{};}catch(e){return {};}}
function saveFbWeights(w){try{localStorage.setItem(FB_WEIGHTS_KEY,JSON.stringify(w));}catch(e){}}
/* Weighted mode: the value carrying the most units, ties going to the lower
   one so a coin-flip never flatters the saving. */
function fbMode(list){
  const m=new Map(); let tot=0;
  for(const x of list){ m.set(x.v,(m.get(x.v)||0)+x.w); tot+=x.w; }
  let v=null,best=-1;
  for(const [k,w] of m) if(w>best||(w===best&&k<v)){best=w;v=k;}
  return {v,share:tot?best/tot:0,units:best,total:tot};
}
function fbCompute(settlements,weights){
  weights=weights||{};
  const records=[]; for(const p of settlements) records.push(...p.records);
  /* Easy Ship, postage and base fees are billed against the ORDER on rows
     carrying no SKU — same rule as the SKU report: attribute them back only
     when the order held a single SKU, because a mixed order has no honest
     split. */
  const skuOfOrder=new Map();
  for(const rec of records){
    if(!rec.orderId||!rec.sku) continue;
    const cur=skuOfOrder.get(rec.orderId);
    if(cur===undefined) skuOfOrder.set(rec.orderId,rec.sku);
    else if(cur!==rec.sku) skuOfOrder.set(rec.orderId,null);
  }
  const bySku=new Map();
  const get=sku=>{let s=bySku.get(sku);
    if(!s){s={sku,units:0,orders:0,principal:0,tax:0,price:[],wt:[]};bySku.set(sku,s);}return s;};
  let priceLines=0,wtLines=0,wtUnknown=0;
  for(const rec of records){
    if(rec.transactionType!=="Order") continue;
    const sku=rec.sku||(rec.orderId?skuOfOrder.get(rec.orderId):null); if(!sku) continue;
    const afn=rec.fulfillmentId==="AFN";
    const units=Math.max(1,rec.quantity||0);
    let buyerPaid=0,principal=0,tax=0,closing=0,referral=0,wtFee=0;
    for(const l of rec.amounts){
      const lab=(l.amountDescription||"").trim();
      /* Fee bands are on what the BUYER paid — principal plus shipping, gift
         wrap and the GST inside the price, less the promotions you funded.
         That is the basis the closing-fee audit was proved against on real
         accounts; excluding tax puts items near a step in the wrong band. */
      if(/^(principal|shipping|gift ?wrap)$/i.test(lab)) buyerPaid+=l.amount;
      else if(/^(product tax|shipping tax|gift ?wrap tax)$/i.test(lab)) buyerPaid+=l.amount;
      else if(/^(promo rebates|shipping (discount|promo discount)|gift ?wrap discount|product tax discount|shipping tax discount)$/i.test(lab)) buyerPaid+=l.amount;
      if(/^principal$/i.test(lab)) principal+=l.amount;
      if(/^product tax$/i.test(lab)) tax+=l.amount;
      if(/^fixed closing fee$/i.test(lab)) closing+=l.amount;
      /* "Commission IGST" is the 18% GST ON the commission, not commission —
         counting it read a 12.5% referral as 14.75% and matched the SKU to
         the wrong category. It is also money you claim back as input tax
         credit, so it was never part of the saving either. */
      if(/^(commission|referral fee)/i.test(lab)&&!/\b[ICS]GST\b/i.test(lab)) referral+=l.amount;
      if(/^(fba weight handling fee|amazon easy ship charges|easy ship weight handling fees)$/i.test(lab)) wtFee+=l.amount;
    }
    const s=get(sku); s.orders++; s.units+=units;
    if(principal>0){s.principal+=principal;s.tax+=tax;}
    /* Keep sales that carry no fee line at all: they are how a fee-invoiced
       account is recognised, and dropping them here would leave those SKUs
       looking like they simply never sold. */
    if(buyerPaid>0){
      priceLines++;
      s.price.push({p:buyerPaid/units,ref:Math.abs(referral)/units,close:Math.abs(closing)/units,
        units,afn,closeSeen:closing<-0.005,d:saParseDate(rec.postedDate)});
    }
    if(wtFee<-0.005){
      const per=Math.abs(wtFee)/units,hit=REC_SLAB_OF.get(Math.round(per*100));
      if(hit){wtLines++;s.wt.push({slab:hit.slab,family:hit.family,per,units});}
      else wtUnknown++;   // above 2 kg the ladder is additive, so no band to read
    }
  }
  /* What period do these statements cover? Everything below is "over the
     loaded period", and the price a SKU sells at NOW is read from the tail of
     it — a listing repriced last month must not be advised on last month's
     price. */
  let from=null,to=null;
  for(const p of settlements){
    if(!p.summary) continue;
    const a=saParseDate(p.summary.settlementStartDate),b=saParseDate(p.summary.settlementEndDate);
    if(a&&(!from||a<from)) from=a;
    if(b&&(!to||b>to)) to=b;
  }
  const days=(from&&to)?(recDayNo(to)-recDayNo(from)+1):0;
  const recentFrom=to?recShiftDays(to,-FB_RECENT_DAYS):null;
  const price=[],weight=[]; let variedPrice=0,unknownRate=0,noFees=0,underBilled=0;
  for(const s of bySku.values()){
    // GST inside this SKU's own price: a price cut hands back the tax too,
    // and that part was never the seller's money to lose.
    const g=s.principal>0?Math.max(0,s.tax/s.principal):0;
    if(s.price.length){
      const totU=s.price.reduce((a,x)=>a+x.units,0);
      /* Today's price, not the period's: take the mode over the closing weeks
         and only fall back to the whole period when the tail is too thin to
         say anything. */
      const recent=recentFrom?s.price.filter(x=>x.d&&x.d>=recentFrom):[];
      const window=recent.reduce((a,x)=>a+x.units,0)>=FB_MIN_UNITS?recent:s.price;
      const md=fbMode(window.map(x=>({v:Math.round(x.p),w:x.units})));
      if(totU<FB_MIN_UNITS){/* too little history to call anything usual */}
      else if(md.share<0.5) variedPrice++;   // sells at too many prices to advise one
      else{
        // Price the opportunity on every unit that sold AT that price, so a
        // recent reprice is never credited with the whole period's volume.
        const at=s.price.filter(x=>Math.round(x.p)===md.v);
        const U=at.reduce((a,x)=>a+x.units,0);
        const wavg=k=>at.reduce((a,x)=>a+x[k]*x.units,0)/U;
        const P=md.v,ref=wavg("ref"),close=wavg("close");
        const afn=at.filter(x=>x.afn).reduce((a,x)=>a+x.units,0)>U/2;
        /* A zero referral line means 0% only if this statement itemises
           selling fees at all — on a fee-invoiced account it means the fee is
           billed elsewhere, and guessing a saving from it would be fiction. */
        const feesItemised=at.some(x=>x.closeSeen)||ref>0.005;
        const rate=P>0?ref/P:0;
        const cats=CATS.filter(c=>Math.abs(refRate(c.key,P)-rate)<=FB_RATE_TOL);
        const cols=FB_CLOSING_COLS.filter(c=>c.afn===afn&&Math.abs(c.t[fbClosingBand(P)]-close)<=0.51);
        if(!feesItemised) noFees++;
        else if(!cats.length) unknownRate++;
        let bestOp=null;
        for(const E of FB_EDGES){
          if(E>=P) continue;
          /* The referral rate below the step is only knowable when this SKU's
             own charge identifies a category. Where several fit and disagree,
             take the dearest — a saving overstated is worse than one missed.
             Rates are not monotonic (furniture pays MORE below ₹15,000), so
             an unrecognised rate earns no referral saving at all. */
          const refNew=cats.length?E*Math.max(...cats.map(c=>refRate(c.key,E))):null;
          const refSave=refNew===null?0:Math.max(0,ref-refNew);
          const closeNew=cols.length?Math.max(...cols.map(c=>c.t[fbClosingBand(E)])):null;
          const closeSave=closeNew===null?0:Math.max(0,close-closeNew);
          const give=(P-E)/(1+g);
          const net=refSave+closeSave-give;
          if(net<FB_MIN_NET) continue;
          const prize=net*U;
          if(!bestOp||prize>bestOp.prize)
            bestOp={sku:s.sku,price:P,target:E,ref,refNew,close,closeNew,refSave,closeSave,give,net,
              units:U,prize,cats:cats.map(c=>c.name),rateKnown:refNew!==null,colKnown:!!cols.length};
        }
        if(bestOp&&feesItemised) price.push(bestOp);
      }
    }
    if(s.wt.length>=FB_MIN_SHIP){
      const md=fbMode(s.wt.map(x=>({v:x.slab,w:1})));
      const fam=fbMode(s.wt.map(x=>({v:x.family,w:1}))).v;
      // The lightest band has nothing below it, but it can still sit a few
      // grams under the band above — which is worth knowing.
      if(md.share>=0.6){
        const atMode=s.wt.filter(x=>x.slab===md.v);
        const unitsAtMode=atMode.reduce((a,x)=>a+x.units,0);
        /* Has this SKU ever been billed lighter? Then the lighter band is not
           a theory — the same product has already shipped in it, and the rest
           of its shipments paid the difference for nothing. */
        const lower=s.wt.filter(x=>x.slab<md.v);
        /* One or two shipments in a lighter band across hundreds is Amazon
           mis-measuring, not a parcel you can reproduce — it takes a real
           share of the SKU's shipments before "we have already done this"
           is a fair thing to tell someone. */
        const proven=lower.length>=Math.max(FB_PROVEN_MIN,s.wt.length*FB_PROVEN_SHARE);
        const fba=/^fba/.test(fam);
        let target=proven?fbMode(lower.map(x=>({v:x.slab,w:1}))).v:md.v-1;
        /* A settlement says which band Amazon billed, never what the parcel
           weighs — so on its own a lighter band is only ever a target. Given
           the real weight, the same charge answers a better question: a 750 g
           product cannot reach the 500 g band however it is packed, and
           telling someone to try is worse than saying nothing. */
        const wi=weights[s.sku]||null;
        const kgIn=wi?Math.max(0,Number(wi.kg)||0):0;
        const vol=wi?volWeight(Number(wi.l)||0,Number(wi.w)||0,Number(wi.h)||0):0;
        const bw=Math.max(kgIn,vol);
        let verdict="unknown",gramsOff=null,implied=null;
        const volDriven=vol>kgIn&&vol>0;
        if(bw>0){
          const sw=fba?fbaShipWeight(bw):esShipWeight(bw);
          implied=sw<=0.5?0:sw<=1?1:sw<=2?2:3;
          if(implied<md.v){
            // Billed heavier than the parcel the seller packed: the lighter
            // band is not something to aim at, it is something to claim.
            verdict="overbilled"; target=implied;
          }
          else if(implied>md.v) verdict="underbilled";   // billed lighter than it is — leave it alone
          else{
            const allowance=FB_SLAB_KG[target]-(fba?0.1:0);
            gramsOff=Math.round((bw-allowance)*1000);
            verdict=gramsOff<=FB_TRIM_G?"trim":(volDriven?"box":"blocked");
          }
        }
        /* The other direction, which only a weighed parcel can see: how much
           room is left before the band ABOVE. A SKU 120 g under the edge is
           one packaging change away from paying the next band on every unit,
           and nothing in a settlement warns about that until it happens. */
        let edgeG=null,edgeCost=null;
        if(bw>0&&verdict!=="underbilled"){
          const allowance=FB_SLAB_KG[implied]-(fba?0.1:0);
          const head=Math.round((allowance-bw)*1000);
          const now=REC_FEE_FOR(fam,implied),up=REC_FEE_FOR(fam,implied+1);
          if(head>=0&&head<=FB_EDGE_G&&now!==null&&now!==undefined&&up!==null&&up!==undefined&&up>now){
            edgeG=head; edgeCost=up-now;
          }
        }
        if(verdict==="underbilled") underBilled++;
        else{
          const cur=REC_FEE_FOR(fam,md.v),to=md.v>0?REC_FEE_FOR(fam,target):null;
          const canSave=md.v>0&&cur!==null&&cur!==undefined&&to!==null&&to!==undefined&&cur>to;
          if(canSave||edgeG!==null)
            weight.push({sku:s.sku,slab:md.v,target,family:fam,per:cur,perTarget:to,
              save:canSave?cur-to:0,units:unitsAtMode,prize:canSave?(cur-to)*unitsAtMode:0,
              proven:canSave&&proven&&verdict!=="blocked",provenN:lower.length,ships:s.wt.length,
              kg:canSave?FB_SLAB_KG[target]:null,fba,verdict:canSave?verdict:"edge",
              gramsOff,implied,volDriven,edgeG,edgeCost,
              parcelKg:bw||null,provenConflict:canSave&&proven&&verdict==="blocked"});
        }
      }
    }
  }
  price.sort((a,b)=>b.prize-a.prize); weight.sort((a,b)=>b.prize-a.prize);
  const sum=a=>a.reduce((s,x)=>s+x.prize,0);
  /* Three buckets, never added together in the headline: what the SKU has
     already done (or is demonstrably overbilled for), what is worth trying,
     and what the seller's own weights have ruled out. */
  const real=weight.filter(w=>w.proven||w.verdict==="overbilled");
  const blocked=weight.filter(w=>w.verdict==="blocked");
  const open=weight.filter(w=>!real.includes(w)&&!blocked.includes(w));
  return {price,weight,
    totals:{price:sum(price),proven:sum(real),potential:sum(open),blocked:sum(blocked)},
    notes:{skus:bySku.size,priceLines,wtLines,wtUnknown,variedPrice,unknownRate,noFees,underBilled,
      weighed:weight.filter(w=>w.parcelKg).length,
      atEdge:weight.filter(w=>w.edgeG!==null&&w.edgeG!==undefined).length,from,to,days}};
}

function fbAddFiles(list){
  const files=[...(list||[])]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    const finish=()=>{ if(--pending===0) fbRenderResults(); };
    saReadDropped(f,text=>{
      fbFiles=fbFiles.filter(x=>x.name!==f.name);   // re-drop replaces
      const ut=parseUnifiedTransaction(text);
      if(!ut&&saLooksExcel(text,f.name)) fbFiles.push({name:f.name,kind:"error",msg:SA_EXCEL_MSG});
      else if(ut) fbFiles.push({name:f.name,kind:"settlement",parsed:ut});
      else{
        const p=parseSettlement(text);
        if(p.records.length||p.summary){
          const dup=p.summary&&fbFiles.some(x=>x.kind==="settlement"&&x.parsed.summary&&x.parsed.summary.settlementId===p.summary.settlementId);
          if(dup) fbFiles.push({name:f.name,kind:"error",msg:"same settlement ID as a file already loaded — skipped to avoid double counting"});
          else fbFiles.push({name:f.name,kind:"settlement",parsed:p});
        }
        else fbFiles.push({name:f.name,kind:"error",msg:"not recognised as a settlement flat file."+saDescribeColumns(text)});
      }
      finish();
    },msg=>{ fbFiles=fbFiles.filter(x=>x.name!==f.name); fbFiles.push({name:f.name,kind:"error",msg}); finish(); });
  });
}

  else if(!o.rateKnown&&o.ref>0.005) bits.push("referral rate matches no published category, so none of it is counted");

/* What the settlement and the seller's own scales together can say about one

function fbWeightVerdict(w){
  const g=kg=>Math.round(kg*1000).toLocaleString("en-IN")+" g";
  const ships=w.proven?`already billed band ${w.target+1} on ${w.provenN} of its ${w.ships} shipments`
    :`${w.ships} shipments, all in this band`;
  const hasEdge=w.edgeG!==null&&w.edgeG!==undefined;
  const edge=hasEdge?` <b>${w.edgeG} g of headroom</b> before the band above — add that much tape or padding and every unit costs ${inr(w.edgeCost)} more.`:"";
  if(w.verdict==="edge")
    return `nothing to win below this band, and the ${g(w.parcelKg)} parcel has just${edge}`;
  if(w.verdict==="overbilled")
    return `your parcel belongs in <b>band ${w.implied+1}</b> (${g(w.parcelKg)}${w.volDriven?" volumetric":""}), but Amazon billed band ${w.slab+1} — it is measuring heavier than you packed.${edge}`;
  if(w.verdict==="trim")
    return `<b>${w.gramsOff} g to come off</b> the ${g(w.parcelKg)} parcel and it drops a band — that is a packaging change, not a product one. (${ships})`;
  if(w.verdict==="box")
    return `the box is what's billed — volumetric ${g(w.parcelKg)} beats the actual weight, so a smaller carton wins the band without removing a gram. (${ships})`;
  if(w.verdict==="blocked")
    return `<b>out of reach</b>: the parcel is ${g(w.parcelKg)} and band ${w.target+1} needs ${esc(fbTargetKg(w))}, so ${w.gramsOff} g of product would have to go.${w.provenConflict?` ${w.provenN} of its ${w.ships} shipments were billed lighter even so — Amazon's own measurement varies, and those charges are worth checking in Reconciliation.`:""}${edge}`;
  return `${ships} — needs ${esc(fbTargetKg(w))}. Weigh one and type it in to see whether that is possible.`;
}

    if(n.atEdge)
      h+=`<div class="banner warn">${n.atEdge} SKU${n.atEdge>1?"s sit":" sits"} within ${FB_EDGE_G} g of the <b>next band up</b> — thicker tape, a bigger box or a heavier insert would push ${n.atEdge>1?"them":"it"} over, and the step costs more than the packaging ever will. Worth pinning the current pack down before anyone changes it.</div>`;

        w.save.toFixed(2),w.units,w.verdict==="blocked"?"0.00":w.prize.toFixed(2),

    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([lines.join("\r\n")],{type:"text/csv"}));
