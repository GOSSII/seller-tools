/* Promotional / restricted phrases Amazon flags in titles and bullets. */
function lqcBannedIn(text){
  const rules=[
    [/\bbest[\s-]?sellers?\b/i,"best seller"],
    [/(^|[\s(])#\s?1\b/,"#1"],
    [/\bno\.?\s?1\b/i,"No.1"],
    [/\bfree\s+(shipping|delivery)\b/i,"free shipping"],
    [/\bguarantee[ds]?\b/i,"guarantee"],
    [/\bcheapest\b/i,"cheapest"],
    [/\bsale\b/i,"sale"],
    [/\b(discounts?|discounted)\b/i,"discount"],
    [/\b(covid|corona\s?virus)\b/i,"COVID"],
  ];
  const hits=rules.filter(r=>r[0].test(text)).map(r=>r[1]);
  if(/\p{Extended_Pictographic}/u.test(text)) hits.push("emoji");
  return hits;
}

/* ALL-CAPS words (3+ letters) that are not standard abbreviations. */
function lqcAllCaps(text){
  const ok=new Set(["USB","LED","LCD","OLED","AMOLED","PVC","ABS","BPA","EVA","RGB","HDMI","GPS","SIM","OTG","COD","MRP","GSM","UPF","SPF","XXL","XXXL","DIY","RAM","ROM","SSD","HDD","LTE","ISI","FSSAI"]);
  const seen=new Set();
  (text.split(/[^A-Za-z]+/)).forEach(w=>{
    if(w.length>=3&&w===w.toUpperCase()&&!ok.has(w)) seen.add(w);
  });
  return [...seen];
}

/* Words (3+ letters, not connectors) used 3 or more times. */
function lqcRepeats(text){
  const stop=new Set(["and","for","the","with","from"]);
  const counts={};
  (text.toLowerCase().match(/[a-z]{3,}/g)||[]).forEach(w=>{ if(!stop.has(w)) counts[w]=(counts[w]||0)+1; });
  return Object.keys(counts).filter(w=>counts[w]>=3);
}

/* One checklist row. label/detail must already be HTML-safe (esc() on user text). */
function lqcRow(c){
  const ic=c.state==="pass"?["✓","var(--green)"]:c.state==="warn"?["!","var(--orange)"]:["✕","var(--red)"];
  return `<div style="display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)">
    <span style="flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:${ic[1]}">${ic[0]}</span>
    <div style="font-size:13.5px;line-height:1.45"><b>${c.label}</b>${c.detail?`<span style="color:var(--muted)"> — ${c.detail}</span>`:""}</div>
  </div>`;
}

/* Runs every check; returns {checks:[{sec,state,pts,label,detail,fix}], kw:[{k,state}]}.
   All user-supplied fragments inside detail strings are esc()'d here. */
function lqcAnalyze(title,bullets,desc,kws){
  const checks=[];
  const add=(sec,state,pts,label,detail,fix)=>checks.push({sec,state,pts,label,detail,fix});

  /* ---- Title ---- */
  if(!title){
    add("Title","fail",10,"No title yet","","Write a title — up to 200 characters, the most important words in the first 80.");
  }else{
    const len=title.length;
    add("Title",len<=200?"pass":"fail",10,`Within the 200-character limit (${len}/200)`,
      len>200?`${len-200} over — Amazon can suppress listings that exceed it`:"",
      "Cut the title to 200 characters or fewer.");
    add("Title",len<=80?"pass":"warn",4,"Key words inside the first ~80 characters",
      len>80?"mobile search results truncate around 80 characters — front-load brand + product + main keyword":"",
      "Move the most important words into the first ~80 characters.");
    add("Title",/^[A-Z0-9]/.test(title)?"pass":"warn",4,"Starts with the brand name, capitalised",
      /^[A-Z0-9]/.test(title)?"":"Amazon style is Brand + product + key attributes, and the first word capitalised",
      "Start the title with your brand name, capitalised.");
    const caps=lqcAllCaps(title);
    add("Title",caps.length?"warn":"pass",6,"No ALL-CAPS words",
      caps.length?`found: ${caps.map(esc).join(", ")} — use Title Case; caps only for standard abbreviations`:"",
      "Rewrite ALL-CAPS words in Title Case.");
    const ban=lqcBannedIn(title);
    add("Title",ban.length?"fail":"pass",12,"No promotional or banned phrases",
      ban.length?`found: ${ban.map(esc).join(", ")}`:"",
      "Remove promotional claims from the title — Amazon can suppress the listing for them.");
    const rep=lqcRepeats(title);
    add("Title",rep.length?"warn":"pass",4,"No word repeated 3+ times",
      rep.length?`repeated: ${rep.map(esc).join(", ")}`:"",
      "Repeats add no ranking value — use the space for another attribute (size, colour, material).");
  }

  /* ---- Bullets ---- */
  if(!bullets.length){
    add("Bullets","fail",8,"No bullet points yet","5 recommended — each one is indexed for search",
      "Add 5 bullets — one benefit or feature each, most important first.");
  }else{
    const n=bullets.length;
    add("Bullets",n===5?"pass":"warn",8,`5 bullet points (you have ${n})`,
      n>5?"Amazon shows only the first 5":n<5?"use all 5 — each is free indexed search real estate":"",
      n>5?"Merge down to 5 bullets — the rest are never shown.":"Add bullets until you have 5.");
    const long=bullets.map((b,i)=>[i+1,b.length]).filter(x=>x[1]>250);
    add("Bullets",long.length?"warn":"pass",6,"Each bullet ≤ ~250 characters",
      long.length?long.map(x=>`bullet ${x[0]}: ${x[1]} chars`).join(", "):"",
      "Tighten long bullets — buyers scan only the first few words of each.");
    const lower=bullets.map((b,i)=>[i+1,b]).filter(x=>!/^[A-Z0-9]/.test(x[1]));
    add("Bullets",lower.length?"warn":"pass",4,"Each bullet starts with a capital letter",
      lower.length?`bullet ${lower.map(x=>x[0]).join(", ")}`:"",
      "Capitalise the first word of each bullet.");
    const dots=bullets.map((b,i)=>[i+1,b]).filter(x=>/[.。]$/.test(x[1]));
    add("Bullets",dots.length?"warn":"pass",3,"No ending period (Amazon style: bullets are fragments)",
      dots.length?`bullet ${dots.map(x=>x[0]).join(", ")}`:"",
      "Drop the trailing period from each bullet.");
    const bban=lqcBannedIn(bullets.join("\n"));
    add("Bullets",bban.length?"fail":"pass",10,"No promotional or banned phrases",
      bban.length?`found: ${bban.map(esc).join(", ")}`:"",
      "Remove promotional claims from the bullets.");
  }

  /* ---- Description ---- */
  if(!desc){
    add("Description","warn",6,"No description yet","a keyword-rich description helps both indexing and conversion",
      "Write a description — aim for 200–2,000 characters.");
  }else{
    const dl=desc.length;
    add("Description",dl>2000?"fail":dl<200?"warn":"pass",6,`Good length (${dl} characters)`,
      dl>2000?`${dl-2000} over the 2,000-character limit`:dl<200?"thin — aim for 200+ characters":"",
      dl>2000?"Cut the description to 2,000 characters or fewer.":"Expand the description — cover materials, sizing, care and use cases.");
    const tags=new Set();
    for(const m of desc.matchAll(/<\s*\/?\s*([a-zA-Z][a-zA-Z0-9]*)/g)){ const t=m[1].toLowerCase(); if(t!=="br") tags.add(t); }
    add("Description",tags.size?"warn":"pass",5,"No HTML tags other than &lt;br&gt;",
      tags.size?`found: ${[...tags].map(t=>esc("<"+t+">")).join(" ")} — Amazon strips these or shows them as plain text`:"",
      "Remove HTML from the description; only <br> line breaks render reliably.");
  }

  /* ---- Keyword coverage ---- */
  const hay=(title+"\n"+bullets.join("\n")+"\n"+desc).toLowerCase();
  const hayWords=new Set(hay.match(/[a-z0-9]+/g)||[]);
  const kw=kws.map(k=>{
    const kl=k.toLowerCase();
    const parts=kl.match(/[a-z0-9]+/g)||[];
    const state=hay.includes(kl)?"exact":(parts.length&&parts.every(w=>hayWords.has(w)))?"words":"missing";
    return {k,state};
  });
  return {checks,kw};
}

function lqcUpdate(){
  const out=document.getElementById("lqc-out"); if(!out) return;
  const title=document.getElementById("lqc-title").value.trim().replace(/\s+/g," ");
  const bullets=document.getElementById("lqc-bullets").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const desc=document.getElementById("lqc-desc").value.trim();
  const seen=new Set();
  const kws=document.getElementById("lqc-kw").value.split(",").map(s=>s.trim().replace(/\s+/g," ")).filter(Boolean)
    .filter(k=>{const kl=k.toLowerCase(); if(seen.has(kl))return false; seen.add(kl); return true;});

  const tc=document.getElementById("lqc-tcount");
  tc.style.color=title.length>200?"var(--red)":"";
  tc.innerHTML=title
    ?`${title.length} / 200 characters${title.length>80&&title.length<=200?` — <b>${title.length-80}</b> beyond the ~80 shown on mobile`:""}`
    :"Up to 200 characters; mobile search results show roughly the first 80.";

  if(!title&&!bullets.length&&!desc&&!kws.length){
    out.innerHTML=`<div class="banner info" style="margin-top:16px">Paste your listing above — the analysis updates live as you type.</div>`;
    return;
  }

  const {checks,kw}=lqcAnalyze(title,bullets,desc,kws);

  /* Score: pass = full points, warn = half, fail = 0; keyword coverage scaled. */
  let total=0,earned=0;
  checks.forEach(c=>{ total+=c.pts; earned+=c.state==="pass"?c.pts:c.state==="warn"?c.pts/2:0; });
  if(kw.length){
    const frac=kw.reduce((s,x)=>s+(x.state==="exact"?1:x.state==="words"?0.6:0),0)/kw.length;
    total+=14; earned+=14*frac;
  }
  const score=total?Math.round(earned/total*100):0;
  const scol=score>=80?"var(--green)":score>=50?"var(--orange)":"var(--red)";

  /* Fix-first: fails, then warns, biggest points first. */
  const fixes=checks.filter(c=>c.state!=="pass")
    .sort((a,b)=>(a.state==="fail"?0:1)-(b.state==="fail"?0:1)||b.pts-a.pts)
    .map(c=>`<b>${c.sec}:</b> ${esc(c.fix)}`);
  const missing=kw.filter(x=>x.state==="missing").length;
  if(missing) fixes.push(`<b>Keywords:</b> Work the ${missing} missing keyword${missing>1?"s":""} into the title or bullets — words not in the listing can't rank organically.`);

  let h=`
    <div class="panel"><div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <h4 style="margin:0">Overall score</h4>
        <b style="font-size:22px;color:${scol}">${score}<span style="font-size:13px;color:var(--muted);font-weight:400"> / 100</span></b>
      </div>
      <div style="height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:10px">
        <div style="height:100%;width:${score}%;background:${scol};border-radius:999px;transition:width .25s"></div>
      </div>
    </div></div>`;

  h+=fixes.length
    ?`<div class="panel"><div class="card"><h4 style="margin:0 0 8px">Fix first</h4><ol style="margin:0;padding-left:20px;font-size:13.5px;display:grid;gap:6px">${fixes.slice(0,7).map(f=>`<li>${f}</li>`).join("")}</ol></div></div>`
    :`<div class="panel"><div class="banner good" style="margin-bottom:0">No issues found — this listing follows Amazon's style rules.</div></div>`;

  ["Title","Bullets","Description"].forEach(sec=>{
    const rows=checks.filter(c=>c.sec===sec);
    if(!rows.length) return;
    const passed=rows.filter(c=>c.state==="pass").length;
    h+=`<div class="panel"><div class="card"><h4 style="margin:0 0 4px">${sec} <span class="sa-sub">${passed}/${rows.length} passed</span></h4>${rows.map(lqcRow).join("")}</div></div>`;
  });

  h+=`<div class="panel"><div class="card"><h4 style="margin:0 0 8px">Keyword coverage</h4>${
    kw.length
      ?`<div class="chips">${kw.map(x=>
          x.state==="exact"?`<span class="chip" style="background:var(--green-soft);border-color:var(--green-line);color:#166534">✓ ${esc(x.k)}</span>`
          :x.state==="words"?`<span class="chip" style="background:var(--blue-soft);border-color:var(--blue-line);color:#1e3a5f" title="Every word appears, but not as one phrase">≈ ${esc(x.k)}</span>`
          :`<span class="chip" style="background:var(--orange-soft);border-color:var(--orange-line);color:#9a4b12">✕ ${esc(x.k)}</span>`
        ).join("")}</div>
        <div class="note" style="margin:10px 0 0">✓ appears as a phrase &nbsp;·&nbsp; ≈ all words present, but scattered &nbsp;·&nbsp; ✕ missing — Amazon can only rank you for words that exist somewhere in the listing.</div>`
      :`<div class="note" style="margin:0">Add comma-separated target keywords above to check which ones your listing actually contains (not scored until you do).</div>`
  }</div></div>`;

  out.innerHTML=h;
}

/* Code 128 encoder — subset B with subset C for digit runs.
   Returns the full code-value sequence (start, data, checksum, stop),
   or null if the text has characters outside printable ASCII. */
function fnskuCode128Values(text){
  const t=String(text||"");
  if(!t.length) return null;
  for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);if(c<32||c>126) return null;}
  const digits=at=>{let n=0;while(at+n<t.length&&t.charCodeAt(at+n)>=48&&t.charCodeAt(at+n)<=57)n++;return n;};
  const vals=[];
  let i=0,mode;
  if(digits(0)>=4){mode="C";vals.push(105);}   // Start C
  else{mode="B";vals.push(104);}               // Start B
  while(i<t.length){
    if(mode==="C"){
      if(digits(i)>=2){vals.push(parseInt(t.substr(i,2),10));i+=2;}
      else{vals.push(100);mode="B";}           // CODE B
    }else{
      const d=digits(i);
      if(d>=6||(d>=4&&i+d===t.length)){vals.push(99);mode="C";} // CODE C
      else{vals.push(t.charCodeAt(i)-32);i++;}
    }
  }
  let sum=vals[0];
  for(let k=1;k<vals.length;k++) sum+=vals[k]*k;
  vals.push(sum%103);                          // checksum
  vals.push(106);                              // stop
  return vals;
}

/* Expands the code values to the flat list of bar/space module widths
   (bar first, alternating). Each symbol is 11 modules; the stop is 13. */
function fnskuCode128Widths(text){
  const P=[
    "212222","222122","222221","121223","121322","131222","122213","122312",
    "132212","221213","221312","231212","112232","122132","122231","113222",
    "123122","123221","223211","221132","221231","213212","223112","312131",
    "311222","321122","321221","312212","322112","322211","212123","212321",
    "232121","111323","131123","131321","112313","132113","132311","211313",
    "231113","231311","112133","112331","132131","113123","113321","133121",
    "313121","211331","231131","213113","213311","213131","311123","311321",
    "331121","312113","312311","332111","314111","221411","431111","111224",
    "111422","121124","121421","141122","141221","112214","112412","122114",
    "122411","142112","142211","241211","221114","413111","241112","134111",
    "111242","121142","121241","114212","124112","124211","411212","421112",
    "421211","212141","214121","412121","111143","111341","131141","114113",
    "114311","411113","411311","113141","114131","311141","411131","211412",
    "211214","211232","2331112"];
  const vals=fnskuCode128Values(text);
  if(!vals) return null;
  const out=[];
  for(const v of vals) for(const ch of P[v]) out.push(+ch);
  return out;
}

/* Keep text drawable with the standard Helvetica (WinAnsi) fonts. */
function fnskuAscii(s){
  return String(s||"")
    .replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[–—]/g,"-").replace(/[^\x20-\x7E]/g,"")
    .replace(/\s+/g," ").trim();
}

function fnskuFit(font,text,size,maxW){
  let t=String(text||"");
  if(!t) return "";
  if(font.widthOfTextAtSize(t,size)<=maxW) return t;
  while(t.length&&font.widthOfTextAtSize(t+"...",size)>maxW) t=t.slice(0,-1);
  return t?t+"...":"";
}

/* Draws one sticker into its cell (x = cell left, yTop = cell top, pdf-lib
   coordinates). Returns true if the barcode came out denser than ~0.5 pt
   per module (worth a test scan). */
function fnskuDrawSticker(page,font,fontB,x,yTop,w,h,it){
  const black=PDFLib.rgb(0,0,0);
  const widths=fnskuCode128Widths(it.code);
  const px=Math.max(6,w*0.06);                 // horizontal pad = quiet zone
  const py=Math.max(3,h*0.055);
  const codeSize0=Math.min(9,Math.max(5,h*0.115));
  const nameSize=Math.min(7,Math.max(4.5,h*0.095));
  const gap=Math.max(1.5,h*0.02);
  const maxW=w-2*px;
  const barH=Math.max(8,h-2*py-(codeSize0+2*nameSize+3*gap));
  const modules=widths.reduce((s,n)=>s+n,0);
  const mw=maxW/modules;                       // module width; px ≈ 10-module quiet zone
  const barTop=yTop-py;
  let bx=x+px;
  for(let i=0;i<widths.length;i++){
    const bwid=widths[i]*mw;
    if(i%2===0) page.drawRectangle({x:bx,y:barTop-barH,width:bwid,height:barH,color:black});
    bx+=bwid;
  }
  // Human-readable code — shrink to fit before truncating.
  let cs=codeSize0, code=fnskuAscii(it.code);
  while(cs>4&&fontB.widthOfTextAtSize(code,cs)>maxW) cs-=0.5;
  code=fnskuFit(fontB,code,cs,maxW);
  const codeY=barTop-barH-gap-cs*0.85;
  page.drawText(code,{x:x+(w-fontB.widthOfTextAtSize(code,cs))/2,y:codeY,size:cs,font:fontB,color:black});
  const name=fnskuFit(font,fnskuAscii(it.name),nameSize,maxW);
  const nameY=codeY-gap-nameSize;
  if(name) page.drawText(name,{x:x+(w-font.widthOfTextAtSize(name,nameSize))/2,y:nameY,size:nameSize,font,color:black});
  const cond=fnskuFit(font,fnskuAscii(it.cond||"New"),nameSize,maxW);
  const condY=nameY-gap-nameSize;
  if(cond) page.drawText(cond,{x:x+(w-font.widthOfTextAtSize(cond,nameSize))/2,y:condY,size:nameSize,font,color:black});
  return mw<0.5;
}

async function fnskuGenerate(rows,fmtKey){
  const F=fnskuFormats();
  const fmt=F[fmtKey]||F["a4-65"];
  const doc=await PDFLib.PDFDocument.create();
  const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const fontB=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const per=fmt.cols*fmt.rows;
  const items=[];
  for(const r of rows) for(let i=0;i<r.qty;i++) items.push(r);
  let page=null,dense=false;
  for(let idx=0;idx<items.length;idx++){
    const slot=idx%per;
    if(slot===0) page=doc.addPage([fmt.page[0],fmt.page[1]]);
    const col=slot%fmt.cols, row=Math.floor(slot/fmt.cols);
    const x=fmt.left+col*(fmt.w+fmt.hgap);
    const yTop=fmt.page[1]-fmt.top-row*(fmt.h+fmt.vgap);
    if(fnskuDrawSticker(page,font,fontB,x,yTop,fmt.w,fmt.h,items[idx])) dense=true;
  }
  const bytes=await doc.save();
  return {bytes,pages:doc.getPageCount(),stickers:items.length,fmtName:fmt.name,dense};
}

  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over");}));
  const read=f=>{
    const rd=new FileReader();
    rd.onload=()=>{gstinvOnFile(String(rd.result),f.name);};
    rd.readAsText(f);
  };
  drop.addEventListener("drop",ev=>{const f=ev.dataTransfer.files[0];if(f)read(f);});
  file.addEventListener("change",()=>{const f=file.files[0];if(f)read(f);});
  if(gstinvState().parsed) gstinvRenderSettings();
}

/* Per-session state kept on the function object so this file stays
   declaration-only (survives route changes, not reloads). */
function gstinvState(){
  return (gstinvState._s=gstinvState._s||{parsed:null,fileName:"",prices:null,priceCol:false,settings:null});
}

function gstinvLoadSeller(){
  try{return JSON.parse(localStorage.getItem("gstinv_seller")||"{}")||{};}catch(e){return {};}
}
function gstinvSaveSeller(v){
  try{localStorage.setItem("gstinv_seller",JSON.stringify(v));}catch(e){}
}
function gstinvReadSellerForm(){
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const prev=gstinvLoadSeller();
  return Object.assign({},prev,{
    name:g("gstinv-name"),gstin:g("gstinv-gstin").toUpperCase(),addr:g("gstinv-addr"),
    state:g("gstinv-state"),scode:g("gstinv-scode"),prefix:g("gstinv-prefix"),start:g("gstinv-start")
  });
}

function gstinvStatus(msg){
  const el=document.getElementById("gstinv-status");
  if(el) el.textContent=msg;
}

function gstinvOnFile(text,name){
  const st=gstinvState();
  st.parsed=parseOrdersReport(text);
  st.fileName=name||"";
  const px=gstinvExtractPrices(text);
  st.prices=px?px.map:null;
  st.priceCol=!!px;
  gstinvRenderSettings();
}

/* Second, price-only pass over the raw report (parseOrdersReport does not
   read prices). Returns {map} where map key is orderId+"\u0001"+sku and the
   value is {amt,qty} — amt is the summed line total (Amazon's item-price
   column is the price for the whole line, not per unit). Null if the file
   has no price-like column. */
function gstinvExtractPrices(text){
  const lines=text.split(/\r\n|\r|\n/).filter(l=>l.trim()!=="");
  if(!lines.length) return null;
  const delim=lines[0].includes("\t")?"\t":",";
  const header=saSplit(lines[0],delim).map(saNormHeader);
  const first=names=>{for(const n of names){const i=header.indexOf(n);if(i!==-1)return i;}return -1;};
  const pi=first(["item-price","unit-price","price","sale-price","item-cost"]);
  if(pi===-1) return null;
  const perUnit=header[pi]==="unit-price";
  const oi=header.indexOf("order-id"), si=header.indexOf("sku");
  const qi=first(["quantity-to-ship","quantity-purchased"]);
  if(oi===-1||si===-1) return null;
  const map=new Map();
  for(let i=1;i<lines.length;i++){
    const f=saSplit(lines[i],delim);
    if(f.length<2) continue;
    const oid=(f[oi]||"").trim(); if(!oid) continue;
    const sku=(f[si]||"").trim();
    const qty=qi===-1?1:(parseInt((f[qi]||"").trim(),10)||1);
    const raw=(f[pi]||"").replace(/[^0-9.\-]/g,"");
    const p=parseFloat(raw);
    if(!isFinite(p)||p<=0) continue;
    const amt=perUnit?p*qty:p;
    const k=oid+"\u0001"+sku;
    const cur=map.get(k)||{amt:0,qty:0};
    cur.amt+=amt; cur.qty+=qty;
    map.set(k,cur);
  }
  return map.size?{map}:null;
}

  const prev=st.settings||{};

      <div class="stat"><div class="k">Units</div><div class="v">${totalUnits}</div></div>
      <div class="stat"><div class="k">Distinct SKUs</div><div class="v">${skuRows.length}</div></div>
      <div class="stat ${st.priceCol?"green":""}"><div class="k">Price column</div><div class="v" style="font-size:15px">${st.priceCol?"Detected":"Not in file"}</div></div>
    </div>
    ${hasAddr?"":`<div class="banner warn">No shipping addresses in this file — GST invoices need the buyer's state to pick CGST+SGST vs IGST. Enable the address columns in the report settings on the Order Reports page, or every invoice will fall back to IGST.</div>`}
    <div class="card" style="margin-top:14px">
      <h3 style="margin-top:0">Invoice settings for this file</h3>
      <div class="cropgrid" style="margin-top:12px">
        <div><label for="gstinv-rate">GST rate</label>
          <select id="gstinv-rate">${[0,5,12,18,28].map(x=>`<option value="${x}"${String(prev.rate??18)===String(x)?" selected":""}>${x}%</option>`).join("")}</select></div>
        <div><label for="gstinv-incl">Entered prices</label>
          <select id="gstinv-incl">
            <option value="incl"${(prev.incl||"incl")==="incl"?" selected":""}>Include GST (Amazon prices do)</option>
            <option value="excl"${prev.incl==="excl"?" selected":""}>Exclude GST — add tax on top</option>
          </select></div>
        ${st.priceCol?`<div style="grid-column:span 2"><label for="gstinv-src">Price source</label>
          <select id="gstinv-src">
            <option value="report"${(prev.src||"report")==="report"?" selected":""}>Use the price column from the report</option>
            <option value="table"${prev.src==="table"?" selected":""}>Use the unit prices in the table below</option>
          </select></div>`:""}
      </div>
      <div class="note" style="margin-top:8px">${st.priceCol
        ?"A price column was found — line amounts come straight from the report (unit prices below are the detected averages, used only for rows the report leaves blank or if you switch the source to the table)."
        :"This report has no price column, so enter a unit price per SKU below — it is multiplied by the quantity on each order."} HSN codes are optional and print in the HSN column when filled.</div>
      <div class="tblwrap" style="margin-top:12px"><table class="sa">

        <tbody>${skuRows.map((p,i)=>{
          const detected=p.priced>0?(p.amt/p.priced):0;
          const val=prevPrices[p.sku]!==undefined?prevPrices[p.sku]:(detected?detected.toFixed(2):"");
          return `<tr><td>${esc(p.sku)}</td><td>${esc(p.name||"—")}</td><td class="num">${p.qty}</td>
            <td class="num"><input id="gstinv-p-${i}" data-sku="${esc(p.sku)}" inputmode="decimal" value="${esc(String(val))}" placeholder="0.00" style="width:90px;text-align:right"></td>

        <a class="bigbtn sec" id="gstinv-dl" download="gst-invoices.pdf" style="display:none">⬇️ Download PDF</a>
      </div>
      <div class="note" id="gstinv-status" style="margin-top:10px" aria-live="polite">Check the settings above, then generate. Nothing leaves your browser.</div>
    </div>
    <div id="gstinv-prev"></div>`;
  document.getElementById("gstinv-go").addEventListener("click",gstinvGenerate);

/* GST state codes + common aliases/abbreviations, so the buyer's
   ship-state text from the report resolves to a 2-digit code. */
function gstinvStateCode(name){
  const CODES={"jammu and kashmir":"01","jammu & kashmir":"01","jk":"01","himachal pradesh":"02","hp":"02",
    "punjab":"03","pb":"03","chandigarh":"04","ch":"04","uttarakhand":"05","uttaranchal":"05","uk":"05","ua":"05",
    "haryana":"06","hr":"06","delhi":"07","new delhi":"07","dl":"07","rajasthan":"08","rj":"08",
    "uttar pradesh":"09","up":"09","bihar":"10","br":"10","sikkim":"11","sk":"11","arunachal pradesh":"12","ar":"12",
    "nagaland":"13","nl":"13","manipur":"14","mn":"14","mizoram":"15","mz":"15","tripura":"16","tr":"16",
    "meghalaya":"17","ml":"17","assam":"18","as":"18","west bengal":"19","wb":"19","jharkhand":"20","jh":"20",
    "odisha":"21","orissa":"21","od":"21","or":"21","chhattisgarh":"22","chattisgarh":"22","cg":"22",
    "madhya pradesh":"23","mp":"23","gujarat":"24","gj":"24",
    "dadra and nagar haveli and daman and diu":"26","dadra and nagar haveli":"26","daman and diu":"26","dn":"26","dd":"26",
    "maharashtra":"27","mh":"27","karnataka":"29","ka":"29","goa":"30","ga":"30","lakshadweep":"31","ld":"31",
    "kerala":"32","kl":"32","tamil nadu":"33","tamilnadu":"33","tn":"33","puducherry":"34","pondicherry":"34","py":"34",
    "andaman and nicobar islands":"35","andaman and nicobar":"35","an":"35","telangana":"36","ts":"36","tg":"36",
    "andhra pradesh":"37","ap":"37","ladakh":"38","la":"38"};
  const k=String(name||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
  return CODES[k]||null;
}

/* Indian-system amount in words: crore / lakh / thousand. */
function gstinvWords(n){
  n=Math.round((isFinite(n)?n:0)*100)/100;
  const rupees=Math.floor(n), paise=Math.round((n-rupees)*100);
  const ones=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=x=>x<20?ones[x]:(tens[Math.floor(x/10)]+(x%10?" "+ones[x%10]:""));
  const three=x=>(x>=100?ones[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):"");
  const parts=[];
  let r=rupees;
  const crore=Math.floor(r/10000000); r%=10000000;
  const lakh=Math.floor(r/100000); r%=100000;
  const thou=Math.floor(r/1000); r%=1000;
  if(crore) parts.push(three(crore)+" Crore");
  if(lakh) parts.push(two(lakh)+" Lakh");
  if(thou) parts.push(two(thou)+" Thousand");
  if(r) parts.push(three(r));
  let w=rupees===0?"Zero":parts.join(" ");
  w="Rupees "+w;
  if(paise) w+=" and "+two(paise)+" Paise";
  return w+" Only";
}

/* pdf-lib StandardFonts are WinAnsi — the rupee sign (and most non-Latin-1
   text) cannot be encoded, so PDF text goes through this. */
function gstinvPdfSafe(s){
  return String(s??"").replace(/₹/g,"Rs ").replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[–—]/g,"-").replace(/×/g,"x").replace(/[^\x20-\x7E -ÿ]/g,"").replace(/\s+/g," ").trim();
}
function gstinvRs(n){
  n=isFinite(n)?n:0;
  return (n<0?"-":"")+"Rs "+Math.abs(n).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function gstinvWrap(font,text,size,maxW){
  const words=gstinvPdfSafe(text).split(" ").filter(Boolean);
  const lines=[]; let cur="";
  for(let w of words){
    while(font.widthOfTextAtSize(w,size)>maxW&&w.length>2){ // hard-break very long tokens
      let cut=w.length-1;
      while(cut>1&&font.widthOfTextAtSize(w.slice(0,cut),size)>maxW) cut--;
      const head=w.slice(0,cut);
      if(cur){lines.push(cur);cur="";}
      lines.push(head); w=w.slice(cut);
    }
    const t=cur?cur+" "+w:w;
    if(font.widthOfTextAtSize(t,size)<=maxW) cur=t;
    else {if(cur)lines.push(cur); cur=w;}
  }
  if(cur) lines.push(cur);
  return lines.length?lines:[""];
}

async function gstinvGenerate(){
  const st=gstinvState();
  const btn=document.getElementById("gstinv-go");
  if(!st.parsed||st.parsed.missing.length||gstinvGenerate._busy) return;
  const seller=gstinvReadSellerForm();
  if(!seller.scode&&/^\d{2}/.test(seller.gstin)) seller.scode=seller.gstin.slice(0,2);
  gstinvSaveSeller(seller);
  if(!seller.name||!seller.gstin||!seller.scode){
    gstinvStatus("Fill in your business name, GSTIN and 2-digit state code above first — a tax invoice is not valid without them.");
    return;
  }
  if(!/^[0-9]{2}[A-Z0-9]{13}$/.test(seller.gstin)){
    gstinvStatus("That GSTIN doesn't look right — it should be 15 characters starting with your 2-digit state code (e.g. 27ABCDE1234F1Z5). Fix it and generate again.");
    return;
  }
  // Collect per-file settings + the SKU table.
  const val=id=>{const el=document.getElementById(id);return el?el.value:"";};
  const rate=parseFloat(val("gstinv-rate"))||0;
  const incl=(val("gstinv-incl")||"incl")==="incl";
  const src=st.priceCol?(val("gstinv-src")||"report"):"table";
  const skuPrices={},skuHsn={};
  document.querySelectorAll('[id^="gstinv-p-"]').forEach(el=>{
    const p=parseFloat(String(el.value).replace(/[^0-9.\-]/g,""));
    if(isFinite(p)&&p>0) skuPrices[el.getAttribute("data-sku")]=p;
  });
  document.querySelectorAll('[id^="gstinv-h-"]').forEach(el=>{
    const h=el.value.trim(); if(h) skuHsn[el.getAttribute("data-sku")]=h;
  });
  st.settings={rate,incl:incl?"incl":"excl",src,skuPrices,skuHsn};
  // Build invoice models — merge same-SKU lines within an order.
  const orders=st.parsed.orders;
  const startStr=(seller.start||"1").replace(/[^0-9]/g,"")||"1";
  const width=(seller.start||"").trim().length;
  let num=parseInt(startStr,10);
  const noPrice=new Set();
  const invoices=[];
  for(const o of orders){
    const merged=new Map();
    for(const it of o.items){
      const k=it.sku||"(no SKU)";
      const m=merged.get(k)||{sku:k,name:it.name||"",qty:0};
      m.qty+=it.qty; if(!m.name&&it.name) m.name=it.name;
      merged.set(k,m);
    }
    const lines=[];
    for(const m of merged.values()){
      let amt=null;
      if(src==="report"&&st.prices){
        const p=st.prices.get(o.orderId+"\u0001"+(m.sku==="(no SKU)"?"":m.sku));
        if(p&&p.amt>0) amt=p.amt;
      }
      if(amt===null&&skuPrices[m.sku]!==undefined) amt=skuPrices[m.sku]*m.qty;
      if(amt===null){noPrice.add(m.sku);amt=0;}
      const taxable=incl?amt/(1+rate/100):amt;
      const tax=incl?amt-taxable:taxable*rate/100;
      lines.push({sku:m.sku,name:m.name,hsn:skuHsn[m.sku]||"",qty:m.qty,taxable,tax,total:taxable+tax});
    }
    const buyerCode=gstinvStateCode(o.state);
    const intra=buyerCode?buyerCode===seller.scode
      :(!!o.state&&o.state.trim().toLowerCase()===(seller.state||"").trim().toLowerCase()&&!!seller.state);
    const invNo=seller.prefix+String(num).padStart(width,"0");
    num++;
    invoices.push({o,lines,intra,buyerCode,invNo,
      taxable:lines.reduce((s,l)=>s+l.taxable,0),
      tax:lines.reduce((s,l)=>s+l.tax,0),
      total:lines.reduce((s,l)=>s+l.total,0)});
  }
  if(noPrice.size){
    gstinvStatus("No price found for: "+[...noPrice].slice(0,8).join(", ")+(noPrice.size>8?` (+${noPrice.size-8} more)`:"")+". Enter a unit price for these SKUs in the table above, then generate again.");
    return;
  }
  gstinvGenerate._busy=true;
  if(btn) btn.disabled=true;
  gstinvStatus("Loading the PDF engine…");
  try{
    await loadPdfLib();
    gstinvStatus(`Building ${invoices.length} invoice(s)…`);
    const doc=await PDFLib.PDFDocument.create();
    const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    const fontB=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const A4W=595.28,A4H=841.89,L=40,R=A4W-40;
    const black=PDFLib.rgb(0,0,0),grey=PDFLib.rgb(0.42,0.42,0.42),line=PDFLib.rgb(0.75,0.75,0.75);
    const today=new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
    for(const inv of invoices){
      const o=inv.o;
      let pg=doc.addPage([A4W,A4H]);
      const footer=()=>{
        pg.drawLine({start:{x:L,y:56},end:{x:R,y:56},thickness:0.7,color:line});
        pg.drawText("This is a computer-generated invoice.",{x:L,y:44,size:8,font,color:grey});
        pg.drawText("Generated by Seller Tools India - verify with your CA before filing.",{x:L,y:33,size:8,font,color:grey});
        const sig="For "+gstinvPdfSafe(seller.name);
        pg.drawText(sig,{x:R-font.widthOfTextAtSize(sig,9),y:44,size:9,font,color:black});
        pg.drawText("Authorised Signatory",{x:R-font.widthOfTextAtSize("Authorised Signatory",8),y:33,size:8,font,color:grey});
      };
      footer();
      let y=A4H-52;
      const title="TAX INVOICE";
      pg.drawText(title,{x:(A4W-fontB.widthOfTextAtSize(title,16))/2,y,size:16,font:fontB});
      y-=10;
      pg.drawLine({start:{x:L,y},end:{x:R,y},thickness:1,color:black});
      y-=18;
      // Seller block (left) + invoice meta (right).
      const rightX=R-190;
      const meta=[["Invoice No.",inv.invNo],["Invoice Date",today],["Order ID",o.orderId],
        ...(o.date?[["Order Date",String(o.date).slice(0,10)]]:[])];
      let my=y;
      for(const [k,v] of meta){
        pg.drawText(k+":",{x:rightX,y:my,size:9,font,color:grey});
        pg.drawText(gstinvPdfSafe(v).slice(0,30),{x:rightX+70,y:my,size:9,font:fontB});
        my-=13;
      }
      pg.drawText(gstinvPdfSafe(seller.name).slice(0,60),{x:L,y,size:12,font:fontB});
      y-=14;
      for(const ln of gstinvWrap(font,seller.addr,9,rightX-L-20).slice(0,3)){
        pg.drawText(ln,{x:L,y,size:9,font}); y-=11;
      }
      pg.drawText("GSTIN: "+seller.gstin,{x:L,y,size:9,font:fontB}); y-=11;
      pg.drawText("State: "+gstinvPdfSafe(seller.state||"")+" (Code "+seller.scode+")",{x:L,y,size:9,font}); y-=11;
      y=Math.min(y,my)-8;
      pg.drawLine({start:{x:L,y},end:{x:R,y},thickness:0.7,color:line});
      y-=16;
      // Buyer / ship-to block.
      pg.drawText("Bill To / Ship To:",{x:L,y,size:9,font:fontB,color:grey});
      const posName=gstinvPdfSafe(o.state||"");
      const pos="Place of Supply: "+(posName||"(not in report)")+(inv.buyerCode?" (Code "+inv.buyerCode+")":"");
      pg.drawText(pos,{x:R-font.widthOfTextAtSize(pos,9),y,size:9,font});
      y-=13;
      if(o.buyer){pg.drawText(gstinvPdfSafe(o.buyer).slice(0,60),{x:L,y,size:10,font:fontB});y-=12;}
      const addrFull=[o.addr,[o.city,o.state,o.pin].filter(Boolean).join(", ")].filter(Boolean).join(", ");
      for(const ln of gstinvWrap(font,addrFull||"(address not in report)",9,R-L-20).slice(0,3)){
        pg.drawText(ln,{x:L,y,size:9,font}); y-=11;
      }
      y-=8;
      // Items table.
      const half=rate/2;
      const cols=inv.intra
        ?[["#",22,0],["Description",176,0],["HSN",44,0],["Qty",30,1],["Rate",56,1],["Taxable",62,1],[`CGST ${half}%`,62,1],[`SGST ${half}%`,63,1]]
        :[["#",22,0],["Description",188,0],["HSN",48,0],["Qty",34,1],["Rate",62,1],["Taxable",78,1],[`IGST ${rate}%`,83,1]];
      const xs=[L]; for(const c of cols) xs.push(xs[xs.length-1]+c[1]);
      const tableTop=y;
      const HEAD=20,ROWMIN=16;
      let rowY=y-HEAD;
      cols.forEach((c,i)=>{
        const tx=c[2]?xs[i+1]-6-fontB.widthOfTextAtSize(c[0],8):xs[i]+4;
        pg.drawText(c[0],{x:tx,y:rowY+6,size:8,font:fontB});
      });
      pg.drawLine({start:{x:L,y:rowY},end:{x:R,y:rowY},thickness:0.8,color:black});
      const cell=(pgRef,txt,i,yy,bold)=>{
        const f=bold?fontB:font, t=gstinvPdfSafe(txt);

          pg.drawLine({start:{x:xs[i],y:top},end:{x:xs[i],y:bottom},thickness:0.6,color:line});
      };

        const rh=Math.max(ROWMIN,desc.length*10+6);
        if(rowY-rh<150){ // continuation page
          closeBox(rowY);
          pg=doc.addPage([A4W,A4H]); footer();
          let cy=A4H-52;
          const t2="TAX INVOICE (contd.) - "+inv.invNo;
          pg.drawText(gstinvPdfSafe(t2),{x:L,y:cy,size:12,font:fontB});
          cy-=16;
          top=cy; rowY=cy-HEAD;
          cols.forEach((c,i)=>{
            const tx=c[2]?xs[i+1]-6-fontB.widthOfTextAtSize(c[0],8):xs[i]+4;
            pg.drawText(c[0],{x:tx,y:rowY+6,size:8,font:fontB});
          });
          pg.drawLine({start:{x:L,y:rowY},end:{x:R,y:rowY},thickness:0.8,color:black});
        }
        const baseY=rowY-rh;
        cell(pg,String(n),0,rowY-12);
        desc.forEach((dl,k)=>pg.drawText(dl,{x:xs[1]+4,y:rowY-12-k*10,size:8,font}));
        cell(pg,l.hsn||"-",2,rowY-12);
        cell(pg,String(l.qty),3,rowY-12);
        cell(pg,gstinvRs(l.taxable/l.qty).replace("Rs ",""),4,rowY-12);

        if(inv.intra){

          cell(pg,gstinvRs(l.tax/2).replace("Rs ",""),7,rowY-12);
        }else cell(pg,gstinvRs(l.tax).replace("Rs ",""),6,rowY-12);
        rowY=baseY;
        pg.drawLine({start:{x:L,y:rowY},end:{x:R,y:rowY},thickness:0.4,color:line});
        n++;
      }
      closeBox(rowY);
      // Totals block, right-aligned under the table.
      let ty=rowY-18;
      const trow=(k,v,bold)=>{
        const f=bold?fontB:font,size=bold?10:9;

        pg.drawText(t,{x:R-f.widthOfTextAtSize(t,size),y:ty,size,font:f});

      };

      else trow(`IGST @ ${rate}%`,inv.tax);
      pg.drawLine({start:{x:R-210,y:ty+10},end:{x:R,y:ty+10},thickness:0.7,color:black});
      trow("Invoice Total",inv.total,true);
      ty-=4;
      for(const wl of gstinvWrap(fontB,"Amount in words: "+gstinvWords(inv.total),9,R-L).slice(0,2)){
        pg.drawText(wl,{x:L,y:ty,size:9,font:fontB}); ty-=12;
      }
      pg.drawText(inv.intra?"Tax charged as CGST + SGST (buyer in your state)."
        :"Tax charged as IGST (inter-state supply).",{x:L,y:ty,size:8,font,color:grey});
    }
    const bytes=await doc.save();
    const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
    const dl=document.getElementById("gstinv-dl");
    if(dl){dl.href=url;dl.style.display="inline-block";}
    const prev=document.getElementById("gstinv-prev");
    if(prev) pdfPreviewInto(prev,`Preview — ${invoices.length} invoice(s), ${doc.getPageCount()} page(s)`,bytes,url,"GST invoices preview");
    const intraN=invoices.filter(i=>i.intra).length;
    const gross=invoices.reduce((s,i)=>s+i.total,0);
    gstinvStatus(`Done — ${invoices.length} invoice(s) (${inr(gross)} incl. GST): ${intraN} CGST+SGST, ${invoices.length-intraN} IGST. Invoice numbers ${invoices[0]?invoices[0].invNo:""}–${invoices.length?invoices[invoices.length-1].invNo:""}. Check the preview, then download. Set the starting number to ${num} for your next batch.`);
  }catch(e){
    try{console.error("GST invoice:",e);}catch(_){}
    gstinvStatus("Could not generate the PDF"+(String(e).includes("load failed")
      ?" — the PDF engine failed to load (check your connection); nothing was uploaded anywhere."
      :" — "+gstinvPdfSafe(String(e&&e.message||e)).slice(0,120)));
  }
  gstinvGenerate._busy=false;
  if(btn) btn.disabled=false;
}

/* ============================================================
   AD PROFITABILITY BY SKU (Pro)
   Advertising is normally the largest line in an Amazon P&L, but
   the settlement and transaction reports carry it as a single
   unattributed "Cost of Advertising" service fee — no order, no
   SKU. The only per-SKU breakdown lives in the Advertising
   console's Sponsored Products "Advertised product" report, so
   this tool joins the two on SKU and answers the question neither
   file answers alone: after fees, refunds, product cost AND ads,
   which SKUs actually make money? Everything stays local.
   ============================================================ */
let adpFiles=[], adpSort="payout", adpAdv=false;
/* Amazon's unified reporting renamed every one of these columns — an export
   from the current console calls spend "Total cost", the SKU "Advertised
   product SKU" and orders "Purchases". Keep both vocabularies. */
const ADP_SKU_ALIASES=["advertised sku","advertised product sku","seller sku","sku"];
const ADP_ASIN_ALIASES=["advertised asin","advertised product id","asin"];
const ADP_SPEND_ALIASES=["spend","total spend","total cost","cost","spend(inr)","spend (inr)"];
const ADP_SALES_ALIASES=["7 day total sales","14 day total sales","30 day total sales",
  "7 day total sales (inr)","total sales","sales","attributed sales"];
const ADP_ORDER_ALIASES=["7 day total orders (#)","14 day total orders (#)","30 day total orders (#)",
  "7 day total orders","total orders","orders","purchases"];
/* Amazon labels the money column "7 Day Total Sales (₹)". Stripping the symbol
   used to leave "7 day total sales ()", which matched no alias — so sales came
   back as zero and every ACOS silently showed "—". Drop the emptied brackets
   as well. */
function adpNorm(h){return String(h||"").toLowerCase().replace(/[₹"]/g,"").replace(/\(\s*\)/g,"").replace(/\s+/g," ").trim();}
function adpFind(norm,aliases){
  for(const a of aliases){ const i=norm.indexOf(a); if(i!==-1) return i; }
  return -1;
}
/* Sponsored Products "Advertised product" report (CSV export). Tolerant about
   column names because Amazon renames the attribution window periodically.
   Returns null when it isn't an ad report, so other parsers get a turn. */
function parseAdReport(text){
  const lines=String(text||"").replace(/^﻿/,"").split(/\r\n|\r|\n/);
  let hln=-1,delim=",",norm=null;
  for(let i=0;i<lines.length&&i<30;i++){
    if(!lines[i].trim()) continue;
    const d=lines[i].includes("\t")?"\t":",";
    const n=saSplit(lines[i],d).map(adpNorm);
    if(adpFind(n,ADP_SPEND_ALIASES)!==-1&&(adpFind(n,ADP_SKU_ALIASES)!==-1||adpFind(n,ADP_ASIN_ALIASES)!==-1)){
      hln=i;delim=d;norm=n;break;
    }
  }
  if(hln===-1) return null;
  const I={sku:adpFind(norm,ADP_SKU_ALIASES),asin:adpFind(norm,ADP_ASIN_ALIASES),
    spend:adpFind(norm,ADP_SPEND_ALIASES),sales:adpFind(norm,ADP_SALES_ALIASES),
    orders:adpFind(norm,ADP_ORDER_ALIASES),clicks:adpFind(norm,["clicks"]),
    impressions:adpFind(norm,["impressions"])};
  const cell=(f,i)=>i>=0&&i<f.length?String(f[i]||"").trim():"";
  // Same money reader as the flat file, so bracketed negatives and junk cells
  // behave identically wherever they turn up.
  const money=(f,i)=>{const v=saParseAmount(cell(f,i));return Number.isFinite(v)?v:0;};
  const bySku=new Map(); let rows=0,noKey=0;
  for(let i=hln+1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const f=saSplit(lines[i],delim);
    if(f.length<3) continue;
    const key=cell(f,I.sku)||cell(f,I.asin);
    if(!key){noKey++;continue;}
    rows++;
    const e=bySku.get(key)||{key,spend:0,adSales:0,adOrders:0,clicks:0,impressions:0};
    e.spend+=Math.abs(money(f,I.spend));
    e.adSales+=Math.abs(money(f,I.sales));
    e.adOrders+=Math.abs(money(f,I.orders));
    e.clicks+=Math.abs(money(f,I.clicks));
    e.impressions+=Math.abs(money(f,I.impressions));
    bySku.set(key,e);
  }
  if(!bySku.size) return null;
  return {bySku,rows,noKey,hasAsinOnly:I.sku===-1};
}
/* Ad spend the settlement/transaction file knows about but cannot attribute. */
function adpSpendFromSettlement(records){
  let total=0,rows=0;
  for(const rec of records||[]){
    let hit=0;
    for(const l of rec.amounts||[]){
      if(/advertis/i.test(l.amountDescription||"")||/advertis/i.test(l.amountType||"")) hit+=Math.abs(l.amount);
    }
    // One charge can arrive split across several amount columns — count the
    // transaction once, not once per column.
    if(hit>0){ total+=hit; rows++; }
  }
  return {total,rows};
}
function renderAdProfit(){
  setMeta("Ad Profitability by SKU — Seller Tools India",
    "Join your Amazon settlement with the Sponsored Products advertised-product report to see ACOS, break-even ACOS and which SKUs stop making money once ads are counted.");
  backBtn.hidden=false;
  gatePremium(ADP_INFO, adpBody);
}
function adpBody(){
  app.innerHTML=`
    <div class="wrap page">
      <h2>Ad Profitability by SKU</h2>
      <p class="lede">Your settlement says what each SKU earned. Your advertising report says what each SKU cost to promote. Combine both, then add your product cost, to see <b>which SKUs remain profitable after Amazon's charges, advertising and COGS</b>. It needs all three before it will call anything profitable; with fewer inputs it says exactly what it cannot yet know.</p>
      ${helpHtml("ad-profit")}
      <label class="sa-drop" id="adp-drop">
        <div class="ico">📉</div>
        <h3>Drop your settlement + advertising report</h3>
        <p>or click to choose — several files at once is fine (.csv or .txt)</p>
        <input type="file" id="adp-file" multiple accept=".csv,.txt,.xlsx,text/plain,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      </label>
      <div class="sa-priv">🔒 Private by design — both files are read in your browser and never uploaded.</div>
      <div id="adp-out"></div>
    </div>`;
  const drop=document.getElementById("adp-drop"),file=document.getElementById("adp-file");
  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",ev=>adpAddFiles(ev.dataTransfer.files));
  file.addEventListener("change",()=>{adpAddFiles(file.files);file.value="";});
  if(adpFiles.length) adpRender();
}
function adpAddFiles(list){
  const files=[...(list||[])]; if(!files.length) return;
  let pending=files.length;
  files.forEach(f=>{
    const finish=()=>{ if(--pending===0) adpRender(); };
    saReadDropped(f,text=>{
      adpFiles=adpFiles.filter(x=>x.name!==f.name); // re-drop replaces
      const ad=parseAdReport(text);
      if(ad){ adpFiles.push({name:f.name,kind:"ads",ad}); }
      else if(saLooksExcel(text,f.name)){
        adpFiles.push({name:f.name,kind:"error",msg:SA_EXCEL_MSG});
      }
      else{
        const p=parseUnifiedTransaction(text)||parseSettlement(text);
        if(p&&(p.records.length||p.summary)) adpFiles.push({name:f.name,kind:"settlement",parsed:p});
        else adpFiles.push({name:f.name,kind:"error",msg:"not recognised as a settlement, unified transaction or advertised-product report."+saDescribeColumns(text)});
      }
      finish();
    },msg=>{ adpFiles=adpFiles.filter(x=>x.name!==f.name); adpFiles.push({name:f.name,kind:"error",msg}); finish(); });
  });
}
function adpCompute(){
  const settle=adpFiles.filter(f=>f.kind==="settlement").map(f=>f.parsed);
  const records=settle.flatMap(p=>p.records);
  const rows=records.length?skuCompute({records}):[];
  const costs=loadSkuCosts();
  const ads=new Map();
  let adRows=0,adNoKey=0,asinOnly=false;
  for(const f of adpFiles.filter(x=>x.kind==="ads")){
    adRows+=f.ad.rows; adNoKey+=f.ad.noKey; asinOnly=asinOnly||f.ad.hasAsinOnly;
    for(const [k,v] of f.ad.bySku){
      const e=ads.get(k)||{key:k,spend:0,adSales:0,adOrders:0,clicks:0,impressions:0};
      e.spend+=v.spend; e.adSales+=v.adSales; e.adOrders+=v.adOrders;
      e.clicks+=v.clicks; e.impressions+=v.impressions;
      ads.set(k,e);
    }
  }
  const seen=new Set();
  const out=rows.map(s=>{
    const a=ads.get(s.sku);
    if(a) seen.add(s.sku);
    const spend=a?a.spend:0;
    const cost=Number(costs[s.sku])||0;
    const hasCost=cost>0;
    const cogs=hasCost?cost*(s.units||0):null;
    const payout=s.net;                    // after Amazon fees, taxes and refunds
    const afterAds=a?payout-spend:null;     // null until ad spend is attributable
    const profit=(hasCost&&afterAds!==null)?afterAds-cogs:null;
    const beforeAdsProfit=hasCost?payout-cogs:null;
    const sales=s.sales||0;
    const clicks=a?a.clicks:0,impressions=a?a.impressions:0,adOrders=a?a.adOrders:0;
    return {sku:s.sku,units:s.units,orders:s.orders,sales,payout,spend,afterAds,
      cost,cogs,profit,beforeAdsProfit,hasCost,
      account:s.sku==="(no SKU)",
      parts:{ads:s.ads||0,balance:s.balance||0,fees:s.fees||0,taxes:s.taxes||0,
        unknown:s.unknown||0,other:s.other||0},
      adSales:a?a.adSales:0,adOrders,clicks,impressions,
      /* Click metrics come straight off the ad report's own counts — never
         derived from settlement figures. A zero denominator reads "—". */
      ctr:impressions>0?clicks/impressions*100:null,
      cpc:clicks>0?spend/clicks:null,
      cvr:clicks>0?adOrders/clicks*100:null,
      acos:a&&a.adSales>0?spend/a.adSales*100:null,
      tacos:sales>0&&spend>0?spend/sales*100:null,
      // Break-even ACOS: the share of a sale you can spend on ads before the
      // SKU stops making money. Uses profit when a cost is known.
      breakEven:(hasCost&&sales>0)?beforeAdsProfit/sales*100:null,
      /* "Ads turn this SKU into a loss" is only knowable once the ad spend is
         attributable to the SKU. With no ad report it is not zero, it is
         unknown — and a green 0 reads as reassurance the data cannot give. */
      flips:!a?false:(hasCost?beforeAdsProfit>0&&profit<=0:payout>0&&afterAds<=0),
      matched:!!a};
  });
  // Ad spend on SKUs that never appear in the settlement (no sales at all).
  const orphans=[...ads.values()].filter(a=>!seen.has(a.key))
    .map(a=>({sku:a.key,units:0,orders:0,sales:0,payout:0,spend:a.spend,afterAds:-a.spend,
      cost:0,cogs:null,profit:null,beforeAdsProfit:null,hasCost:false,account:false,
      adSales:a.adSales,adOrders:a.adOrders,clicks:a.clicks,impressions:a.impressions,
      ctr:a.impressions>0?a.clicks/a.impressions*100:null,
      cpc:a.clicks>0?a.spend/a.clicks:null,
      cvr:a.clicks>0?a.adOrders/a.clicks*100:null,
      acos:a.adSales>0?a.spend/a.adSales*100:null,tacos:null,breakEven:null,
      flips:false,matched:false,orphan:true}));
  const all=out.concat(orphans);
  const totals=all.reduce((t,r)=>{
    t.sales+=r.sales; t.payout+=r.payout; t.spend+=r.spend; t.cogs+=r.cogs||0;
    t.afterAds+=r.afterAds||0; t.profit+=r.profit||0; t.units+=r.units;
    if(!r.account){ t.skuPayout+=r.payout; t.skuSales+=r.sales; }
    t.clicks+=r.clicks||0; t.impressions+=r.impressions||0;
    t.adOrders+=r.adOrders||0; t.adSales+=r.adSales||0;
    if(r.flips){ t.flipCount++; t.flipLoss+=Math.abs((r.hasCost?r.profit:r.afterAds)||0); }
    return t;
  },{sales:0,payout:0,spend:0,cogs:0,afterAds:0,profit:0,units:0,flipCount:0,flipLoss:0,
     skuPayout:0,skuSales:0,clicks:0,impressions:0,adOrders:0,adSales:0});
  const unattributed=adpSpendFromSettlement(records);
  return {rows:all,totals,haveAds:ads.size>0,adRows,adNoKey,asinOnly,unattributed,
    costed:all.filter(r=>r.hasCost).length,settlementCount:settle.length};
}
function adpRender(){
  const out=document.getElementById("adp-out"); if(!out) return;
  const label={settlement:"Settlement",ads:"Ad report",error:"Wrong report"};
  let h=`<div class="rec-files">${adpFiles.map((f,i)=>`<span class="rec-file"${f.kind==="error"?` title="${esc(f.msg)}"`:""}><b>${esc(f.name)}</b><span class="rf-kind">${f.kind==="error"?"⚠ "+label.error:label[f.kind]}</span><button type="button" data-adprm="${i}" aria-label="Remove ${esc(f.name)}">✕</button></span>`).join("")}</div>`;
  const bad=adpFiles.filter(f=>f.kind==="error");
  if(bad.length) h+=`<div class="banner warn">${bad.map(f=>`<b>${esc(f.name)}</b>: ${esc(f.msg)}`).join("<br>")}</div>`;
  const r=adpCompute();
  if(!r.settlementCount){
    if(adpFiles.length) h+=`<div class="banner info">Add a <b>settlement flat file</b> or a <b>Monthly Unified Transaction</b> report — that's what tells us each SKU's real payout.</div>`;
    out.innerHTML=h; adpWire(out); return;
  }
  const t=r.totals;
  const pctOfProfit=(r.haveAds&&t.payout>0)?Math.min(100,t.spend/t.payout*100):null;
  /* Ad profitability needs three things and the seller has one of them here.
     Saying so up front is the difference between an empty screen and a screen
     that pretends the missing inputs were zeros. */
  const ready=[["Settlement data",true,"Loaded"],
    ["Advertising attribution",r.haveAds,r.haveAds?"Loaded":"Missing"],
    ["Product costs",r.costed>0,r.costed>0?`${r.costed} SKU${r.costed===1?"":"s"} costed`:"Not added"]];
  if(!r.haveAds||!r.costed)
    h+=`<div class="banner warn"><b>Ad profitability is not ready yet.</b><div class="adp-ready">${ready.map(([k,ok,v])=>
      `<span class="chip ${ok?"":"warnchip"}">${ok?"✓":"⚠"} ${esc(k)}: ${esc(v)}</span>`).join("")}</div>${
      !r.haveAds?`Upload the Sponsored Products <b>Advertised Product</b> report to calculate SKU-level ad impact. `:""}${
      !r.costed?`Add a product cost to calculate actual profit.`:""}</div>`;
  const adsPct=(r.unattributed.total>0&&t.sales>0)?r.unattributed.total/t.sales*100:null;
  if(!r.haveAds){
    /* Two different statements. "Advertising ₹0" would claim no money was
       spent; the truth is that ₹0 of a known spend could be attributed. */
    h+=`<div class="stats">
      <div class="stat"><div class="k">Net settlement cash flow</div><div class="v">${inr0(t.payout)}</div>
        <div class="sa-sub">everything these statements settled, ads and balances included</div></div>
      <div class="stat ${r.unattributed.total>0?"red":""}"><div class="k">Sponsored Ads billed</div>
        <div class="v">${r.unattributed.total>0?inr0(-r.unattributed.total):"None in these files"}</div>
        <div class="sa-sub">${r.unattributed.total>0?`${adsPct!==null?adsPct.toFixed(1)+"% of sales · ":""}charged in the settlement`:"no advertising service fee appears"}</div></div>
      <div class="stat warn"><div class="k">SKU-attributed ad spend</div><div class="v">Not available</div>
        <div class="sa-sub">the settlement does not say which SKUs spent it</div></div>
      <div class="stat warn"><div class="k">SKU ad profitability</div><div class="v">Cannot calculate yet</div>
        <div class="sa-sub">needs the Advertised Product report</div></div>
    </div>`;
    h+=`<div class="banner warn"><b>Advertising detected, but SKU attribution is missing.</b> ${r.unattributed.rows?`Your settlement contains <b>${inr0(r.unattributed.total)}</b> of Sponsored Ads spend across ${r.unattributed.rows} charge(s), but the settlement report does not identify which SKUs consumed it.`:`No advertising charge appears in these statements.`} Upload <b>Advertising console → Sponsored Ads → Reports → Sponsored Products → Advertised product</b> for the same date range. Until then the table below shows <b>settlement contribution only — ad profitability pending</b>.</div>`;
  }else{
    h+=`<div class="stats">
      <div class="stat"><div class="k">Settlement contribution</div><div class="v">${inr0(t.skuPayout)}</div>
        <div class="sa-sub">products only — account-level lines are listed separately</div></div>
      <div class="stat ${t.spend>0?"red":""}"><div class="k">Advertising</div><div class="v">${inr0(-t.spend)}</div></div>
      <div class="stat ${t.afterAds>0?"green":"red"}"><div class="k">After ads</div><div class="v">${inr0(t.afterAds)}</div></div>
      <div class="stat ${t.flipCount?"red":"green"}"><div class="k">SKUs ads turn to a loss</div><div class="v">${t.flipCount}</div></div>
    </div>`;
  if(pctOfProfit!==null)
    h+=`<div class="banner ${pctOfProfit>=50?"warn":"info"}">Advertising is taking <b>${pctOfProfit.toFixed(1)}%</b> of everything Amazon paid you after its own fees${t.flipCount?`, and turns <b>${t.flipCount} SKU${t.flipCount===1?"":"s"}</b> from profit into a loss worth <b>${inr0(t.flipLoss)}</b>`:""}.</div>`;
    /* The two files carry their own periods. If the ad report covers less
       spend than the statements were charged, the seller is measuring one
       month of ads against two months of payout and every ACOS reads low. */
    if(r.unattributed.total>0&&t.spend>0&&Math.abs(t.spend-r.unattributed.total)/r.unattributed.total>0.2)
      h+=`<div class="banner warn">Your ad report accounts for <b>${inr0(t.spend)}</b> of spend, but these statements were charged <b>${inr0(r.unattributed.total)}</b> of advertising — the two files cover different periods. Every ACOS and TACOS below is measured against whichever is shorter, so export the ad report for <b>exactly the dates these statements cover</b> before drawing conclusions.</div>`;
    if(!r.costed) h+=`<div class="banner info">No product costs yet, so the table shows <b>payout</b> — what Amazon paid you — rather than profit. Type a cost per unit into the <b>Cost/unit</b> column below (or set one for everything at once) and the break-even ACOS and true profit appear. Costs save in this browser and the <a href="/sku-report">SKU Profitability Report</a> uses the same ones.</div>`;
    if(r.asinOnly) h+=`<div class="banner info">That ad report has ASINs but no SKU column, so rows only match if your settlement uses the same identifier. Re-export it with the <b>Advertised SKU</b> column for an exact match.</div>`;
    const unmatched=r.rows.filter(x=>x.orphan);

    const sibling=unmatched.filter(x=>x.adSales>0),dead=unmatched.filter(x=>!(x.adSales>0));
    if(dead.length) h+=`<div class="banner warn"><b>${inr0(dead.reduce((s,x)=>s+x.spend,0))}</b> of ad spend went to ${dead.length} SKU(s) with no sales <i>and</i> no ad-attributed sales in this settlement — pure loss unless they sold outside the period.</div>`;
    if(sibling.length) h+=`<div class="banner info"><b>${inr0(sibling.reduce((s,x)=>s+x.spend,0))}</b> of ad spend sits on ${sibling.length} SKU(s) that have no settlement sales but <i>do</i> have ${inr0(sibling.reduce((s,x)=>s+x.adSales,0))} of ad-attributed sales — normally the buyer bought another listing of the same product (your FBA one, typically), so the revenue settled under that SKU instead. Judge those two rows together, not apart.</div>`;
  }
  if(r.haveAds&&t.impressions>0)
    h+=`<div class="banner info">Across the whole account: <b>${num(t.impressions)}</b> impressions → <b>${num(t.clicks)}</b> clicks (CTR ${(t.clicks/t.impressions*100).toFixed(2)}%) at <b>${t.clicks?inr(t.spend/t.clicks):"—"}</b> per click → <b>${num(t.adOrders)}</b> ad orders (CVR ${t.clicks?(t.adOrders/t.clicks*100).toFixed(1):"—"}%)${t.sales>0&&t.spend>0?` · TACOS <b>${(t.spend/t.sales*100).toFixed(1)}%</b> of total sales`:""}. A low CTR is an ad problem (image, price, title); a low CVR with a healthy CTR is a listing problem — the click was earned and the page lost it.</div>`;
  /* "(no SKU)" is the account-level bucket — advertising billed without SKU

  const acct=r.rows.find(x=>x.account)||null;

  if(acct){
    const pr=acct.parts||{};
    const lines=[["Sponsored Ads billed without SKU attribution",pr.ads],
      ["Account balance movements carried between statements",pr.balance],

      <p class="sa-sub" style="margin:8px 0 10px">Advertising billed without SKU attribution, balance movements carried between statements, and other account-level charges. <b>Excluded from the SKU rankings and per-SKU verdicts below</b> — judge it separately.</p>
      <div class="tblwrap"><table class="sa"><tbody>${lines.map(([k,v])=>

  const rows=[...products].sort(sorters[adpSort]||sorters.payout);
  h+=`<div style="display:flex;gap:8px;align-items:center;justify-content:flex-end;margin:14px 0 2px;flex-wrap:wrap">
      <span class="sa-sub">Sort by</span>

      <button type="button" class="fbtn" id="adp-csv">⬇ Export CSV</button>
    </div>
    <div class="sku-costall">
      <span>Product cost per unit —</span>

    ${r.haveAds?"":`<p class="sa-sub" style="margin:10px 0 4px"><b>Settlement contribution only — ad profitability pending.</b> Every figure below is what Amazon settled for the SKU. Ad spend, ACOS and profit stay blank until the Advertised Product report is loaded.</p>`}
    <div class="tblwrap"><table class="sa">
      <thead><tr><th>SKU</th><th class="num">Units</th><th class="num">Gross sales</th>
        <th class="num" title="What this SKU's own settlement lines net to — sales less Amazon's fees, taxes and refunds. Not profit: product cost is not in it.">Settlement contribution</th>
        <th class="num">Ad spend</th>
        <th class="num" title="Your cost per unit. Type it here — it saves in this browser and the SKU Profitability Report picks it up too.">Product cost</th>
        ${adpAdv&&r.haveAds?`<th class="num" title="Clicks ÷ impressions, from the ad report's own counts">CTR</th>
        <th class="num" title="Ad spend ÷ clicks">CPC</th>
        <th class="num" title="Ad orders ÷ clicks">CVR</th>
        <th class="num" title="Ad spend ÷ TOTAL settlement sales — what advertising costs the whole SKU, not just its ad-attributed sales">TACOS</th>
        <th class="num" title="How much of a sale can go on ads before this SKU stops making money. Needs a product cost.">Break-even ACOS</th>`:""}
        <th class="num" title="Ad spend ÷ this SKU's ad-attributed sales">ACOS</th>
        <th class="num">After ads${r.costed?" &amp; cost":""}</th><th>Verdict</th></tr></thead>
      <tbody>${rows.map(x=>{

        const verdict=x.orphan?(x.adSales>0?["Sales settled under another SKU","warn"]:["Ad spend, no sales","bad"])
          :!r.haveAds?["Profit cannot be determined — needs ad report","muted"]
          :!x.hasCost?["Profit cannot be determined — needs product cost","muted"]
          :x.flips?["Ads turn profit into a loss","bad"]
          :bottom>0?["Profitable after ads & cost","good"]
          :x.spend>0?["Loss after ads & product cost","bad"]
          :["Loss before ads","warn"];
        const vc=verdict[1]==="good"?"var(--green)":verdict[1]==="bad"?"var(--red)":verdict[1]==="warn"?"var(--orange)":"var(--muted)";
        const over=x.acos!==null&&x.breakEven!==null&&x.acos>x.breakEven;
        return `<tr>
          <td>${esc(x.sku)}</td>
          <td class="num">${x.units||"—"}</td>
          <td class="num">${x.sales?inr0(x.sales):"—"}</td>
          <td class="num">${x.payout?inr0(x.payout):"—"}</td>
          <td class="num">${r.haveAds?(x.spend?inr0(-x.spend):"—"):'<span class="sa-sub" title="The settlement bills advertising as one account-level service fee. Upload the Advertised Product report to split it by SKU.">Not attributed</span>'}</td>
          <td class="num"><input type="number" min="0" inputmode="decimal" class="sku-cost-in" data-cost-sku="${esc(x.sku)}" value="${x.cost?x.cost:""}" placeholder="Enter cost" aria-label="Product cost per unit for ${esc(x.sku)}"></td>
          ${adpAdv&&r.haveAds?`<td class="num">${x.ctr===null?"—":x.ctr.toFixed(2)+"%"}</td>
          <td class="num">${x.cpc===null?"—":inr(x.cpc)}</td>
          <td class="num">${x.cvr===null?"—":x.cvr.toFixed(1)+"%"}</td>
          <td class="num">${x.tacos===null?"—":x.tacos.toFixed(1)+"%"}</td>
          <td class="num">${x.breakEven===null?`<span class="sa-sub">Needs product cost</span>`:x.breakEven.toFixed(1)+"%"}</td>`:""}
          <td class="num"${over?' style="color:var(--red);font-weight:700"':""}>${x.acos===null?"—":x.acos.toFixed(1)+"%"}</td>
          <td class="num" style="font-weight:700;color:${bottom===null?"var(--muted)":bottom>0?"var(--green)":"var(--red)"}">${bottom===null?"—":inr0(bottom)}</td>
          <td class="sa-sub" style="color:${vc}">${verdict[0]}</td>
        </tr>`;}).join("")}</tbody>
    </table></div>
    <div class="banner info"><b>Ad attribution and settlement timing use different clocks.</b> ACOS uses Amazon Ads' attributed sales, while settlement contribution uses posted settlement activity, so small differences are expected. ACOS is measured against that SKU's own advertising sales and break-even ACOS against everything it actually earned — a SKU whose ACOS sits above its break-even line is being advertised at a loss. Use the result as a decision signal rather than expecting exact reconciliation at SKU level.</div>`;
  out.innerHTML=h; adpWire(out,rows);
}
function adpWire(out,rows){

  out.querySelectorAll("[data-adprm]").forEach(b=>b.addEventListener("click",()=>{
    adpFiles.splice(Number(b.dataset.adprm),1); adpRender();
  }));
  out.querySelectorAll("[data-adpsort]").forEach(b=>b.addEventListener("click",()=>{
    if(b.disabled) return;
    adpSort=b.dataset.adpsort; adpRender();
  }));
  /* Costs are entered here rather than only in the SKU report: this is where
     the seller is looking when they need to know whether a campaign pays. */
  out.querySelectorAll(".sku-cost-in").forEach(inp=>inp.addEventListener("change",()=>{
    const c=loadSkuCosts(), v=inp.value.trim();
    if(v===""||Number(v)===0) delete c[inp.dataset.costSku]; else c[inp.dataset.costSku]=Number(v)||0;
    saveSkuCosts(c); adpRender();
  }));
  const applyAll=out.querySelector("#adp-apply-all");
  if(applyAll&&rows) applyAll.addEventListener("click",()=>{
    const el=out.querySelector("#adp-cost-all"), v=el?el.value.trim():"";
    const c=loadSkuCosts();
    rows.forEach(x=>{ if(v===""||Number(v)===0) delete c[x.sku]; else c[x.sku]=Number(v)||0; });
    saveSkuCosts(c); adpRender();
  });
  const csv=out.querySelector("#adp-csv");
  if(csv&&rows) csv.addEventListener("click",()=>{
    const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const head=["SKU","Units","Sales","Payout after fees","Ad spend","Impressions","Clicks","CTR %","CPC","CVR %","ACOS %","TACOS %","Break-even ACOS %","Product cost/unit","After ads","Verdict"];
    const lines=[head.map(q).join(",")];
    for(const x of rows){
      const bottom=x.hasCost?x.profit:x.afterAds;
      const verdict=x.orphan?"Ad spend, no sales":x.flips?"Ads turn profit into a loss"
        :bottom>0?"Profitable after ads":x.spend>0?"Loss before ads too":"No ads on this SKU";
      lines.push([x.sku,x.units,x.sales.toFixed(2),x.payout.toFixed(2),x.spend.toFixed(2),
        x.impressions||"",x.clicks||"",
        x.ctr===null?"":x.ctr.toFixed(2),x.cpc===null?"":x.cpc.toFixed(2),x.cvr===null?"":x.cvr.toFixed(1),
        x.acos===null?"":x.acos.toFixed(1),x.tacos===null?"":x.tacos.toFixed(1),
        x.breakEven===null?"":x.breakEven.toFixed(1),

    document.body.appendChild(a); a.click(); a.remove();
  });
}
/* ============================================================
   ADS OPTIMIZER (Pro) — Sponsored Products Search Term report.
   The one report that says WHAT BUYERS TYPED before your ad was
   clicked. Everything here is that report read carefully: terms
   that eat spend and never convert (negate them), terms that
   convert cheaply under broad/auto (give them their own exact
   bid), terms that convert at a loss, and a campaign scoreboard.
   Same never-guess rules as everywhere: thresholds are printed,
   zero denominators read "—", and nothing is estimated.
   ============================================================ */
let adsFiles=[];
const ADS_TERM_ALIASES=["customer search term","search term"];
const ADS_CAMP_ALIASES=["campaign name"];
const ADS_GROUP_ALIASES=["ad group name","ad group"];
const ADS_MATCH_ALIASES=["match type"];
const ADS_TARGET_ALIASES=["targeting"];
/* A search term needs this much evidence before it is judged at all. */
const ADS_NEG_CLICKS=10;      // clicks with zero orders before "negate"
const ADS_NEG_SPEND=100;      // …and at least this much spend, in rupees
const ADS_PROMOTE_ORDERS=2;   // orders before a term earns its own exact match
const ADS_PROMOTE_ACOS=30;    // …at or under this ACOS
const ADS_BLEED_ACOS=100;     // converting, but every sale costs more than it brings
const ADS_CAMP_SCALE_ACOS=25; // campaign verdicts
const ADS_CAMP_FIX_ACOS=60;

/* Advertised-product report → which SKU each ad group advertises. The
   Search Term report names no SKU, so this map is the only honest bridge
   from a search term to a product — and only ad groups that advertise
   exactly ONE SKU are used. Returns null when it isn't this report. */
function parseApGroups(text){
  const lines=String(text||"").replace(/^\ufeff/,"").split(/\r\n|\r|\n/);
  let hln=-1,delim=",",norm=null;
  for(let i=0;i<lines.length&&i<30;i++){
    if(!lines[i].trim()) continue;
    const d=lines[i].includes("\t")?"\t":",";
    const n=saSplit(lines[i],d).map(adpNorm);
    if(adpFind(n,ADP_SKU_ALIASES)!==-1&&adpFind(n,ADS_CAMP_ALIASES)!==-1&&adpFind(n,ADS_GROUP_ALIASES)!==-1){hln=i;delim=d;norm=n;break;}
  }
  if(hln===-1) return null;
  const iC=adpFind(norm,ADS_CAMP_ALIASES),iG=adpFind(norm,ADS_GROUP_ALIASES),iS=adpFind(norm,ADP_SKU_ALIASES);
  const cell=(f,i)=>i>=0&&i<f.length?String(f[i]||"").trim():"";
  const m=new Map(); let rows=0;
  for(let i=hln+1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const f=saSplit(lines[i],delim);
    const camp=cell(f,iC),group=cell(f,iG),sku=cell(f,iS);
    if(!camp&&!group) continue;
    rows++;
    const k=camp+"\u0000"+group;
    if(!m.has(k)) m.set(k,new Set());
    if(sku) m.get(k).add(sku);
  }
  if(!m.size) return null;
  const groupSku=new Map();     // only unambiguous groups make the map
  for(const [k,set] of m) if(set.size===1) groupSku.set(k,[...set][0]);
  return {groupSku,groups:m.size,rows};
}
window.parseApGroups=parseApGroups; // exposed for verification/debugging

/* Search Term report → rows. Both consoles' vocabularies accepted, same as
   the advertised-product parser. Returns null when it isn't this report. */
function parseSearchTermReport(text){
  const lines=String(text||"").replace(/^﻿/,"").split(/\r\n|\r|\n/);
  let hln=-1,delim=",",norm=null;
  for(let i=0;i<lines.length&&i<30;i++){
    if(!lines[i].trim()) continue;
    const d=lines[i].includes("\t")?"\t":",";
    const n=saSplit(lines[i],d).map(adpNorm);
    if(adpFind(n,ADS_TERM_ALIASES)!==-1&&adpFind(n,ADP_SPEND_ALIASES)!==-1){hln=i;delim=d;norm=n;break;}
  }
  if(hln===-1) return null;
  const I={term:adpFind(norm,ADS_TERM_ALIASES),camp:adpFind(norm,ADS_CAMP_ALIASES),
    group:adpFind(norm,ADS_GROUP_ALIASES),match:adpFind(norm,ADS_MATCH_ALIASES),
    target:adpFind(norm,ADS_TARGET_ALIASES),
    spend:adpFind(norm,ADP_SPEND_ALIASES),sales:adpFind(norm,ADP_SALES_ALIASES),
    orders:adpFind(norm,ADP_ORDER_ALIASES),clicks:adpFind(norm,["clicks"]),
    impressions:adpFind(norm,["impressions"])};
  const cell=(f,i)=>i>=0&&i<f.length?String(f[i]||"").trim():"";
  const money=(f,i)=>{const v=saParseAmount(cell(f,i));return Number.isFinite(v)?v:0;};
  const byKey=new Map(); let rows=0;
  for(let i=hln+1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const f=saSplit(lines[i],delim);
    if(f.length<4) continue;
    const term=cell(f,I.term); if(!term) continue;
    rows++;
    /* One term can appear under several campaigns and match types, and the
       action differs per placement — negatives are added to a campaign, not
       to the account — so the key keeps all of it. */
    const camp=cell(f,I.camp),group=cell(f,I.group);
    let match=cell(f,I.match).toUpperCase();
    const target=cell(f,I.target);
    // Auto campaigns report "-" as match type; the targeting column carries
    // close-match / loose-match / complements / substitutes instead.
    if(!match||match==="-") match=/close|loose|complement|substitute/i.test(target)?"AUTO":(match||"—");
    const key=term+"␀"+camp+"␀"+group+"␀"+match;
    const e=byKey.get(key)||{term,camp,group,match,target,spend:0,sales:0,orders:0,clicks:0,impressions:0};
    e.spend+=Math.abs(money(f,I.spend));
    e.sales+=Math.abs(money(f,I.sales));
    e.orders+=Math.abs(money(f,I.orders));
    e.clicks+=Math.abs(money(f,I.clicks));
    e.impressions+=Math.abs(money(f,I.impressions));
    byKey.set(key,e);
  }
  if(!byKey.size) return null;
  return {rows,terms:[...byKey.values()]};
}
window.parseSearchTermReport=parseSearchTermReport; // exposed for verification/debugging

/* Rows → the four lists a seller can act on. Pure. */
function adsCompute(terms,opts){
  /* opts.groupSku: campaign\u0000adgroup → SKU (from the advertised-product
     report). opts.breakEven: SKU → its break-even ACOS %, computed from the
     seller's own statements and product costs. Where both exist a term is
     judged against ITS OWN line; everywhere else the 100% fallback stands —
     nothing is ever guessed onto a term. */
  opts=opts||{};
  const groupSku=opts.groupSku||new Map(), beOf=opts.breakEven||new Map();
  let termsMatched=0, termsWithBE=0;
  for(const r of terms){
    const sku=groupSku.get(r.camp+"\u0000"+r.group);
    r.sku=sku||null;
    if(sku){ termsMatched++;
      const be=beOf.get(sku);
      if(be!==undefined&&be!==null){ r.breakEven=be; termsWithBE++; }
    }
  }
  const t={spend:0,sales:0,orders:0,clicks:0,impressions:0};
  for(const r of terms){t.spend+=r.spend;t.sales+=r.sales;t.orders+=r.orders;t.clicks+=r.clicks;t.impressions+=r.impressions;}
  const acos=r=>r.sales>0?r.spend/r.sales*100:null;
  const negate=terms.filter(r=>r.orders===0&&r.clicks>=ADS_NEG_CLICKS&&r.spend>=ADS_NEG_SPEND)
    .sort((a,b)=>b.spend-a.spend);
  const promote=terms.filter(r=>{
    if(r.orders<ADS_PROMOTE_ORDERS||r.match==="EXACT") return false;
    const a=acos(r); if(a===null||a>ADS_PROMOTE_ACOS) return false;
    // "cheap" by the flat bar but above its own break-even is not a winner
    if(r.breakEven!==undefined&&a>r.breakEven) return false;
    return true;
  }).sort((a,b)=>b.sales-a.sales);
  const bleed=terms.filter(r=>{
    const a=acos(r); if(r.orders<=0||a===null) return false;
    // A term with its own break-even line is judged against it; the rest
    // keep the only threshold that needs no margin data at all.
    return r.breakEven!==undefined?a>r.breakEven:a>=ADS_BLEED_ACOS;
  }).sort((a,b)=>(b.spend-b.sales)-(a.spend-a.sales));
  // Campaign scoreboard.
  const byCamp=new Map();
  for(const r of terms){
    const e=byCamp.get(r.camp)||{camp:r.camp,spend:0,sales:0,orders:0,clicks:0,impressions:0,terms:0};
    e.spend+=r.spend;e.sales+=r.sales;e.orders+=r.orders;e.clicks+=r.clicks;e.impressions+=r.impressions;e.terms++;
    byCamp.set(r.camp,e);
  }
  const campaigns=[...byCamp.values()].map(c=>{
    const a=c.sales>0?c.spend/c.sales*100:null;
    let verdict,vk;
    if(c.sales<=0&&c.spend>=ADS_NEG_SPEND){verdict="Spend, no sales — check targeting";vk="bad";}
    else if(a!==null&&a<=ADS_CAMP_SCALE_ACOS&&c.orders>=5){verdict="Working — room to scale";vk="good";}
    else if(a!==null&&a>=ADS_CAMP_FIX_ACOS){verdict="ACOS too high — trim terms or bids";vk="warn";}
    else {verdict="Steady";vk="muted";}
    return Object.assign(c,{acos:a,verdict,vk});
  }).sort((a,b)=>b.spend-a.spend);

    acosTotal:t.sales>0?t.spend/t.sales*100:null};
